# ---------------------------------------------------------------------------
# Source registry — aircraft impact / aircraft crash (항공기 충돌) regulatory corpus
#
# Every clause record in corpus/clauses/*.yaml MUST reference a source_id below.
# `access` tells the ingest pipeline whether the verbatim text may be placed in
# corpus/raw/ and redistributed with this repository.
#
#   access: public-domain  -> US federal government works; verbatim text may be
#                             committed to corpus/raw/ and indexed in full.
#   access: free-download  -> freely downloadable but copyrighted; keep local
#                             only (corpus/raw/ is .gitignored), do not commit.
#   access: proprietary    -> licence required; never commit text. Records stay
#                             at summary level with a pointer to the source.
# ---------------------------------------------------------------------------

