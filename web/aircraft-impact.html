he assessment must be based on the beyond-design-basis impact of a large, commercial aircraft used for long distance flights in the United States, with aviation fuel loading typically used in such flights, and an impact speed and angle of impact considering the ability of both experienced and inexperienced pilots to control large, commercial aircraft at the low altitude representative of a nuclear power plant's low profile.\" Footnote 1 to this paragraph: \"Changes to the detailed parameters on aircraft impact characteristics set forth in guidance shall be approved by the Commission.\"","ko":"\"(2) 항공기 충돌 특성. 평가는 미국 내 장거리 운항에 사용되는 대형 상용항공기의 설계기준초과 충돌을 기준으로 해야 하며, 그러한 운항에 통상 사용되는 항공유 적재량과, 숙련·비숙련 조종사가 원전의 낮은 형상(low profile)에 해당하는 저고도에서 대형 상용항공기를 제어할 수 있는 능력을 고려한 충돌속도 및 충돌각도를 기준으로 한다.\" 본 항의 각주 1: \"지침에 규정된 항공기 충돌 특성의 상세 파라미터 변경은 위원회의 승인을 받아야 한다.\"","kp":{"classification":"beyond-design-basis","aircraft":"large, commercial aircraft used for long distance flights in the United States","fuel":"aviation fuel loading typically used in such flights","detailed_parameters":"set forth in guidance; changes require Commission approval"},"u":"https://www.ecfr.gov/current/title-10/chapter-I/part-50/section-50.150","nt":"CORRECTION. The previous version of this record asserted that the detailed impact characteristics are \"provided by the NRC as security-related information\". The rule says only that the detailed parameters are set forth in GUIDANCE and that changes to them require Commission approval. The withholding fact is real but lives elsewhere — RG 1.217 Section A states that the non-public versions of RG 1.217 and NEI 07-13 are handled under Safeguards Information (SGI) controls. See US-RG-1.217-sgi."},{"id":"US-10CFR50.150-a-3","s":"US-10CFR50.150","doc":"10 CFR 50.150","j":"US","loc":"10 CFR 50.150(a)(3)","he":"Applicability","hk":"적용 대상","t":["T02"],"ts":"summary","v":"primary_source","en":"The requirements of (a)(1) and (a)(2) apply to applicants for: (i) construction permits for nuclear power reactors issued under Part 50 after 13 July 2009; (ii) operating licences under Part 50 for which a construction permit was issued after 13 July 2009; (iii)(A) standard design certifications issued under Part 52 after 13 July 2009, and (B) renewal of standard design certifications in effect on 13 July 2009 which have not been amended to comply with this section by the time of application for renewal; (iv) standard design approvals issued under Part 52 after 13 July 2009; (v) combined licences under Part 52 that (A) do not reference a standard design certification, standard design approval or manufactured reactor, or (B) reference a standard design certification issued before 13 July 2009 which has not been amended to address this section; (vi) manufacturing licences under Part 52 that (A) do not reference a standard design certification or standard design approval, or (B) reference a standard design certification issued before 13 July 2009 which has not been amended to address this section.","ko":"(a)(1) 및 (a)(2)의 요건은 다음 신청자에게 적용된다: (i) 2009.7.13. 이후 Part 50에 따라 발급된 원자로 건설허가; (ii) 2009.7.13. 이후 건설허가가 발급된 원전에 대한 Part 50 운영허가; (iii)(A) 2009.7.13. 이후 Part 52에 따라 발급된 표준설계인증, (B) 2009.7.13. 시점에 유효한 표준설계인증 중 갱신 신청 시까지 본 조 요건에 맞게 개정되지 않은 것의 갱신; (iv) 2009.7.13. 이후 Part 52에 따라 발급된 표준설계승인; (v) Part 52 통합운영허가 중 (A) 표준설계인증·표준설계승인·제조원자로를 참조하지 않거나, (B) 2009.7.13. 이전 발급되어 본 조를 반영하도록 개정되지 않은 표준설계인증을 참조하는 것; (vi) Part 52 제조허가 중 (A) 표준설계인증·표준설계승인을 참조하지 않거나, (B) 2009.7.13. 이전 발급되어 본 조를 반영하지 않은 표준설계인증을 참조하는 것.","kp":{"cutoff_date":"13 July 2009","excludes":"existing operating reactors; applicants referencing a design already assessed under this section","renewal_hook":"renewal of a pre-2009 design certification pulls it into scope unless already amended"},"u":"https://www.ecfr.gov/current/title-10/chapter-I/part-50/section-50.150","nt":"The earlier summary had the gist right but missed the renewal provision in (iii)(B) and the \"reference a pre-2009 certification\" logic in (v)(B) and (vi)(B), which are the operative mechanisms that pull older designs into scope."},{"id":"US-10CFR50.150-b","s":"US-10CFR50.150","doc":"10 CFR 50.150","j":"US","loc":"10 CFR 50.150(b)","he":"Content of application","hk":"신청서 기재사항","t":["T14"],"ts":"verbatim","v":"primary_source","en":"\"(b) Content of application. For applicants identified in paragraph (a)(3) of this section, the preliminary or final safety analysis report, as applicable, must include a description of: (1) The design features and functional capabilities identified in paragraph (a)(1) of this section; and (2) How the design features and functional capabilities identified in paragraph (a)(1) of this section meet the assessment requirements in paragraph (a)(1) of this section.\"","ko":"\"(b) 신청서 기재사항. (a)(3)에 열거된 신청자의 경우, 예비 또는 최종 안전성분석보고서에 다음의 기술을 포함해야 한다: (1) (a)(1)에서 도출된 설계특성 및 기능적 능력, 그리고 (2) 해당 설계특성 및 기능적 능력이 (a)(1)의 평가 요건을 어떻게 충족하는지.\"","kp":null,"u":"https://www.ecfr.gov/current/title-10/chapter-I/part-50/section-50.150","nt":""},{"id":"US-10CFR50.150-c","s":"US-10CFR50.150","doc":"10 CFR 50.150","j":"US","loc":"10 CFR 50.150(c)","he":"Control of changes","hk":"변경관리","t":["T14"],"ts":"summary","v":"primary_source","en":"\"(c) Control of changes.\" Change control is routed through the safety-analysis-report content requirements for each licence type. If the holder changes the information required to be in the safety analysis report, it must consider the effect of the changed feature or capability on the original assessment required by 50.150(a) and amend that information to describe how the modified design features and functional capabilities continue to meet the assessment requirements in (a)(1). The hooks are: construction permits → 10 CFR 50.34(a)(13) (PSAR); operating licences → 10 CFR 50.34(b)(12) (FSAR); standard design certifications → 10 CFR 52.47(a)(28), with generic changes governed by 10 CFR 52.63; combined licences → 10 CFR 52.79(a)(47); manufacturing licences → 10 CFR 52.157(f)(32), with generic changes governed by 10 CFR 52.171. For a combined licence not itself subject to (a) but referencing a design certification or manufactured reactor that is, departures are governed by the change control requirements of the referenced design certification rule or by 10 CFR 52.171(b)(2).","ko":"\"(c) 변경관리.\" 변경관리는 허가 유형별 안전성분석보고서 기재요건을 통해 이루어진다. 보유자가 보고서에 기재하도록 요구된 정보를 변경하는 경우, 변경된 특성·능력이 50.150(a)의 원래 평가에 미치는 영향을 고려하고, 수정된 설계특성 및 기능적 능력이 (a)(1)의 평가 요건을 계속 충족하는 방식을 기술하도록 해당 정보를 개정해야 한다. 연결 조항: 건설허가 → 50.34(a)(13)(PSAR); 운영허가 → 50.34(b)(12)(FSAR); 표준설계인증 → 52.47(a)(28), 일반 변경은 52.63; 통합운영허가 → 52.79(a)(47); 제조허가 → 52.157(f)(32), 일반 변경은 52.171. 본 조 적용을 받지 않으면서 적용대상 설계인증·제조원자로를 참조하는 통합운영허가의 이탈(departure)은 참조된 설계인증 규칙의 변경관리 요건 또는 52.171(b)(2)에 따른다.","kp":{"psar_hook":"10 CFR 50.34(a)(13)","fsar_hook":"10 CFR 50.34(b)(12)","dc_hook":"10 CFR 52.47(a)(28) / 52.63","col_hook":"10 CFR 52.79(a)(47)","ml_hook":"10 CFR 52.157(f)(32) / 52.171"},"u":"https://www.ecfr.gov/current/title-10/chapter-I/part-50/section-50.150","nt":"The previous record marked this paragraph low-confidence and described it only in general terms. The substance was right — changes are controlled, not free — but the mechanism is specific: it works through the SAR content requirements, not through a standalone change process."},{"id":"US-10CFR50.150-d","s":"US-10CFR50.150","doc":"10 CFR 50.150","j":"US","loc":"10 CFR 50.150(d)","he":"Sunsetting provisions — the rule expires 8 April 2027 unless extended","hk":"일몰 조항 — 2027.4.8. 실효, 연장 없으면 종료","t":["T01","T02","T14"],"ts":"verbatim","v":"primary_source","en":"\"(d) Sunsetting provisions. This section shall cease to have effect on April 8, 2027, unless the NRC determines that the cessation deadline should be extended to a date not more than 5 years in the future after offering the public an opportunity to provide input on the costs and benefits of this section and considering that input. The NRC will publish a document in the FEDERAL REGISTER announcing its determination and revising or removing this section accordingly.\"","ko":"\"(d) 일몰 조항. 본 조는 2027년 4월 8일에 효력을 상실한다. 다만 NRC가 본 조의 비용과 편익에 관해 공중의 의견제출 기회를 제공하고 그 의견을 고려한 후, 실효기한을 5년 이내의 장래 시점으로 연장해야 한다고 결정하는 경우는 예외로 한다. NRC는 그 결정을 연방관보에 공표하고 이에 따라 본 조를 개정하거나 삭제한다.\"","kp":{"sunset_date":"2027-04-08","max_extension":"not more than 5 years","added_by":"91 FR 17762, 8 April 2026","procedure":"public input on costs and benefits, then a Federal Register determination"},"u":"https://www.ecfr.gov/current/title-10/chapter-I/part-50/section-50.150","nt":"MAJOR CORRECTION. The previous version of this database recorded 50.150(d) as \"withholding of the assessment from public disclosure ... under 10 CFR 2.390\". That is wrong. Paragraph (d) is a sunset clause added by the April 2026 amendment, and it is the single most consequential fact about the US framework's current status: unless the NRC acts, the aircraft impact rule ceases to have effect on 8 April 2027. Any comparison that treats 10 CFR 50.150 as a stable fixture should be revisited against this date."},{"id":"US-NEI-07-13-aia-inspection","s":"US-NEI-07-13","doc":"NEI 07-13","j":"US","loc":"NRC AIA inspection programme (companion to NEI 07-13)","he":"Regulatory verification of the assessment","hk":"평가에 대한 규제 확인","t":["T14"],"ts":"summary","v":"web_verified","en":"The NRC operates an Aircraft Impact Assessment (AIA) inspection programme for new reactors, verifying that the assessed key design features and functional capabilities are actually implemented in the constructed plant.","ko":"NRC는 신규 원전에 대해 항공기충돌평가(AIA) 검사 프로그램을 운영하여, 평가된 핵심 설계특성과 기능적 능력이 실제 건설된 발전소에 구현되었는지를 확인한다.","kp":null,"u":"https://www.nrc.gov/reactors/new-reactors/how-we-regulate/oversight/aia-inspections","nt":""},{"id":"US-NEI-07-13-failure-modes","s":"US-NEI-07-13","doc":"NEI 07-13","j":"US","loc":"NEI 07-13 Rev. 8P, §2 (local vs global) and §2.3","he":"Two structural failure modes; material characterisation and failure criteria","hk":"두 가지 구조 파괴모드 및 재료 특성화·파괴기준","t":["T08","T09"],"ts":"summary","v":"primary_source","en":"For containment structures and spent fuel pools two failure modes are evaluated: local failure (scabbing and perforation) and global structural response. NEI defines the local terms explicitly — penetration into the target; spalling and scabbing (ejection of material from the back face of the target); and perforation (the missile fully penetrates and passes through the target), with \"perforation velocity\" being the initial missile velocity at which perforation just occurs. §2.3 covers material properties, ductile failure strain limits, concrete structural failure criteria, material models and structural integrity failure criteria.","ko":"격납구조물과 사용후핵연료저장조에 대해 두 가지 파괴모드를 평가한다: 국부파괴(배면박리 및 관통)와 전체 구조응답. NEI는 국부 용어를 명시적으로 정의한다 — 표적으로의 침투; 표면박리(spalling) 및 배면박리(scabbing, 표적 배면에서의 재료 이탈); 관통(미사일이 표적을 완전히 통과). \"관통속도\"는 관통이 막 발생하는 미사일 초기속도를 뜻한다. §2.3은 재료물성, 연성파괴 변형률한계, 콘크리트 구조파괴기준, 재료모델, 구조건전성 파괴기준을 다룬다.","kp":null,"u":"https://www.nrc.gov/docs/ML1114/ML111440006.pdf","nt":""},{"id":"US-NEI-07-13-fire-spurious","s":"US-NEI-07-13","doc":"NEI 07-13","j":"US","loc":"NEI 07-13 Rev. 8P, §1 Objectives — uncertainties; §3 Heat Removal Capability","he":"Fire damage footprint and spurious actuations","hk":"화재손상 영역 및 오작동","t":["T11","T15"],"ts":"summary","v":"primary_source","en":"Fire-induced spurious actuations cannot be modelled accurately, so the guidance holds applicants accountable for assuming the loss of ALL equipment and cables within the fire damage footprint, including cables inside the footprint whose loss disables equipment outside it. Evaluating hot-short-induced spurious actuations for every fire area is judged too complex and unpredictable for this beyond-design-basis assessment; the 10 CFR 50.54(hh)(2) mitigation strategies developed by each COL applicant are relied on to inherently address that uncertainty, together with the multiple redundant trains with complete fire separation in new reactor designs.","ko":"화재유발 오작동은 정확한 모델링이 불가능하므로, 본 지침은 신청자가 화재손상 영역 내의 **모든** 기기와 케이블의 상실을 가정하도록 하며, 영역 내 케이블 상실로 영역 밖 기기가 상실되는 경우도 포함한다. 모든 화재구역에 대해 hot short로 인한 오작동을 평가하는 것은 이 설계기준초과 평가에서는 지나치게 복잡·예측불가능하다고 판단하여, 각 COL 신청자가 개발하는 10 CFR 50.54(hh)(2) 완화전략과 신규 노형의 완전 화재분리된 다중 여유 트레인이 해당 불확실성을 본질적으로 해소하는 것으로 본다.","kp":{"fire_rule":"assume loss of all equipment and cables within the fire damage footprint","linked_requirement":"10 CFR 50.54(hh)(2) mitigation strategies"},"u":"https://www.nrc.gov/docs/ML1114/ML111440006.pdf","nt":"Important for CW-11: 50.150(a)(1) says \"reduced use of operator actions\", yet the methodology leans on 50.54(hh)(2) mitigation strategies, which are operator-implemented. The two are reconciled by timing — mitigation need only be implementable before the ultimate pressure capability is challenged."},{"id":"US-NEI-07-13-local-formulas","s":"US-NEI-07-13","doc":"NEI 07-13","j":"US","loc":"NEI 07-13 Rev. 8P, §2.1.2 Local Loading Formulas (2.1.2.1-2.1.2.3)","he":"Local damage: the specific empirical formulas adopted","hk":"국부손상: 채택된 구체적 경험식","t":["T08"],"ts":"summary","v":"primary_source","en":"NEI 07-13 adopts named empirical correlations for local damage of reinforced concrete by hard missiles (principally the engine): - penetration into the target / engine casing: the Modified NDRC (National Defense\n  Research Committee) formula;\n- wall thickness required to prevent scabbing (ts): the reduced Chang formula [ref 4]; - wall thickness required to prevent perforation (tp): the reduced Degen formula [ref 4]; - perforation velocity (VP), used for residual velocity of the missile after\n  perforation: the CEA-EDF formula with a wall thickness reduction factor\n  alpha_EDF = 0.75, following Kar [ref 5].\nNEI notes that a comparison of the Degen, CEA-EDF, Chang and CRIEPI formulas for the wall thickness required to prevent perforation shows each gives a comparable estimate of the perforation velocity VP. The formulas are applied to a \"compact, high density, but crushable\" engine, and the methodology also treats residual crushability after perforation of a primary wall.","ko":"NEI 07-13은 경성 미사일(주로 엔진)에 의한 철근콘크리트 국부손상에 대해 다음의 명시적 경험식을 채택한다: - 표적/엔진 케이싱 침투: **Modified NDRC** 식 - 배면박리 방지 소요 벽두께(ts): **reduced Chang** 식 [참고문헌 4] - 관통 방지 소요 벽두께(tp): **reduced Degen** 식 [참고문헌 4] - 관통속도(VP, 관통 후 잔류속도 산정에 사용): Kar[참고문헌 5]에 따른 **CEA-EDF** 식,\n  벽두께 감소계수 alpha_EDF = 0.75 적용\nNEI는 관통 방지 벽두께에 대한 Degen, CEA-EDF, Chang, CRIEPI 식의 비교 결과 각 식이 관통속도 VP에 대해 유사한 추정치를 준다고 기술한다. 이 식들은 \"치밀하고 밀도가 높으나 압괴 가능한\" 엔진에 적용되며, 1차 벽체 관통 이후의 잔류 압괴성도 다룬다.","kp":{"penetration":"Modified NDRC","scabbing_thickness":"reduced Chang","perforation_thickness":"reduced Degen","perforation_velocity":"CEA-EDF with wall thickness reduction factor alpha_EDF = 0.75 (per Kar)","compared_formulas":["Degen","CEA-EDF","Chang","CRIEPI"]},"u":"https://www.nrc.gov/docs/ML1114/ML111440006.pdf","nt":"This resolves the open technical question previously recorded in crosswalk CW-08."},{"id":"US-NEI-07-13-riera","s":"US-NEI-07-13","doc":"NEI 07-13","j":"US","loc":"NEI 07-13 Rev. 8P, §2.2 Global Loading (2.2.2-2.2.5)","he":"Global loading: the prescribed Riera force-time history","hk":"전체하중: 규정된 Riera 하중-시간 이력","t":["T03","T07"],"ts":"summary","v":"primary_source","en":"Global loading is developed as an impact force time history using the Riera loading function, which \"provides a simple method to approximate\" the impact force. Because the Riera method degrades when applied to structures undergoing significant deformation, §2.2.5 provides a missile-target interaction method of analysis: it uses a hypothetical aircraft whose impact on a non-compliant (rigid) target matches the force-time history of the prescribed Riera function. NEI notes that \"the aircraft rule requires assessment of a 'large commercial aircraft' and does not define a unique model of the aircraft nor its initial impact velocity\", and that the Riera function is \"provided to the vendors\" — i.e. the numerical load definition is supplied outside the public document.","ko":"전체하중은 Riera 하중함수를 이용한 충돌력 시간이력으로 산정하며, Riera 방법은 충돌력을 근사하는 간편한 방법을 제공한다. 다만 큰 변형이 발생하는 구조물에 적용할 때 정확도가 저하되므로, §2.2.5는 미사일-표적 상호작용 해석법을 제시한다. 이는 비순응(강체) 표적에 대한 충돌이 규정된 Riera 함수의 하중-시간 이력과 일치하는 가상 항공기를 사용하는 방법이다. NEI는 \"항공기 규정은 '대형 상용항공기'의 평가를 요구할 뿐 항공기의 고유 모델이나 초기 충돌속도를 정의하지 않는다\"고 밝히며, Riera 함수는 \"공급사에게 제공된다\"고 기술한다 — 즉 수치적 하중 정의는 공개문서 밖에서 공급된다.","kp":{"load_function":"Riera force-time history (prescribed, supplied to vendors)","alternative":"§2.2.5 missile-target interaction using a hypothetical aircraft matched to the Riera function","public_availability":"the Riera function values are not in the public document"},"u":"https://www.nrc.gov/docs/ML1114/ML111440006.pdf","nt":"Resolves the threat-parameter question from the US side: even the endorsed methodology does not publish the load. This confirms CW-03 — a numeric benchmark against EUR or Czech values is impossible from public sources."},{"id":"US-NEI-07-13-scope","s":"US-NEI-07-13","doc":"NEI 07-13","j":"US","loc":"NEI 07-13 Rev. 8P, scope","he":"Purpose and scope of the methodology","hk":"방법론의 목적 및 범위","t":["T01","T02","T06"],"ts":"summary","v":"primary_source","en":"NEI 07-13 Rev. 8P (April 2011, prepared for NEI by ERIN Engineering & Research with EPRI) is a methodology assisting NSSS vendors and combined licence applicants in assessing the physical, shock and fire effects of a large commercial aircraft impact on reactor structures containing nuclear fuel (containment and spent fuel pool) and other structures containing equipment needed to remove fuel heat. Its main parts are: §2 Containment Structures and Spent Fuel Pools, §3 Heat Removal Capability.","ko":"NEI 07-13 Rev.8P(2011년 4월, ERIN Engineering & Research가 EPRI와 함께 NEI를 위해 작성)는 원자로공급사 및 통합운영허가 신청자가 대형 상용항공기 충돌의 물리적·충격·화재 영향을, 핵연료를 포함한 원자로 구조물(격납건물, 사용후핵연료저장조)과 연료 붕괴열 제거에 필요한 기기를 수용한 기타 구조물에 대해 평가하도록 지원하는 방법론이다. 주요 구성은 제2장 격납구조물 및 사용후핵연료저장조, 제3장 열제거 능력이다.","kp":{"revision":"8P, April 2011","preparer":"ERIN Engineering & Research, Inc. (with EPRI)","structure":["§2 Containment Structures and Spent Fuel Pools","§3 Heat Removal Capability"]},"u":"https://www.nrc.gov/docs/ML1114/ML111440006.pdf","nt":""},{"id":"US-NEI-07-13-sufficiency","s":"US-NEI-07-13","doc":"NEI 07-13","j":"US","loc":"NEI 07-13 Rev. 8P, §2.5 Sufficiency Criteria (2.5.1, 2.5.2)","he":"Sufficiency criteria: containment intact and spent fuel pool integrity","hk":"충족기준: 격납건전성 및 사용후핵연료저장조 건전성","t":["T12","T15"],"ts":"summary","v":"primary_source","en":"§2.5.1 Containment Intact — the containment is acceptable if it is maintained intact from both the local and global impact analyses: structural analyses must show that perforation of a steel containment, or of a concrete containment with steel liner, does not occur on impact, AND that the containment ultimate pressure capability given a core damage event would not be exceeded before effective mitigation strategies can be implemented. \"Effective mitigation strategies\" are those that, for an indefinite period, provide sufficient cooling to the damaged core or containment to keep temperature and pressure below the ultimate pressure capability as defined in DCD/FSAR Chapter 19. For BWRs, actuation of the wetwell vent line is acceptable as a designed, scrubbed release. If the containment structure is damaged, a revised ultimate pressure capability for the damaged condition must be determined. §2.5.2 Spent Fuel Pool Integrity — localized crushing and cracking of the pool concrete wall is acceptable provided the analyses conclude the impact does not result in leakage through the spent fuel pool liner below the required minimum water level (the minimum operating level required by technical specifications). An impact at an elevation below the pool that could cause subsequent collapse of the pool supporting structure must also be evaluated as appropriate.","ko":"§2.5.1 격납건전성 — 국부 및 전체 충돌해석 모두에서 격납이 건전하게 유지되면 수용된다. 구조해석으로 (i) 충돌 시 강재 격납 또는 강재 라이너를 갖는 콘크리트 격납의 관통이 발생하지 않고, (ii) 노심손상 사건 발생 시 유효한 완화전략을 시행할 수 있기 전에 격납 최대압력능력이 초과되지 않음을 보여야 한다. \"유효한 완화전략\"이란 무기한으로 손상된 노심 또는 격납에 충분한 냉각을 제공하여 DCD/FSAR 19장에 정의된 최대압력능력 이하로 온도·압력 도전을 제한하는 전략이다. BWR의 경우 wetwell 벤트라인 작동은 설계된 스크러빙 방출이므로 수용 가능하다. 격납구조물이 손상된 경우에는 손상상태를 고려한 최대압력능력을 재산정해야 한다. §2.5.2 사용후핵연료저장조 건전성 — 저장조 콘크리트 벽의 국부적 압괴·균열은, 해석 결과 충돌이 요구 최소수위(기술지침서가 요구하는 최소운전수위) 아래에서 저장조 라이너를 통한 누설을 야기하지 않는다면 수용 가능하다. 저장조보다 낮은 표고에서의 충돌로 저장조 지지 구조물이 후속 붕괴할 가능성도 필요 시 평가해야 한다.","kp":{"containment_test_1":"no perforation of steel containment or steel-lined concrete containment","containment_test_2":"ultimate pressure capability not exceeded before effective mitigation strategies implemented","bwr_allowance":"wetwell vent line actuation acceptable (designed, scrubbed release)","sfp_test":"no liner leakage below required minimum water level; localized crushing/cracking acceptable"},"u":"https://www.nrc.gov/docs/ML1114/ML111440006.pdf","nt":"Note how much more permissive this is than a design-basis criterion: localized crushing and cracking of the SFP wall is explicitly acceptable, and core damage is presumed in the containment test. This is the practical face of \"beyond design basis with realistic analysis\" in 10 CFR 50.150."},{"id":"US-RG-1.217-bdb-consequence","s":"US-RG-1.217","doc":"Regulatory Guide 1.217","j":"US","loc":"RG 1.217, Section B (Discussion), Background","he":"Beyond-design-basis status and its regulatory consequence","hk":"설계기준초과 지위와 그 규제상 귀결","t":["T04","T12"],"ts":"summary","v":"primary_source","en":"The NRC has determined that the impact of a large, commercial aircraft is a beyond-design-basis event, and that NRC requirements applying to the design, construction, testing, operation and maintenance of design features and functional capabilities for DESIGN-BASIS events will NOT apply to design features or functional capabilities selected by the applicant solely to meet the requirements of the aircraft impact rule. The objective of the rule is to require designers to rigorously assess their designs to identify features and capabilities providing additional inherent protection; the rule provides protection beyond the existing adequate protection requirements applicable to currently operating reactors. The 2009 rulemaking (74 FR 28111, 12 June 2009) also touched 10 CFR 50.8, 50.34, 52.47, 52.59, 52.79, 52.137 and 52.157.","ko":"NRC는 대형 상용항공기 충돌을 설계기준초과 사건으로 판단하였으며, 설계기준사건에 대한 설계특성·기능적 능력의 설계·건설·시험·운전·정비에 적용되는 NRC 요건은 신청자가 **오로지 항공기 충돌 규정 충족만을 위해** 선정한 설계특성·기능적 능력에는 **적용되지 않는다**고 하였다. 본 규정의 목적은 설계자가 자신의 설계를 엄밀히 평가하여 추가적 고유 방호를 제공하는 특성·능력을 도출하도록 하는 것이며, 기존 가동원전에 적용되는 적정방호 요건을 넘어서는 방호 수준을 제공한다. 2009년 규칙제정(74 FR 28111, 2009.6.12.)은 50.8, 50.34, 52.47, 52.59, 52.79, 52.137, 52.157도 함께 다루었다.","kp":{"determination":"large commercial aircraft impact is a beyond-design-basis event","consequence":"design-basis requirements do not attach to features selected solely for this rule","rulemaking_cite":"74 FR 28111, 12 June 2009"},"u":"https://www.nrc.gov/docs/ML0929/ML092900004.pdf","nt":"This is the cleanest available statement of what \"beyond design basis\" buys an applicant in the US system, and the sharpest contrast with the Czech decree, where the accidental crash sits inside the design basis and therefore does carry design-basis obligations. See CW-04."},{"id":"US-RG-1.217-implementation","s":"US-RG-1.217","doc":"Regulatory Guide 1.217","j":"US","loc":"RG 1.217, Section D (Implementation)","he":"Voluntary use and backfit posture","hk":"임의적 사용 및 백피트 입장","t":["T01","T14"],"ts":"summary","v":"primary_source","en":"Applicants and licensees may voluntarily use the guidance to demonstrate compliance with the underlying regulations. Methods or solutions that differ may be deemed acceptable if they give the staff sufficient basis to verify compliance. Current licensees may continue using guidance the NRC previously found acceptable as long as their licensing basis is unchanged. Licensees may use the guide for actions not requiring NRC review and approval, such as changes to a facility design under 10 CFR 50.59. The section also describes how the staff complies with the Backfit Rule (10 CFR 50.109) and Part 52 finality provisions.","ko":"신청자와 허가보유자는 기저 규정의 준수 입증을 위해 본 지침을 임의로 사용할 수 있다. 다른 방법·해법도 실무진이 준수를 확인할 충분한 근거를 제공하면 수용될 수 있다. 기존 허가보유자는 허가기준이 변경되지 않는 한 NRC가 이전에 수용한 지침을 계속 사용할 수 있다. 10 CFR 50.59에 따른 시설 설계변경 등 NRC 심사·승인이 불필요한 조치에도 본 지침을 사용할 수 있다. 본 절은 실무진이 백피트 규칙(10 CFR 50.109) 및 Part 52 확정성 조항을 준수하는 방식도 기술한다.","kp":null,"u":"https://www.nrc.gov/docs/ML0929/ML092900004.pdf","nt":""},{"id":"US-RG-1.217-position","s":"US-RG-1.217","doc":"Regulatory Guide 1.217","j":"US","loc":"RG 1.217, Section C (Regulatory Position), items 1-3","he":"Regulatory Position — endorsement and its explicit limitation","hk":"규제입장 — 승인과 그 명시적 한계","t":["T01","T07","T08","T09","T10","T11","T12"],"ts":"verbatim","v":"primary_source","en":"\"1. The NRC staff (staff) considers conformance with the guidance in NEI 07-13, Revision 8, an acceptable method for use in satisfying the NRC's requirements in 10 CFR 50.150(a) regarding the assessment of aircraft impacts for new nuclear power reactors. 2. NEI 07-13 references other documents, but this RG does not endorse any of the referenced documents. 3. Licensees or applicants may use methods other than those provided in NEI 07-13, Revision 8, to meet the requirements of 10 CFR 50.150(a). The staff will review such methods and determine their acceptability on a case-by-case basis.\"","ko":"\"1. NRC 실무진은 NEI 07-13 Rev.8의 지침에 부합하는 것을, 신규 원전의 항공기 충돌 평가에 관한 10 CFR 50.150(a) 요건 충족의 수용 가능한 방법으로 본다. 2. NEI 07-13은 다른 문서들을 참조하고 있으나, 본 규제지침은 그 참조문서들 중 어느 것도 승인하지 않는다. 3. 허가보유자 또는 신청자는 10 CFR 50.150(a) 요건 충족을 위해 NEI 07-13 Rev.8이 제시한 것 외의 방법을 사용할 수 있다. 실무진은 그러한 방법을 심사하여 사안별로 수용 여부를 판단한다.\"","kp":{"endorsed":"NEI 07-13 Revision 8 (April 2011)","limitation":"referenced documents inside NEI 07-13 are NOT endorsed","alternatives":"permitted, reviewed case-by-case"},"u":"https://www.nrc.gov/docs/ML0929/ML092900004.pdf","nt":"CORRECTION AND KEY FINDING. The previous version of this database recorded that no qualifying clause could be found and treated the endorsement as possibly unqualified. Position 2 is exactly such a qualification, and it bites precisely where CW-08 lands: the empirical local-damage correlations NEI 07-13 adopts — Modified NDRC, reduced Chang, reduced Degen, CEA-EDF per Kar — are drawn from NEI 07-13's REFERENCED documents, which this guide expressly does not endorse. The NRC endorses the method as assembled in NEI 07-13, not the underlying correlation literature."},{"id":"US-RG-1.217-purpose","s":"US-RG-1.217","doc":"Regulatory Guide 1.217","j":"US","loc":"RG 1.217, Section A (Introduction)","he":"Purpose and the endorsement of NEI 07-13","hk":"목적 및 NEI 07-13 승인","t":["T01","T02"],"ts":"summary","v":"primary_source","en":"RG 1.217 (August 2011; draft issued as DG-1176, July 2009) describes a method the NRC staff considers acceptable for satisfying 10 CFR Part 50 regarding the consideration of aircraft impacts for new nuclear power reactors. It endorses the methodologies described in NEI 07-13, Revision 8, dated April 2011 (public version at ADAMS ML111440006). Regulatory guides are not substitutes for regulations and compliance with them is not required; differing methods are acceptable if they provide a basis for the findings required for issuance or continuance of a permit or licence.","ko":"RG 1.217(2011년 8월, 초안 DG-1176, 2009년 7월)은 신규 원전의 항공기 충돌 고려에 관한 10 CFR Part 50 요건 충족에 NRC 실무진이 수용 가능하다고 보는 방법을 기술한다. NEI 07-13 Rev.8(2011년 4월, 공개본 ADAMS ML111440006)에 기술된 방법론을 승인한다. 규제지침은 규정을 대체하지 않으며 준수가 강제되지 않는다. 다른 방법도 허가 발급·유지에 필요한 판단의 근거를 제공하면 수용된다.","kp":null,"u":"https://www.nrc.gov/docs/ML0929/ML092900004.pdf","nt":""},{"id":"US-RG-1.217-sgi","s":"US-RG-1.217","doc":"Regulatory Guide 1.217","j":"US","loc":"RG 1.217, Section A (Introduction) — non-public versions","he":"Safeguards Information control of the detailed methodology","hk":"상세 방법론의 안전조치정보(SGI) 통제","t":["T03","T13","T14"],"ts":"summary","v":"primary_source","en":"Non-public versions of this RG and of NEI 07-13 contain more specific details about the methodology used in performing aircraft impact assessments and are handled under Safeguards Information (SGI) controls. Because the non-public guidance documents contain SGI, they are made available only to individuals who have a need to know and are otherwise qualified to access SGI. Plant designers, including their employees and agents, who meet the NRC's requirements for access to SGI are entitled to use the more detailed guidance documents to perform the assessments.","ko":"본 규제지침과 NEI 07-13의 비공개본은 항공기 충돌 평가 수행에 사용되는 방법론에 관한 더 구체적인 세부사항을 담고 있으며 안전조치정보(SGI) 통제 하에 취급된다. 비공개 지침문서가 SGI를 포함하므로, 알 필요가 있고 SGI 접근 자격을 갖춘 자에게만 제공된다. SGI 접근 요건을 충족하는 발전소 설계자(그 임직원 및 대리인 포함)는 평가 수행을 위해 상세 지침문서를 사용할 수 있다.","kp":{"control_regime":"Safeguards Information (SGI)","who_may_access":"need to know + SGI qualification; plant designers and their agents","what_is_withheld":"the more specific methodology details, in non-public versions of RG 1.217 and NEI 07-13"},"u":"https://www.nrc.gov/docs/ML0929/ML092900004.pdf","nt":"This record carries the withholding fact that the previous database version wrongly attributed to 10 CFR 50.150(d). The mechanism is SGI control of the non-public guidance, not a provision of the rule itself. It confirms CW-03: the numeric threat parameters are genuinely unavailable to anyone outside the SGI-cleared population."}],"crosswalk":[{"id":"CW-01","topic":"T01","qe":"What kind of instrument carries the aircraft impact requirement, and is it binding?","qk":"항공기 충돌 요건은 어떤 형식의 문서가 담고 있으며 구속력이 있는가?","ko":"미국은 구속력 있는 연방규정(10 CFR 50.150)이 '평가 의무'만 규정하고, 기술적 방법론은 비구속 규제지침(RG 1.217)이 승인한 산업계 문서(NEI 07-13)에 있다. 체코는 반대로, 구속력 있는 시행령(329/2017 Sb.)이 설계기준 자체를 직접 규정하되 상세 해석방법은 규정하지 않는다. EUR은 법령이 아닌 계약문서이고, IAEA·WENRA는 비구속 권고이다.","div":"","cl":["US-10CFR50.150-a-1","US-RG-1.217-position","CZ-263-2016-design-basis-definition","CZ-263-2016-s46-design-duty","CZ-263-2016-enabling","EU-EUR-scope","IAEA-SSR-2-1-req17","IAEA-SSG-68-scope","EU-WENRA-TU1-objective"],"pos":[{"s":"US-10CFR50.150","rel":"baseline","n":"Binding rule; states the duty and the acceptance criteria, contains no methodology."},{"s":"US-RG-1.217","rel":"baseline","n":"Non-binding guide; supplies the method by endorsing NEI 07-13 Rev. 8."},{"s":"CZ-329-2017","rel":"different-architecture","n":"Binding decree that itself fixes the design-basis selection rule; method left to the applicant."},{"s":"CZ-263-2016","rel":"different-architecture","n":"The Act itself defines design bases to span internal AND EXTERNAL threats and events (§ 2), and § 46(2)(e) obliges the design to ensure resistance against dangers from site properties and external influences. § 236 delegates the detail to SÚJB decrees."},{"s":"EU-EUR","rel":"different-architecture","n":"Contractual utility requirement; binds only via the procurement contract."},{"s":"IAEA-SSR-2-1","rel":"partial","n":"Requirement 17 is the top-level obligation — identify all foreseeable internal and external hazards, including human induced events, and evaluate their effects. Safety Requirements are non-binding until nationally adopted; SSG-68 paras. 5.161-5.192 elaborate this requirement for aircraft crash."},{"s":"IAEA-SSG-68","rel":"partial","n":"Non-binding recommendations; becomes binding only through national adoption."},{"s":"EU-WENRA-SRL","rel":"partial","n":"Harmonisation reference implemented through member regulators."}]},{"id":"CW-02","topic":"T02","qe":"Which plants are covered — new build only, or the existing fleet as well?","qk":"적용 대상이 신규 원전에 한정되는가, 기존 원전도 포함하는가?","ko":"미국 규정은 신규 원전 신청자에게만 적용되는 장래효 규정이다. 체코 시행령은 원자로 열출력 50 MW 초과 시설이라는 출력 기준으로 적용범위를 정한다. IAEA SRS 86/87/88은 기존 원전과 신규 원전 모두를 대상으로 방법론을 기술한다.","div":"","cl":["US-10CFR50.150-a-3","CZ-329-2017-aircraft-dbe","CZ-378-2016-scope","EU-2014-87-framework","IAEA-SSR-2-1-req17","IAEA-SRS-86-framework"],"pos":[{"s":"US-10CFR50.150","rel":"baseline","n":"New reactor applicants only (DC, SDA, COL, ML, CP, OL); existing fleet excluded."},{"s":"CZ-329-2017","rel":"different-architecture","n":"Applicability keyed to reactor thermal power > 50 MW, not to licensing vintage."},{"s":"IAEA-SSR-2-1","rel":"partial","n":"Para. 5.17: the design shall consider natural and human induced external events identified in the SITE EVALUATION PROCESS, with causation and likelihood considered in postulating hazards — the same siting-to-design handoff Czech decree 378/2016 § 20(b)(8) makes procedurally."},{"s":"IAEA-SRS-86","rel":"partial","n":"Explicitly addresses application to both existing and new plants."},{"s":"CZ-378-2016","rel":"different-architecture","n":"Siting decree in force 1 Jan 2017 applies at the siting stage for every nuclear installation, with the aircraft fall the first-listed human-induced phenomenon (§ 3(1)(b)(1)); § 20(b)(8) hands the resulting design requirements to the design decree."},{"s":"EU-2014-87-EURATOM","rel":"different-architecture","n":"Art. 8a(2)(a) applies the safety objective to installations first licensed for construction after 14 August 2014; 8a(2)(b) makes it a reference for improving existing ones."}]},{"id":"CW-03","topic":"T03","qe":"How is the aircraft threat defined, and are the numbers public?","qk":"항공기 위협은 어떻게 정의되며, 수치는 공개되는가?","ko":"가장 큰 실무적 차이. 미국은 '미국 내 장거리 운항 대형 상용항공기'라는 정성적 정의만 공개하고, 질량·속도·연료량 등 구체적 수치는 보안정보로 비공개한다. 체코는 위협을 수치로 지정하지 않고 '빈도 1E-7/년 초과 물체의 영향 강도'라는 확률기준으로 도출하게 한다. EUR은 복수의 위협 시나리오를 명시하나 문서가 유료·비공개다. 따라서 세 체계의 위협 파라미터를 직접 수치 비교하는 것은 공개자료만으로는 불가능하다.","div":"CRITICAL for any benchmarking exercise: a numeric comparison of threat parameters between the US, Czech and EUR frameworks cannot be performed from public sources. Comparison is only meaningful at the level of method and acceptance logic. REVISED after reading the EUR chapter tables of contents. The three frameworks are not three treatments of one event. EUR's ACCIDENTAL case is a light aircraft and a military aircraft; the US case is a large commercial aircraft; the Czech case is any falling object above 1E-7/yr, aircraft or not. EUR reaches the large aircraft only through its INTENTIONAL case, filed under Security. So \"aircraft crash\" names a different physical event in each framework before any question of design basis or acceptance criteria arises — which is a stronger caution than this database previously carried.","cl":["US-10CFR50.150-a-2","US-NEI-07-13-riera","CZ-329-2017-aircraft-dbe","EU-EUR-aircraft-structure","IAEA-SSG-68-5.161-hazard-input","IAEA-SSG-68-5.181-fire"],"pos":[{"s":"US-10CFR50.150","rel":"baseline","n":"Qualitative definition public; impact speed/angle/mass/fuel supplied by NRC as security-related information."},{"s":"CZ-329-2017","rel":"different-architecture","n":"No prescribed aircraft; the threat is whatever object exceeds the 1E-7/yr fall frequency at the site."},{"s":"EU-EUR","rel":"different-architecture","n":"STRUCTURE now known from the public ToC, VALUES still licensed. The ACCIDENTAL design case is a Light Aircraft load function (Ch. 2.4 §1.3.3.1.1) and a Military Aircraft load function (§1.3.3.1.2) — not a large commercial aircraft. The large-aircraft threat is carried by the INTENTIONAL case (§1.3.3.2), which Ch. 2.1 files under §8.3 Security."},{"s":"IAEA-SSG-68","rel":"partial","n":"Recommends how to characterise the hazard; does not prescribe a threat aircraft."}]},{"id":"CW-04","topic":"T04","qe":"Is the large aircraft impact a design-basis event or a beyond-design-basis event?","qk":"대형 항공기 충돌은 설계기준사건인가, 설계기준초과사건인가?","ko":"미국은 명시적으로 설계기준초과(BDB)로 두고, 보수적 설계기준 해석이 아닌 현실적 (realistic) 해석을 요구한다. 체코는 우발적 항공기 추락을 설계기준 안에 두고, 빈도 기준을 넘으면 설계기준 외부 기인사건으로 편입한다. EUR과 최근 IAEA 문서는 DBEE와 BDBEE(DEC) 두 수준을 모두 정의하는 다단계 구조를 취한다. 즉 세 체계는 같은 사건을 서로 다른 규제 계층에 배치하고 있으며, 이것이 요건 대 요건 매핑이 성립하지 않는 근본 원인이다.","div":"This is the single largest divergence in the corpus, and both sides are now confirmed from primary text. 10 CFR 50.150(a)(1) requires \"realistic analyses\" and RG 1.217 Section B states that design-basis requirements for design, construction, testing, operation and maintenance do NOT attach to features selected solely for the aircraft rule. Decree 329/2017 § 12(1) requires basic external design events — which include the accidental aircraft fall under § 11(4)(b) — to be treated with a CONSERVATIVE APPROACH. So the same physical event is analysed best-estimate in the US and conservatively in Czechia, and only the Czech result carries design-basis obligations. A NEW AND OVERRIDING CONSIDERATION: 10 CFR 50.150(d), added in April 2026, sunsets the entire US rule on 8 April 2027 unless the NRC extends it. The US side of this comparison has an expiry date; the Czech and IAEA sides do not. WHY THE CZECH SIDE LOOKS AS IT DOES: WENRA reference level TU4.2 requires a 1E-4/yr design basis exceedance frequency, a 0.1 g seismic floor regardless of frequency, and a defined design basis event for accidental airplane crashes to ensure minimum protection. Decree 329/2017 § 11(3), § 11(4)(a) and § 11(4)(b) reproduce that three-part structure almost literally. The Czech placement of the crash inside the design basis is therefore not a national idiosyncrasy but a transposition of the European harmonised expectation.","cl":["US-10CFR50.150-a-1","US-10CFR50.150-a-2","US-RG-1.217-bdb-consequence","CZ-329-2017-aircraft-dbe","CZ-329-2017-conservative-approach","EU-EUR-aircraft-structure","IAEA-SSG-68-scope","IAEA-SSG-68-5.192-bdb","IAEA-SSG-68-5.185-confinement","EU-WENRA-TU4-design-basis","EU-WENRA-TU1-objective","IAEA-SRS-88-margins"],"pos":[{"s":"US-10CFR50.150","rel":"baseline","n":"Explicitly beyond design basis; realistic (best-estimate) analysis, not design-basis conservatism."},{"s":"CZ-329-2017","rel":"different-architecture","n":"Accidental crash sits INSIDE the design basis once the frequency criterion is met."},{"s":"EU-EUR","rel":"different-architecture","n":"Ch. 2.1 §2 runs Design Basis Accidents → Design Extension Conditions (Complex Sequences, Severe Accidents) → Practical elimination, and §2.6 splits hazard identification into STANDARD DESIGN and SITE-SPECIFIC. The accidental aircraft crash sits in the standard-design layer, so every EUR plant carries the same fixed load function regardless of site."},{"s":"IAEA-SSG-68","rel":"equivalent","n":"Covers both levels explicitly: para. 5.185 requires no perforation for an ACCIDENTAL crash (design basis), while para. 5.192 handles a BEYOND design basis crash by fully fuelled commercial airplanes with a best-estimate margin assessment. The closest structural match to the US posture, plus a design-basis layer the US rule lacks."},{"s":"US-RG-1.217","rel":"baseline","n":"States the consequence of the BDB determination: NRC requirements for design-basis events do NOT apply to design features or functional capabilities selected solely to meet the aircraft impact rule."},{"s":"EU-2014-87-EURATOM","rel":"different-architecture","n":"Art. 3 supplies the shared vocabulary: 'design basis' is the range of conditions and events taken explicitly into account so the installation withstands them within authorised limits by planned operation of safety systems; 'severe conditions' are more severe than design basis accidents. Art. 8b(1) requires both (d) design basis accidents and (e) severe conditions to be controlled."},{"s":"CZ-263-2016","rel":"different-architecture","n":"§ 2 defines design bases to span internal AND external threats and events — the statutory reason the Czech accidental crash sits inside the design basis."},{"s":"EU-WENRA-SRL","rel":"different-architecture","n":"TU4.2: design basis events at an exceedance frequency not higher than 1E-4/yr; a 0.1 g seismic floor regardless of frequency; and for accidental airplane crashes a design basis event SHALL be defined to ensure minimum protection. TU1.1 covers both design basis and design extension conditions; footnote 88 excludes malicious acts."},{"s":"IAEA-SRS-88","rel":"partial","n":"Supplies the margin-assessment layer that the BDB level needs."}]},{"id":"CW-05","topic":"T05","qe":"Is there an explicit probabilistic screening criterion for including aircraft crash?","qk":"항공기 추락 포함 여부를 정하는 명시적 확률 스크리닝 기준이 있는가?","ko":"체코와 IAEA는 사실상 동일한 기준을 쓴다. 체코 시행령의 '1천만 년에 1회 초과'는 IAEA의 스크리닝 확률수준(SPL) 1E-7/원자로-년과 같은 값이다. 반면 미국 10 CFR 50.150은 확률 스크리닝을 두지 않는다 — 대형 상용항공기 충돌은 빈도와 무관하게 규정에 의해 직접 지정된 결정론적 시나리오이다.","div":"Strongest quantitative link in the crosswalk: CZ 329/2017 and the IAEA level are the same 1E-7/yr figure. Three caveats now verified against the primary text of SSG-68: (1) the IAEA presents it as what \"some States\" use, NOT as an IAEA-mandated value; (2) it is conservative only when applied to ALL events of one type collectively — applying 1E-7 to a single crash scenario is a different and less conservative reading; (3) SSG-68 adds a procedural requirement absent from the Czech decree: where an SPL approach is used, the annual exceedance frequency must be AGREED BEFORE the site hazard evaluation. Attribution, now settled against both primary texts: the 1E-7 statement appears in BOTH SSG-79 and SSG-68 (footnote 9) in almost identical wording, and SSG-79 supersedes NS-G-3.1. An intermediate version of this database wrongly declared the SSG-79 attribution an error; it was not. SSG-79 alone carries the per-aircraft-category screening procedure. THE CZECH SCHEME IS A LOOP, NOT A THRESHOLD. Siting decree 378/2016 § 13 asks for the probability of a fall whose consequences would EXCEED THE RESISTANCE THE DESIGN ASSUMES, while design decree 329/2017 § 11(4)(b) sets that resistance from objects falling more often than 1E-7/yr. Each decree takes the other's output as its input, so the pair must be iterated — precisely the feedback process between site hazard evaluation and installation design that SSG-68 para. 3.4 recommends. Neither the US nor the EUR framework couples siting and design this explicitly. Second point, from the Czech primary text: the decree operates TWO frequency levels, not one — 1E-4/yr for basic external design events generally (§ 11(3)) and 1E-7/yr for a falling aircraft or other object (§ 11(4)(b)). The earlier version of this crosswalk compared the IAEA level against the Czech 1E-7 figure alone and so presented the Czech scheme as a single-threshold system. The three-orders-of-magnitude gap between § 11(3) and § 11(4)(b) is itself the finding: the Czech regulator treats a falling aircraft as far rarer than the events it otherwise designs for, which is what lets the crash stay inside the design basis without driving the whole design.","cl":["US-10CFR50.150-a-2","CZ-329-2017-aircraft-dbe","CZ-329-2017-external-events-general","CZ-378-2016-s13-aircraft","IAEA-SSG-79-spl","IAEA-SSG-68-fn9-spl","EU-WENRA-TU4-design-basis","EU-WENRA-TU3-screening"],"pos":[{"s":"US-10CFR50.150","rel":"baseline","n":"NO screening criterion. The threat is prescribed by rule, not selected by frequency."},{"s":"CZ-329-2017","rel":"different-architecture","n":"TWO levels. § 11(3): basic external design events generally = intensity of the territorial property with occurrence frequency 1E-4/yr (once per 10,000 years) or lower. § 11(4)(b): fall of an aircraft OR OTHER OBJECT = intensity of the effects of an object whose fall frequency onto an area where it could cause a basic external initiating event is > 1E-7/yr. § 11(4)(a) pairs it with a 0.1 g seismic floor for the same SSC set."},{"s":"IAEA-SSG-79","rel":"different-architecture","n":"SPL = limiting annual probability of events with potential radiological consequences. 1E-7 per reactor-year used in some States; conservative only if applied to all events of the same type. Aircraft screened per category (general aviation / medium and large commercial / military). Supersedes NS-G-3.1."},{"s":"IAEA-SSG-68","rel":"different-architecture","n":"Footnote 9 restates the same 1E-7 statement, citing NS-G-3.1."},{"s":"EU-WENRA-SRL","rel":"different-architecture","n":"TU4.2 sets 1E-4/yr for design basis events generally but does NOT state a figure for aircraft: it requires that a design basis event simply BE DEFINED to ensure minimum protection. The 1E-7 number is the Czech and IAEA contribution, not WENRA's."},{"s":"CZ-378-2016","rel":"different-architecture","n":"§ 13 asks the siting assessment to determine the PROBABILITY of a fall whose consequences would exceed the resistance ASSUMED BY THE DESIGN — a consequence-conditioned probability, not a raw crash frequency."}]},{"id":"CW-06","topic":"T06","qe":"Which structures and components must be assessed?","qk":"어떤 구조물과 기기를 평가해야 하는가?","ko":"NEI 07-13은 대상을 명확히 한정한다: 핵연료를 포함한 구조물(격납건물, 사용후핵연료 저장조)과 붕괴열 제거 기기를 수용한 구조물, 그리고 그 기능을 지원하는 전원·케이블 경로까지. 체코·IAEA는 '안전에 중요한 SSC'라는 일반적 범주를 쓰므로 범위가 더 넓지만 덜 구체적이다.","div":"Two scope questions only the IAEA framework puts in writing for hazards generally, and neither has an aircraft-specific counterpart anywhere else in this corpus. MULTI-UNIT: SSR-2/1 para. 5.15B requires the design of a multiple unit site to account for one hazard impacting several or even all units at once. An aircraft impact is precisely such a hazard, yet 10 CFR 50.150, NEI 07-13, the Czech decrees and the WENRA reference levels all frame the aircraft assessment around a single installation. CABLING: SSR-2/1 para. 5.19 names power and control cabling explicitly. NEI 07-13 reaches the same place from the other direction, judging survivability on power supplies and cable runs rather than on components alone — so the two agree in substance while only the IAEA requirement states it as a design rule.","cl":["US-NEI-07-13-scope","US-NEI-07-13-sufficiency","CZ-329-2017-external-events-general","IAEA-SSR-2-1-req17","IAEA-SSG-68-scope","IAEA-SSG-68-5.185-confinement"],"pos":[{"s":"US-NEI-07-13","rel":"baseline","n":"Containment, SFP, structures housing heat-removal equipment; plus power supplies, cable runs and supporting components."},{"s":"CZ-329-2017","rel":"equivalent","n":"§ 13 scopes the aircraft provision to selected SSCs with influence on nuclear safety NECESSARY FOR MANAGING EMERGENCY CONDITIONS AND RADIATION EMERGENCIES — a narrowing structurally close to the US 'key design features and functional capabilities', not a blanket safety-SSC requirement."},{"s":"IAEA-SSG-68","rel":"partial","n":"Protection of SSCs important to safety, based on site hazard evaluation and installation layout."},{"s":"EU-WENRA-SRL","rel":"partial","n":"TU2.2 fixes a minimum mandatory hazard list that includes accidental aircraft crash; TU1.1 extends the safety demonstration to spent fuel storage."},{"s":"IAEA-SSR-2-1","rel":"partial","n":"Requirement 17 fixes the two design uses of a hazard — plant LAYOUT and the derivation of postulated initiating events and LOADINGS. 5.15A extends protection to common cause failure mechanisms generated by hazards; 5.19 names POWER AND CONTROL CABLING among the interactions to minimise; 5.15B requires multiple unit sites to consider a hazard impacting several or all units SIMULTANEOUSLY."}]},{"id":"CW-07","topic":"T07","qe":"How is the impact load defined and is a specific method mandated?","qk":"충돌하중은 어떻게 정의되며 특정 방법이 강제되는가?","ko":"NEI 07-13은 국부하중과 전체하중의 산정, 재료 특성화, 파괴기준을 하나의 방법론으로 묶어 제공하며 RG 1.217이 이를 승인한다. IAEA SRS 87이 이에 대응하는 문서이나 권고가 아닌 정보성 안전보고서이다. 체코 시행령과 EU 지침은 하중 산정 방법을 규정하지 않는다 — 방법 선택은 신청자와 규제기관 협의에 맡겨진다.","div":"VERIFIED AGAINST BOTH PRIMARY TEXTS. NEI 07-13 and IAEA converge on method: both use a Riera-type force-time history and both provide a coupled missile-target interaction route for flexible targets. They diverge on WHO SUPPLIES THE NUMBERS. NEI 07-13 states that the rule \"does not define a unique model of the aircraft nor its initial impact velocity\" and that the Riera function is \"provided to the vendors\" — outside the public document. SSG-68 para. 5.170 instead says the aircraft type, mass and velocity \"may be specified by the regulatory body\", and para. 5.161 lets the site hazard evaluation express the result either as aircraft parameters or as load-time functions.","cl":["US-NEI-07-13-riera","US-RG-1.217-position","IAEA-SRS-87-structures","IAEA-SSG-68-5.168-load-time","IAEA-SSG-68-5.170-missile-target","CZ-329-2017-aircraft-dbe","EU-2014-87-framework"],"pos":[{"s":"US-NEI-07-13","rel":"baseline","n":"Integrated method: local + global loading, material characterisation, failure criteria; endorsed by RG 1.217."},{"s":"IAEA-SRS-87","rel":"equivalent","n":"Also derives the soft-missile loading function by the Riera method (§2.2.2) — but a Safety Report, informative only."},{"s":"IAEA-SSG-68","rel":"equivalent","n":"Paras. 5.168-5.176: load-time function for stiff/massive targets, coupled missile-target interaction for flexible targets; the regulatory body may specify aircraft type, mass and velocity."},{"s":"CZ-329-2017","rel":"no-equivalent","n":"Decree sets the design basis, not the analysis method."},{"s":"EU-2014-87-EURATOM","rel":"no-equivalent","n":"Directive prescribes no load or method."}]},{"id":"CW-08","topic":"T08","qe":"How is local damage — penetration, scabbing, perforation — evaluated?","qk":"국부손상(침투·배면박리·관통)은 어떻게 평가하는가?","ko":"**원문 대조로 확정된 항목.** 두 문서는 같은 경험식 계열을 쓰지만 규범적 성격이 다르다. NEI 07-13은 §2.1.2에서 사용할 식을 **특정한다**: 침투는 Modified NDRC, 배면박리 방지 두께는 reduced Chang, 관통 방지 두께는 reduced Degen, 관통속도는 CEA-EDF(Kar). IAEA SRS 87은 Chang, modified Chang, CRIEPI, NDRC/modified NDRC, Degen 식을 **카탈로그로 나열**할 뿐 선택을 강제하지 않는다. 결정적 차이는 IAEA가 명시한 단서다: 이 식들은 고체 발사체 시험 기반이므로 항공기 엔진·착륙장치에 적용할 때 0.60~0.65의 감소계수를 적용하는 것이 통상 적절하며, 저배근·횡철근 없는 표적 데이터에 기반한다. 한편 SSG-68 5.176은 강체 미사일용 경험식의 유효범위가 항공기 충돌과 일치하지 않으므로 적용성에 공학적 판단이 필요하다고 유보를 단다.","div":"RESOLVED — this was the open technical question in the first build of this database; it is now answered from both primary texts. The substantive finding is a hierarchy difference, not a formula disagreement: NEI 07-13 makes named empirical formulas the working method for local damage, whereas SSG-68 demotes them to an alternative for secondary missiles and debris and makes coupled non-linear analysis the primary route. An applicant using NEI 07-13 formulas in an IAEA-aligned jurisdiction should expect to justify (a) applicability of solid-projectile correlations to a crushable engine — SRS-87 suggests a 0.60-0.65 reduction factor — and (b) the reinforcement ratio of the real target versus the lightly reinforced test specimens the formulas came from. DECISIVE ADDITION from RG 1.217 Section C, position 2: the NRC endorses NEI 07-13 but expressly does NOT endorse the documents NEI 07-13 references — which is where the Modified NDRC, Chang, Degen and CEA-EDF correlations come from. So even on the US side the regulator has accepted the METHOD AS ASSEMBLED, not the underlying correlations. The earlier reading of this database, that no qualification to the endorsement could be found, was wrong.","cl":["US-NEI-07-13-local-formulas","US-NEI-07-13-failure-modes","US-RG-1.217-position","IAEA-SRS-87-structures","IAEA-SSG-68-5.170-missile-target","IAEA-SSG-68-5.163-effects"],"pos":[{"s":"US-NEI-07-13","rel":"baseline","n":"§2.1.2 SELECTS: Modified NDRC (penetration), reduced Chang (scabbing thickness), reduced Degen (perforation thickness), CEA-EDF per Kar (perforation velocity). Notes Degen/CEA-EDF/Chang/CRIEPI give comparable VP."},{"s":"IAEA-SRS-87","rel":"partial","n":"PRESENTS the same formula family (Chang, modified Chang, CRIEPI, NDRC/modified NDRC, Degen) as a catalogue without mandating one; adds a 0.60-0.65 reduction factor for deformable aircraft engine parts and landing gear, and a lightly-reinforced-target validity caveat."},{"s":"IAEA-SSG-68","rel":"different-architecture","n":"Para. 5.176 treats empirical rigid-missile formulas as an ALTERNATIVE for secondary missiles and debris only, warning their validity ranges usually do not coincide with aircraft impact; the primary route is a coupled non-linear model able to assess failure modes from spalling to perforation (5.174)."},{"s":"US-RG-1.217","rel":"baseline","n":"Regulatory Position 2: 'NEI 07-13 references other documents, but this RG does not endorse any of the referenced documents.' The empirical correlations are drawn from those referenced documents."},{"s":"CZ-329-2017","rel":"no-equivalent","n":null},{"s":"EU-EUR","rel":"not-public","n":"Ch. 2.4 §5.8.1.4 Aircraft impact and §5.8.1.5 Missiles sit under design loads for buildings, and §5.9 covers load combinations — but the methods and values are licensed."}]},{"id":"CW-09","topic":"T12","qe":"What is the pass/fail criterion?","qk":"합격/불합격 판정기준은 무엇인가?","ko":"**원문 대조로 확정된 항목.** 미국 규정 기준은 (노심냉각 OR 격납건전성) AND (사용후핵연료 냉각 OR 저장조 건전성)이며, NEI 07-13 §2.5가 이를 구조 판정으로 번역한다: 격납은 (i) 강재 격납/강재라이너 콘크리트 격납의 관통이 없고 (ii) 노심손상 시 유효 완화전략 시행 전에 최대압력능력이 초과되지 않으면 수용된다. 저장조는 요구 최소수위 아래에서 라이너 누설이 없으면 국부적 압괴·균열이 있어도 수용된다. IAEA SSG-68 5.192는 설계기준초과 충돌에 대해 \"대량 또는 조기 방출 방지에 필요한 안전상 중요 품목의 기능 유지\"를 최소 허용기준으로 제시한다. 즉 두 체계 모두 설계기준초과·최적추정 해석이라는 점에서 일치하나, 판정 대상이 다르다 — 미국은 4개 발전소 기능을 명명하고, IAEA는 방출 기반 목표를 쓴다. 한편 SSG-68 5.185는 **우발적** 충돌에 대해서는 격납구조물의 무관통을 요구하여 훨씬 엄격하다.","div":"The sharpest practical difference sits inside the containment test. NEI 07-13 §2.5.1 presumes a core damage event and asks only that the ultimate pressure capability hold long enough for mitigation; SSG-68 para. 5.185 requires confinement structures to withstand an accidental crash without perforation outright. The two are not in conflict because they sit at different hazard levels (BDB vs design basis) — which is exactly the CW-04 finding, now visible in the acceptance criteria themselves.","cl":["US-10CFR50.150-a-1","US-NEI-07-13-sufficiency","IAEA-SSG-68-5.192-bdb","IAEA-SSG-68-5.185-confinement","EU-EUR-aircraft-structure","IAEA-SRS-88-margins","CZ-329-2017-external-events-general"],"pos":[{"s":"US-10CFR50.150","rel":"baseline","n":"(core cooling OR containment integrity) AND (SFP cooling OR SFP integrity), with reduced use of operator actions."},{"s":"US-NEI-07-13","rel":"baseline","n":"§2.5: containment intact = no perforation AND ultimate pressure capability not exceeded before effective mitigation; SFP integrity = no liner leakage below required minimum water level, localized crushing/cracking acceptable."},{"s":"IAEA-SSG-68","rel":"equivalent","n":"Para. 5.192 (BDB): at a minimum, items important to safety necessary to prevent large or early release remain functional; best estimate approach permitted. Para. 5.185 (accidental/DB): confinement structures withstand impact WITHOUT perforation."},{"s":"EU-EUR","rel":"different-architecture","n":"Ch. 2.1 §3 sets quantitative safety objectives including §3.5 probabilistic safety targets, and §5.1.7 defines environmental condition resistance levels 1/2/S/N against which SSCs are qualified. Acceptance is graded through those levels rather than by a single pass/fail statement."},{"s":"IAEA-SRS-88","rel":"partial","n":"A TIERED approach to margin assessment; the margin is quantified with best estimate or conservative values, HCLPF being one such value rather than the mandated measure."},{"s":"CZ-329-2017","rel":"partial","n":"§ 12(1) requires a conservative approach to basic external design events; no aircraft-specific pass/fail statement equivalent to NEI 07-13 §2.5."}]},{"id":"CW-10","topic":"T13","qe":"Are malicious (intentional) impacts treated together with accidental ones?","qk":"고의적 충돌과 우발적 충돌을 함께 다루는가?","ko":"**두 곳을 원문으로 확인하여 결론이 바뀐 항목.** 미국은 하나의 규정으로 다루되 상세 방법론을 비공개본에 두고 SGI(안전조치정보)로 통제한다 — 근거는 10 CFR 50.150(d)가 아니라 RG 1.217 Section A이다. 체코는 설계 시행령 **안에서** 다룬다: § 10(1)(d)가 \"수송항공기에 의한 고의적 공격\"의 결과분석에서 도출된 물리적방호계획 자료를 설계기준에 포함하도록 요구하며, 우발적 낙하(§ 11(4)(b))와 별도 경로로 처리한다. EUR도 고의적 충돌을 별도 항목으로 둔다. EU 원자력안전지침만 보안·악의적 행위를 적용범위에서 명시적으로 제외한다.","div":"Four distinct architectures, all now confirmed from primary or official-ToC sources. US: one rule for one large-commercial-aircraft event, with the detail held under Safeguards Information. EUR: the intentional crash is a named subject in the Security section AND carries its own design-basis load function. Czech: the intentional attack enters the design bases as physical-protection-plan data (§ 10(1)(d)), while the statutory design basis threat itself is defined as a PERSON (§ 2(4)(b)). EU directive and WENRA: expressly out of scope — \"unintended man-made hazards\" (Art. 8b(1)(a)) and Issue TU footnote 88 respectively. Only EUR gives the deliberate case an explicit design load function in a design chapter; only Czechia routes it through a plan the design must then absorb.","cl":["US-10CFR50.150-a-2","US-RG-1.217-sgi","EU-EUR-aircraft-structure","EU-2014-87-framework","CZ-329-2017-intentional-attack","CZ-263-2016-dbt"],"pos":[{"s":"US-10CFR50.150","rel":"baseline","n":"One rule covers the large commercial aircraft impact; (a)(2) footnote 1 says the detailed parameters are set forth in guidance and changes require Commission approval."},{"s":"EU-EUR","rel":"different-architecture","n":"The intentional crash has its own sections in BOTH chapters: Ch. 2.1 §8.3.3 under SECURITY (beside §8.3.2 design of the physical protection system) and Ch. 2.4 §1.3.3.2 in the DESIGN BASIS chapter with its own example load function (§1.3.3.2.1). Ch. 2.4 §1.4 Sabotage is a further separate man-made hazard."},{"s":"EU-2014-87-EURATOM","rel":"no-equivalent","n":"Art. 8b(1)(a) reaches 'extreme external natural and UNINTENDED man-made hazards' — the operative defence-in-depth clause covers the accidental crash and expressly not the deliberate one."},{"s":"CZ-263-2016","rel":"different-architecture","n":"§ 2(4)(b) defines the design basis threat in terms of a NATURAL PERSON capable of intentional unlawful handling — not a vehicle or aircraft. The intentional aircraft attack therefore reaches the design through the physical protection plan, not through the DBT definition."},{"s":"EU-WENRA-SRL","rel":"no-equivalent","n":"Issue TU footnote 88: 'Within these reference levels malicious acts are not considered.'"},{"s":"CZ-329-2017","rel":"equivalent","n":"§ 10(1)(d) requires the design bases to include data from the physical protection plan derived from the consequence analysis of an INTENTIONAL ATTACK BY A TRANSPORT AIRCRAFT. The malicious case is an explicit design input, handled separately from the accidental fall in § 11(4)(b)."},{"s":"US-RG-1.217","rel":"baseline","n":"Section A: the non-public versions of RG 1.217 and NEI 07-13 carry the detailed methodology under Safeguards Information controls, available only to SGI-qualified personnel including plant designers."}]},{"id":"CW-11","topic":"T15","qe":"How much credit may be taken for operator action?","qk":"운전원 조치를 어느 정도까지 인정할 수 있는가?","ko":"미국 규정은 'reduced use of operator actions'라는 제약을 **판정기준 문장 안에** 넣은 유일한 문서다. 다만 EUR은 다른 방식으로 같은 문제를 다룬다 — 제2.1장 §6.7이 운전원· 발전소 인력, 비상설설비, 최종열침원, 전원, 압축공기, 주제어실에 대한 **자율운전 목표(autonomy objectives)**를 설정하고 §6.8이 비상설설비를 규율한다. 즉 미국은 허용기준 문구로, EUR은 자율운전 시간으로 운전원 의존을 제한한다. 체코 시행령과 IAEA SSG-68에는 항공기 충돌에 대한 대응 조항이 없다.","div":"","cl":["US-10CFR50.150-a-1","US-NEI-07-13-sufficiency","US-NEI-07-13-fire-spurious","EU-EUR-design-conditions"],"pos":[{"s":"US-10CFR50.150","rel":"baseline","n":"'with reduced use of operator actions' is written into the acceptance criterion itself."},{"s":"CZ-329-2017","rel":"no-equivalent","n":null},{"s":"IAEA-SSG-68","rel":"no-equivalent","n":null},{"s":"US-NEI-07-13","rel":"baseline","n":"In practice the methodology leans on operator-implemented 10 CFR 50.54(hh)(2) mitigation strategies; reconciled with 'reduced use of operator actions' by timing — mitigation need only be implementable before the ultimate pressure capability is challenged."},{"s":"EU-EUR","rel":"different-architecture","n":"Ch. 2.1 §6.7 sets AUTONOMY OBJECTIVES — in respect of operators and plant personnel (§6.7.1), non-permanent equipment (§6.7.1.1), ultimate heat sink, power supplies, compressed air and the MCR — and §6.8 governs Non-Permanent Equipment including its role in plant robustness. EUR constrains operator dependence through autonomy periods rather than through a phrase in an acceptance criterion. Values are licensed."}]},{"id":"CW-12","topic":"T14","qe":"How are the assessment results documented, reviewed and disclosed?","qk":"평가결과는 어떻게 문서화·심사·공개되는가?","ko":"미국은 (b)에 따라 설계특성·기능적 능력과 그것이 (a)(1)을 어떻게 충족하는지를 PSAR/FSAR에 기재하고, (c)에 따라 안전성분석보고서 기재요건을 통해 변경을 통제하며, NRC의 AIA 검사 프로그램으로 실제 구현 여부를 확인한다. 상세 방법론은 SGI 통제 하의 비공개본에 있어 공개자료로는 방법론 수준의 비교만 가능하다. **정정:** 이전 판은 비공개 근거를 10 CFR 50.150(d)로 기재했으나, (d)는 일몰 조항이며 비공개 근거는 RG 1.217 Section A의 SGI 통제이다.","div":"","cl":["US-10CFR50.150-b","US-10CFR50.150-c","US-RG-1.217-sgi","US-RG-1.217-implementation","US-NEI-07-13-aia-inspection"],"pos":[{"s":"US-10CFR50.150","rel":"baseline","n":"(b) requires the PSAR/FSAR to describe the design features and functional capabilities AND how they meet (a)(1); (c) routes change control through the SAR content requirements (50.34(a)(13), 50.34(b)(12), 52.47(a)(28)/52.63, 52.79(a)(47), 52.157(f)(32)/52.171)."},{"s":"US-NEI-07-13","rel":"baseline","n":"NRC AIA inspection programme verifies as-built implementation."},{"s":"CZ-329-2017","rel":"partial","n":"Documented within the standard Czech safety documentation and SÚJB review; specifics not captured in this database."}]}],"sources":[{"id":"US-10CFR50.150","j":"US","doc":"10 CFR 50.150","title":"Aircraft impact assessment","ko":"항공기 충돌 평가","issuer":"U.S. Nuclear Regulatory Commission","type":"regulation","binding":true,"version":"current (as amended)","access":"public-domain","role":"Binding requirement to perform a design-specific aircraft impact assessment (AIA) for new reactors.","urls":["https://www.ecfr.gov/current/title-10/chapter-I/part-50/subject-group-ECFR448a4b6d297d970/section-50.150","https://www.nrc.gov/reading-rm/doc-collections/cfr/part050/part050-0150","https://www.govinfo.gov/content/pkg/CFR-2025-title10-vol1/pdf/CFR-2025-title10-vol1-sec50-150.pdf","https://www.federalregister.gov/documents/2009/06/12/E9-13582/consi is","ko":"설계기준 대 설계기준초과","d":"DBEE / BDBEE(DEC) 구분, 안전등급 요건 적용 여부."},{"id":"T05","en":"Probabilistic screening criterion","ko":"확률론적 스크리닝 기준","d":"설계기준 포함 여부를 가르는 발생빈도 기준(예: 1E-7/yr)."},{"id":"T06","en":"Target and SSC selection","ko":"평가대상 구조물·계통·기기 선정","d":"충돌 평가 대상 건물과 안전기능 지원 기기(전원, 케이블 등) 선정 방법."},{"id":"T07","en":"Impact load definition","ko":"충돌하중 정의","d":"Riera 하중-시간 함수, missile-target 상호작용 등 하중 산정 방법."},{"id":"T08","en":"Local damage (perforation, scabbing)","ko":"국부손상(관통·박리)","d":"경성 미사일에 의한 침투깊이, 배면 박리, 관통 평가."},{"id":"T09","en":"Global structural response","ko":"전체 구조응답","d":"비선형 유한요소 해석, 소성붕괴, 구조 건전성 평가."},{"id":"T10","en":"Impact-induced vibration and shock","ko":"충격유발 진동","d":"충돌로 유발된 진동이 기기·배관·전기설비에 미치는 영향."},{"id":"T11","en":"Fire and fuel effects","ko":"화재 및 연료 영향","d":"항공유 분산, 화구(fireball), 풀화재, 내부 침투 연료에 의한 영향."},{"id":"T12","en":"Acceptance criteria / safety functions","ko":"허용기준 및 안전기능","d":"노심냉각, 격납건전성, 사용후핵연료 냉각·수조 건전성 등 최종 판정기준."},{"id":"T13","en":"Malicious vs accidental crash","ko":"고의충돌 대 우발충돌","d":"테러 등 의도적 충돌과 사고성 추락의 규제상 취급 차이."},{"id":"T14","en":"Documentation, review and information control","ko":"문서화·심사·정보통제","d":"제출 문서, 심사 절차, 보안정보 비공개 처리."},{"id":"T15","en":"Operator action and mitigative strategies","ko":"운전원 조치 및 완화전략","d":"운전원 조치 인정 범위, 이동형 설비 등 완화전략 크레딧."}],"stats":{"clauses":51,"crosswalk":12,"sources":15,"raw":2184,"primary":50}};

/* ---- search: token overlap, title weighted, substring fallback for Korean ---- */
const STOP = new Set(["the","a","of","and","or","to","in","is","are","for","무엇","어떻게","인가","한다","되는"]);
function tokens(q){
  return (q.toLowerCase().match(/[0-9a-z가-힣À-ſ§.\-_/]+/g)||[])
    .filter(t => t.length>1 && !STOP.has(t));
}
function score(rec, toks){
  if(!toks.length) return 0;
  let s=0, hits=0;
  const title=(rec.title+" "+rec.sub+" "+rec.loc+" "+rec.doc).toLowerCase();
  for(const t of toks){
    const inH=rec.hay.includes(t);
    if(!inH) continue;
    hits++;
    let n=0, i=0; while((i=rec.hay.indexOf(t,i))>=0){n++;i+=t.length;}
    s += (title.includes(t)?9:0) + Math.min(n,6)*2;
  }
  // A multi-word query is a description of one thing, not a list of alternatives.
  // Requiring half its terms keeps a preset like "설계기준초과 beyond design basis"
  // from returning most of the corpus on the strength of one common word.
  const need = toks.length >= 3 ? Math.ceil(toks.length/2) : toks.length >= 2 ? 2 : 1;
  if(hits < need) return 0;
  return hits === toks.length ? s*1.6 : s;
}

// The corpus is authored in YAML where emphasis is written **like this**.
// Render it, then highlight search terms only in the text between tags so a
// match inside <strong> or <mark> cannot corrupt the markup.
function md(t){ return t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }
function hl(text, toks){
  let out = md(esc(text));
  const live = toks.filter(t => t.length > 1);
  if(!live.length) return out;
  const rx = new RegExp("(" + live.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")","gi");
  return out.split(/(<[^>]+>)/).map(part =>
    part.startsWith("<") ? part : part.replace(rx, "<mark>$1</mark>")).join("");
}

function renderResults(){
  const toks=tokens(S.q);
  let rows=RECS.filter(r=>{
    if(S.j.size && !S.j.has(r.j)) return false;
    if(S.kind.size && !S.kind.has(r.kind)) return false;
    if(S.topic.size && !(r.topics||[]).some(t=>S.topic.has(t))) return false;
    return true;
  });
  if(toks.length){
    rows=rows.map(r=>({r,sc:score(r,toks)})).filter(x=>x.sc>0)
             .sort((a,b)=>b.sc-a.sc).map(x=>x.r);
  }else{
    rows.sort((a,b)=> a.kind===b.kind ? a.id.localeCompare(b.id) : (a.kind==="crosswalk"?-1:1));
  }
  $("#presets").hidden = !!toks.length;
  $("#count").textContent = toks.length
    ? `${rows.length}건 · "${S.q}"`
    : `${rows.length}건 — 조항 ${DB.stats.clauses} · 비교항목 ${DB.stats.crosswalk}`;

  if(!rows.length){
    $("#results").innerHTML=`<div class="empty">일치하는 항목이 없습니다. 검색어를 줄이거나 필터를 해제해 보세요.</div>`;
    return;
  }
  $("#results").innerHTML = rows.map(r=>{
    const open=S.open.has(r.id);
    const badge = r.v==="primary_source"
      ? `<span class="badge pri">★ 원문</span>`
      : `<span class="badge">${esc(r.v==="web_verified"?"검색확인":r.v)}</span>`;
    const snip = r.kind==="crosswalk" ? (r.ko||"") : (r.ko||r.en||"");
    return `<div class="item j-${r.j} ${open?"open":""}" data-id="${esc(r.id)}">
      <button class="hd" aria-expanded="${open}"><span class="stripe"></span><span class="hdb">
        <span class="line1">
          <span class="loc">${esc(r.doc||"")} ${esc(r.loc||"")}</span>${badge}
        </span>
        <h3>${hl(r.title,toks)}</h3>
        <span class="snip">${hl(snip,toks)}</span>
      </span></button>
      <div class="body">${open?detail(r,toks):""}</div>
    </div>`;
  }).join("");
}

function detail(r,toks){
  const out=[];
  if(r.kind==="crosswalk"){
    if(r.sub) out.push(`<div class="blk"><span class="k">question (en)</span><span class="t">${hl(r.sub,toks)}</span></div>`);
    if(r.ko) out.push(`<div class="blk"><span class="k">정리</span><span class="t ko">${hl(r.ko,toks)}</span></div>`);
    if(r.pos && r.pos.length){
      out.push(`<div class="blk"><span class="k">문서별 입장</span><div class="poslist">` +
        r.pos.map(p=>{
          const s=SRC[p.s]||{};
          return `<div class="pos"><span class="sid">${esc(s.doc||p.s)}</span>
            <span><span class="rel ${esc(p.rel)}">${esc(REL[p.rel]||p.rel)}</span></span>
            <span class="pn">${hl(p.n||"",toks)}</span></div>`;
        }).join("") + `</div></div>`);
    }
    if(r.div) out.push(`<div class="blk"><span class="k">차이점 · 유의사항</span><div class="note">${hl(r.div,toks)}</div></div>`);
    if(r.cl && r.cl.length)
      out.push(`<div class="foot"><span>근거 조항: <span class="mono">${r.cl.map(esc).join(", ")}</span></span></div>`);
    return out.join("");
  }
  if(r.ko) out.push(`<div class="blk"><span class="k">국문</span><span class="t ko">${hl(r.ko,toks)}</span></div>`);
  if(r.en) out.push(`<div class="blk"><span class="k">english</span><span class="t">${hl(r.en,toks)}</span></div>`);
  if(r.kp){
    out.push(`<div class="blk"><span class="k">핵심 파라미터</span><dl class="kp">` +
      Object.entries(r.kp).map(([k,v])=>
        `<dt>${esc(k)}</dt><dd>${hl(Array.isArray(v)?v.join(" · "):String(v),toks)}</dd>`).join("") +
      `</dl></div>`);
  }
  if(r.nt) out.push(`<div class="blk"><span class="k">note</span><div class="note">${hl(r.nt,toks)}</div></div>`);
  const f=[`<span class="mono">${esc(r.id)}</span>`,
           `<span>${esc(r.ts)} · ${esc(r.v)}</span>`];
  if(r.u) f.push(`<a href="${esc(r.u)}" target="_blank" rel="noopener">출처 열기 ↗</a>`);
  out.push(`<div class="foot">${f.join("")}</div>`);
  return out.join("");
}

const COLS = [["US-10CFR50.150","50.150"],["US-RG-1.217","RG 1.217"],["US-NEI-07-13","NEI 07-13"],
  ["CZ-263-2016","263/2016"],["CZ-329-2017","329/2017"],["CZ-378-2016","378/2016"],
  ["EU-EUR","EUR"],["EU-2014-87-EURATOM","2014/87"],["EU-WENRA-SRL","WENRA"],
  ["IAEA-SSR-2-1","SSR-2/1"],["IAEA-SSG-68","SSG-68"],["IAEA-SSG-79","SSG-79"],
  ["IAEA-SRS-86","SRS-86"],["IAEA-SRS-87","SRS-87"],["IAEA-SRS-88","SRS-88"]];
function buildMatrix(){
  const head = `<thead><tr><th>#</th><th>비교 항목</th>` +
    COLS.map(([c,lbl])=>`<th title="${esc(SRC[c]?SRC[c].doc+" — "+SRC[c].title:c)}">${esc(lbl)}</th>`).join("") +
    `</tr></thead>`;
  const body = DB.crosswalk.map(w=>{
    const by=Object.fromEntries(w.pos.map(p=>[p.s,p]));
    return `<tr><td class="cwid">${esc(w.id)}</td><td class="q">${esc(w.qk||w.qe)}</td>` +
      COLS.map(([c])=>{
        const p=by[c];
        if(!p) return `<td class="c none">–</td>`;
        return `<td class="c"><button data-cw="${esc(w.id)}">${esc(REL[p.rel]||p.rel)}</button></td>`;
      }).join("") + `</tr>`;
  }).join("");
  $("#matrix").innerHTML = head + `<tbody>${body}</tbody>`;
  $("#legend").innerHTML = "범례: " +
    Object.entries(REL).map(([k,v])=>`<span class="mono">${esc(k)}</span> = ${esc(v)}`).join(" · ") +
    ` · <span class="mono">–</span> 해당 문서에 기재 없음`;
  $("#matrix").addEventListener("click", e=>{
    const b=e.target.closest("button[data-cw]"); if(!b) return;
    const w=DB.crosswalk.find(x=>x.id===b.dataset.cw);
    const r=RECS.find(x=>x.id===w.id);
    $("#cwdetail").innerHTML = `<div class="item j-MULTI open">
      <div class="hd"><span class="stripe"></span><span class="hdb">
        <span class="line1"><span class="loc">${esc(w.id)}</span></span>
        <h3>${esc(w.qk||w.qe)}</h3></span></div>
      <div class="body">${detail(r,[])}</div></div>`;
    $("#cwdetail").scrollIntoView({behavior:"smooth",block:"start"});
  });
}

  $("#pane-search").hidden = t!=="search";
  $("#pane-matrix").hidden = t!=="matrix";

}

});

  if(e.key==="/" && document.activeElement!==$("#q")){ e.preventDefault(); $("#q").focus(); }
