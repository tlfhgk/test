<style>

  --rule:#DCE1E8; --rule-strong:#C3CAD4;

}

  :root:not([data-theme="light"]){

    --rule:#272D37; --rule-strong:#39414D;
    --accent:#E08277; --accent-soft:#3A211E;
    --us:#77AEDC; --cz:#CE93BE; --eu:#6FC3AF; --int:#D8AC5E; --multi:#A99BDD;
    --ok:#79C2A0;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#101318; --surface:#171B22; --surface-2:#1E232B; --surface-3:#262C36;
  --ink:#E5E9EF; --ink-2:#A2ABB9; --ink-3:#78828F;
  --rule:#272D37; --rule-strong:#39414D;
  --accent:#E08277; --accent-soft:#3A211E;
  --us:#77AEDC; --cz:#CE93BE; --eu:#6FC3AF; --int:#D8AC5E; --multi:#A99BDD;
  --ok:#79C2A0;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:'IBM Plex Sans','IBM Plex Sans KR',system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:940px;margin:0 auto;padding:0 20px 80px}
h1,h2,h3{font-family:'IBM Plex Serif','IBM Plex Sans KR',Georgia,serif;text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:600;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600}
h3{font-size:15.5px;font-weight:600;line-height:1.45}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.86em}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- masthead + search ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--rule);padding-top:22px}
/* .wrap carries the page's bottom padding; inside the sticky header that would
   open an 80px band between the tabs and the rule. */
.top .wrap{padding-bottom:0}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.mast .stat{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.searchrow{display:flex;gap:8px;align-items:stretch}
#q{flex:1;min-width:0;padding:11px 14px;font:inherit;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule-strong);box-shadow:var(--shadow)}
#q::placeholder{color:var(--ink-3)}
#clear{padding:0 13px;border:1px solid var(--rule-strong);background:var(--surface);
  color:var(--ink-2);font-size:13px;box-shadow:var(--shadow)}
#clear:hover{background:var(--surface-2)}
.tabs{display:flex;gap:2px;margin-top:12px}
.tab{padding:8px 15px;font-size:13.5px;color:var(--ink-2);border:1px solid transparent;
  border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tab:hover{color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:11px 0 13px}
.f{padding:3px 10px;font-size:11.5px;border:1px solid var(--rule-strong);
  background:var(--surface);color:var(--ink-2);white-space:nowrap}
.f[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.f:hover{border-color:var(--ink-3)}

/* ---------- presets ---------- */
.presets{padding:20px 0 4px;display:flex;flex-direction:column;gap:9px}
.presets .lbl{color:var(--ink-3);font-size:12.5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:7px}
.p{text-align:left;padding:9px 12px;border:1px solid var(--rule);background:var(--surface);
  font-size:13.2px;color:var(--ink-2);box-shadow:var(--shadow);line-height:1.45}
.p:hover{border-color:var(--accent);color:var(--ink)}
.p b{display:block;color:var(--ink);font-weight:500;font-size:13.5px;margin-bottom:1px}

/* ---------- results ---------- */
.count{padding:16px 0 8px;font-size:12.5px;color:var(--ink-3);
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;border:1px solid var(--rule);
  background:var(--surface);box-shadow:var(--shadow)}
.item{border-top:1px solid var(--rule)}
.item:first-child{border-top:0}
.hd{width:100%;display:grid;grid-template-columns:4px 1fr;text-align:left;align-items:stretch}
.stripe{background:var(--ink-3)}
.j-US .stripe{background:var(--us)} .j-CZ .stripe{background:var(--cz)}
.j-EU .stripe{background:var(--eu)} .j-INT .stripe{background:var(--int)}
.j-MULTI .stripe{background:var(--multi)}
.hdb{padding:12px 15px;display:flex;flex-direction:column;gap:5px;min-width:0}
.hd:hover .hdb{background:var(--surface-2)}
.line1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.loc{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-3)}
.j-US .loc{color:var(--us)} .j-CZ .loc{color:var(--cz)}
.j-EU .loc{color:var(--eu)} .j-INT .loc{color:var(--int)}
.j-MULTI .loc{color:var(--multi)}
.badge{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;
  padding:1px 5px;border:1px solid var(--rule-strong);color:var(--ink-3);text-transform:uppercase}
.badge.pri{color:var(--ok);border-color:var(--ok)}
.snip{color:var(--ink-2);font-size:13.4px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
mark{background:var(--accent-soft);color:var(--ink);padding:0 1px}
.body{padding:2px 15px 18px 19px;display:none;flex-direction:column;gap:13px}
.item.open .body{display:flex}
.item.open .hdb{background:var(--surface-2)}
.blk{display:flex;flex-direction:column;gap:4px}
.blk .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.blk .t{font-size:14px;color:var(--ink-2);max-width:74ch}
.blk .t.ko{color:var(--ink)}
.kp{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.8px;align-items:baseline}
.kp dt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-3)}
.kp dd{margin:0;color:var(--ink-2);overflow-wrap:anywhere}
.note{border-left:3px solid var(--rule-strong);padding:3px 0 3px 13px;
  font-size:13.2px;color:var(--ink-2);max-width:74ch}
.foot{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);
  padding-top:3px;border-top:1px solid var(--rule);margin-top:2px;padding-top:9px}
.rel{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--rule-strong);
  color:var(--ink-2);white-space:nowrap}
.rel.baseline{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.rel.equivalent{color:var(--ok);border-color:var(--ok)}
.poslist{display:flex;flex-direction:column;gap:7px}
.pos{display:grid;grid-template-columns:150px 76px 1fr;gap:10px;font-size:12.8px;align-items:baseline}
.pos .sid{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-3)}
.pos .pn{color:var(--ink-2)}

/* ---------- matrix ---------- */
.tw{overflow-x:auto;border:1px solid var(--rule);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:900px}
th,td{padding:7px 9px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
thead th{position:sticky;top:0;background:var(--surface-2);font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  font-weight:500;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.q{min-width:210px;color:var(--ink);line-height:1.4}
td.cwid{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap}
td.c{text-align:center;font-size:11px;white-space:nowrap}
td.c button{width:100%;padding:2px 4px;color:var(--ink-2)}
td.c button:hover{color:var(--accent);text-decoration:underline}
td.c.none{color:var(--ink-3);opacity:.45}
.legend{padding:11px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.9}

/* ---------- sources ---------- */
.srcgrid{display:flex;flex-direction:column;border:1px solid var(--rule);
  background:var(--surface);box-shadow:var(--shadow)}
.src{display:grid;grid-template-columns:4px 1fr;border-top:1px solid var(--rule)}
.src:first-child{border-top:0}
.srcb{padding:13px 15px;display:flex;flex-direction:column;gap:5px}
.srcmeta{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}

.empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:14px}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--rule);
  color:var(--ink-3);font-size:12px;line-height:1.8}
@media (max-width:600px){
  .wrap{padding:0 14px 60px}
  h1{font-size:21px}
  .pos{grid-template-columns:1fr;gap:2px}
  .kp{grid-template-columns:1fr;gap:1px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const DB={"clauses":[{"id":"CZ-263-2016-dbt","s":"CZ-263-2016","doc":"zákon č. 263/2016 Sb.","j":"CZ","loc":"zákon č. 263/2016 Sb., § 2 odst. 4 písm. b)","he":"Design basis threat — defined in terms of a person, not an aircraft","hk":"설계기준위협 — 항공기가 아닌 '사람'으로 정의","t":["T13"],"ts":"verbatim","v":"primary_source","en":"The Atomic Act defines the design basis threat (projektová základní hrozba) as the set of attributes and capabilities of a NATURAL PERSON, located inside or outside the nuclear installation or at the nuclear material subject to physical protection, who is capable of intentionally handling that subject unlawfully. Physical protection (fyzická ochrana) is defined as the system of technical and organisational measures preventing unauthorised activities with the installation or material.","ko":"원자력법은 설계기준위협(projektová základní hrozba)을, 물리적방호 대상인 원자력시설 또는 핵물질의 내부 또는 외부에 있으면서 그 대상을 **고의로 위법하게 취급할 수 있는 자연인(사람)**의 속성과 능력의 집합으로 정의한다. 물리적방호는 시설·물질에 대한 비인가 행위를 방지하는 기술적·조직적 조치체계로 정의된다.","kp":{"dbt_subject":"a natural person, not a vehicle or aircraft","linkage":"329/2017 § 10(1)(d) carries the consequence analysis of an intentional transport-aircraft attack from the physical protection plan into the design bases"},"u":"https://www.zakonyprolidi.cz/cs/2016-263","nt":"Important for CW-10. The statutory DBT is person-based, so the intentional aircraft attack is not itself the DBT; it reaches the design through the physical protection plan route in decree 329/2017 § 10(1)(d). The threat characterisation therefore stays inside the non-public physical protection plan while the design obligation is public."},{"id":"CZ-263-2016-design-basis-definition","s":"CZ-263-2016","doc":"zákon č. 263/2016 Sb.","j":"CZ","loc":"zákon č. 263/2016 Sb., § 2 — definition of projektová východiska","he":"Statutory definition of design bases, covering external threats and events","hk":"설계기준의 법률상 정의 — 외부 위협·사건 포함","t":["T01","T04"],"ts":"verbatim","v":"primary_source","en":"The Atomic Act defines \"design bases\" (projektová východiska) as the set of data characterising the functions ensured by the structures, systems and components of the nuclear installation UNDER INTERNAL AND EXTERNAL THREATS AND EVENTS, together with the values or ranges of values of the installation's governing parameters used in design. External events are therefore inside the statutory definition of the design bases, not an add-on introduced by the implementing decree.","ko":"원자력법은 \"설계기준(projektová východiska)\"을, **내부 및 외부 위협·사건 하에서** 원자력시설의 구조물·계통·기기가 보장하는 기능을 특징짓는 자료의 집합과, 설계에 사용되는 시설 지배 파라미터의 값 또는 값의 범위로 정의한다. 따라서 외부사건은 시행령이 추가한 것이 아니라 설계기준의 법률상 정의 안에 이미 포함되어 있다.","kp":null,"u":"https://www.zakonyprolidi.cz/cs/2016-263","nt":"This is why the Czech accidental aircraft crash sits inside the design basis: the primary legislation defines design bases to span external events. The US framework has no equivalent statutory hook — 10 CFR 50.150 sits outside the design basis by the NRC's own determination (see US-RG-1.217-bdb-consequence)."},{"id":"CZ-263-2016-enabling","s":"CZ-263-2016","doc":"zákon č. 263/2016 Sb.","j":"CZ","loc":"zákon č. 263/2016 Sb., § 236","he":"The enabling provision for the SÚJB decrees","hk":"SÚJB 시행령의 위임 근거조항","t":["T01"],"ts":"summary","v":"primary_source","en":"§ 236 is the single enabling provision under which SÚJB issues its implementing decrees. It enumerates every authorisation, including § 24(7), § 44(4)(a)-(c), § 45(4), § 46(8) and § 47(4)(a)-(c). Decree 329/2017 Sb. (design) is issued under § 24(7), § 44(4), § 45(4) and § 46(8); decree 378/2016 Sb. (siting) is issued under § 24(7) and § 47(4).","ko":"§ 236은 SÚJB가 시행령을 발령하는 단일 위임 근거조항으로, § 24(7), § 44(4)(a)~(c), § 45(4), § 46(8), § 47(4)(a)~(c) 등 모든 위임사항을 열거한다. 시행령 329/2017(설계)은 § 24(7)·§ 44(4)·§ 45(4)·§ 46(8)에, 시행령 378/2016(부지)은 § 24(7)·§ 47(4)에 근거한다.","kp":null,"u":"https://www.zakonyprolidi.cz/cs/2016-263","nt":"Corrects the earlier record, which listed the individual authorisations as if they were the enabling clause. The enabling clause is § 236; those sections are the subjects it enumerates."},{"id":"CZ-263-2016-s46-design-duty","s":"CZ-263-2016","doc":"zákon č. 263/2016 Sb.","j":"CZ","loc":"zákon č. 263/2016 Sb., § 46 odst. 2 písm. e) a f)","he":"Statutory duty to ensure resistance against site properties and external influences","hk":"부지특성 및 외부영향에 대한 저항성 확보의 법률상 의무","t":["T01","T02","T04","T06"],"ts":"verbatim","v":"primary_source","en":"§ 46 (\"Requirements for the design of a nuclear installation and for designing\") requires the design to: (e) ensure the resistance and protection of the installation against dangers arising from the properties of the siting territory and from EXTERNAL INFLUENCES; and (f) establish requirements for the scope and manner of evaluating that resistance and protection. § 46 is one of the provisions § 236 empowers SÚJB to implement by decree — which is decree 329/2017 Sb.","ko":"§ 46(「원자력시설 설계에 관한 요건 및 설계」)은 설계가 다음을 하도록 요구한다: (e) 원자력시설 입지 지역의 특성 및 **외부영향**으로부터 발생하는 위험에 대한 시설의 저항성과 방호를 확보할 것; (f) (e)의 저항성·방호를 평가하는 범위와 방법에 관한 요건을 정할 것. § 46은 § 236이 SÚJB에 시행령 제정을 위임한 조항 중 하나이며, 그 시행령이 바로 329/2017이다.","kp":null,"u":"https://www.zakonyprolidi.cz/cs/2016-263","nt":""},{"id":"CZ-329-2017-aircraft-dbe","s":"CZ-329-2017","doc":"vyhláška č. 329/2017 Sb.","j":"CZ","loc":"vyhláška č. 329/2017 Sb., § 11 odst. 4 písm. b)","he":"Accidental fall of an aircraft or other object — the 1E-7/yr basis","hk":"항공기 또는 기타 물체의 우발적 낙하 — 1E-7/년 기준","t":["T02","T03","T04","T05","T06","T13"],"ts":"verbatim","v":"primary_source","en":"§ 11(4) applies to basic external design events used for the design and for the evaluation of resistance of selected equipment and systems, structures and components with an influence on nuclear safety that are NECESSARY FOR MANAGING EMERGENCY CONDITIONS AND RADIATION EMERGENCIES, at nuclear installations with a reactor of thermal power exceeding 50 MW. For those SSCs: (a) seismic resistance must be based on a postulated peak horizontal ground acceleration of the structure carrying the SSC of at least 1/10 of gravitational acceleration (0.1 g); (b) resistance against the accidental fall of an aircraft OR ANOTHER OBJECT must be based on the intensity of the effects of the fall of such an object whose frequency of falling onto an area where it could cause a basic external initiating event is higher than once in 10,000,000 years (> 1E-7/yr).","ko":"§ 11(4)는 열출력 50 MW를 초과하는 원자로를 가진 원자력시설에서, 핵안전에 영향을 미치며 **사고조건 및 방사선비상 관리에 필요한** 선정 설비·계통·구조물·기기의 설계 및 저항성 평가에 사용되는 기본 외부 설계사건에 적용된다. 해당 SSC에 대해: (a) 내진저항성은 해당 SSC를 지지하는 구조물 지반의 가정 최대수평가속도를 중력가속도의 **1/10(0.1 g) 이상**으로 하여 정한다; (b) 항공기 **또는 기타 물체**의 우발적 낙하에 대한 저항성은, 기본 외부 기인사건을 유발할 수 있는 구역에 낙하할 빈도가 1천만 년에 1회를 초과하는(> 1E-7/년) 물체의 낙하 영향 강도를 기준으로 정한다.","kp":{"applicability_threshold":"reactor thermal power > 50 MW","ssc_scope":"selected SSCs necessary for managing emergency conditions and radiation emergencies","seismic_floor":"0.1 g minimum postulated PGA (§ 11(4)(a))","aircraft_frequency":"> 1E-7 per year (§ 11(4)(b))","object_scope":"aircraft OR another object"},"u":"https://www.zakonyprolidi.cz/cs/2017-329","nt":"LOCATOR CORRECTION. The previous version placed this at \"§ 13 odst. 2 písm. b)\" from a search result. The primary text puts it at § 11(4)(b). The quoted Czech wording and the 1E-7/yr figure recovered earlier were otherwise accurate, as was the reading that the SSC scope is narrowed to emergency-management SSCs rather than all safety SSCs. New from the primary text: § 11(4)(a) sets a 0.1 g seismic floor for the same SSC set, which shows the two hazards being treated as a matched pair of minimum design bases."},{"id":"CZ-329-2017-conservative-approach","s":"CZ-329-2017","doc":"vyhláška č. 329/2017 Sb.","j":"CZ","loc":"vyhláška č. 329/2017 Sb., § 12 odst. 1","he":"Conservative approach for basic external design events","hk":"기본 외부 설계사건에 대한 보수적 접근","t":["T04","T12"],"ts":"summary","v":"primary_source","en":"§ 12(1): the design bases must ensure fulfilment of the principles of safe use of nuclear energy for basic external design events and their highly probable combinations, with a CONSERVATIVE APPROACH to the assumed initial state of the installation and to possible accompanying failures that do not prevent effective actuation of the safety systems.","ko":"§ 12(1): 설계기준은 기본 외부 설계사건 및 그 발생가능성이 높은 조합에 대해, 원자력시설의 초기상태 가정과 안전계통의 유효한 작동을 방해하지 않는 동반고장 가능성에 관하여 **보수적 접근법**으로 원자력 안전이용 원칙의 충족을 보장해야 한다.","kp":{"approach":"conservative (konzervativní přístup)"},"u":"https://www.zakonyprolidi.cz/cs/2017-329","nt":"This is the provision that makes the CW-04 divergence concrete. Because the Czech accidental aircraft crash is a basic external design event, it is analysed under this conservative approach — whereas 10 CFR 50.150(a)(1) requires \"realistic analyses\" and RG 1.217 confirms design-basis requirements do not attach to features selected solely for the aircraft rule."},{"id":"CZ-329-2017-external-events-general","s":"CZ-329-2017","doc":"vyhláška č. 329/2017 Sb.","j":"CZ","loc":"vyhláška č. 329/2017 Sb., § 11 odst. 1-3","he":"Basic external design events and the 1E-4/yr intensity level","hk":"기본 외부 설계사건 및 1E-4/년 강도 수준","t":["T04","T05","T06"],"ts":"summary","v":"primary_source","en":"§ 11(1): the basic design bases must establish the basic external design events for the territory where the installation is to be sited; these events are the limiting value of loading of SSCs by territorial properties and their combinations at which the safety objectives of the design are met with high credibility. § 11(2): all events induced by territorial properties included in the siting assessment must be taken into account. § 11(3): the intensity of a basic external design event must equal the intensity of the evaluated territorial property with an occurrence frequency of ONCE PER 10,000 YEARS (1E-4/yr) or lower, except for territorial properties for which the siting assessment method requires other occurrence frequencies and corresponding acceptance criteria.","ko":"§ 11(1): 기본 설계기준은 시설이 입지할 지역에 대한 기본 외부 설계사건을 정해야 한다. 이 사건들은 지역특성 및 그 조합에 의한 SSC 부하의 한계값으로서, 그 수준에서 설계의 안전목표가 높은 신뢰도로 충족되는 값이다. § 11(2): 부지선정 평가에 포함된 지역특성으로 유발되는 모든 사건을 고려해야 한다. § 11(3): 기본 외부 설계사건의 강도는 발생빈도가 **1만 년에 1회(1E-4/년)** 이하인 평가 대상 지역특성의 강도와 같아야 한다. 다만 부지선정 평가방법에 따라 다른 발생빈도와 그에 상응하는 허용기준을 적용해야 하는 지역특성은 예외로 한다.","kp":{"general_external_event_frequency":"1E-4 per year (once per 10,000 years) or lower","definition":"limiting load at which design safety objectives are met with high credibility"},"u":"https://www.zakonyprolidi.cz/cs/2017-329","nt":"LOCATOR CORRECTION. The previous version placed this at \"§ 6 and § 12\" on the strength of search snippets. The primary text puts it at § 11(1)-(3). The 1E-4/yr figure itself was recorded correctly."},{"id":"CZ-329-2017-intentional-attack","s":"CZ-329-2017","doc":"vyhláška č. 329/2017 Sb.","j":"CZ","loc":"vyhláška č. 329/2017 Sb., § 10 odst. 1 písm. d)","he":"Intentional aircraft attack as a design input via the physical protection plan","hk":"물리적방호계획을 통한 고의적 항공기 공격의 설계입력화","t":["T03","T04","T13","T06"],"ts":"summary","v":"primary_source","en":"§ 10(1) lists what the design bases (projektová východiska) must establish. Item (d) requires the design bases to include \"data of the physical protection plan derived from the analysis of consequences in the case of an INTENTIONAL ATTACK BY A TRANSPORT AIRCRAFT against the nuclear installation\". The malicious aircraft impact is therefore not outside the design decree: it enters the design bases as an input carried over from the physical protection plan, alongside the accidental crash handled separately in § 11(4)(b).","ko":"§ 10(1)은 설계기준(projektová východiska)이 정해야 할 사항을 열거한다. 그중 (d)는 설계기준이 \"원자력시설에 대한 **수송항공기에 의한 고의적 공격** 시의 결과분석에서 도출된 물리적방호계획의 자료\"를 포함하도록 요구한다. 따라서 고의적 항공기 충돌은 설계 시행령 밖에 있는 것이 아니라, 물리적방호계획으로부터 넘어온 입력으로서 설계기준 안으로 들어온다. 우발적 추락은 § 11(4)(b)에서 별도로 다룬다.","kp":{"threat_type":"úmyslný útok dopravním letadlem — intentional attack by a transport aircraft","route_into_design":"physical protection plan → consequence analysis → design bases","separate_from":"the accidental fall provision in § 11(4)(b)"},"u":"https://www.zakonyprolidi.cz/cs/2017-329","nt":"MAJOR CORRECTION. The previous database contained an editorial record (CZ-malicious-separation) asserting that the Czech framework handles the deliberate aircraft impact through security provisions rather than the public design decree. That record has been deleted. The decree itself puts the intentional attack into the design bases at § 10(1)(d). What remains true is that the threat characterisation lives in the physical protection plan, which is not public — but the design obligation is public and explicit. This makes the Czech treatment structurally CLOSER to EUR (which also names an intentional crash case) than the previous version of this database claimed."},{"id":"CZ-378-2016-s13-aircraft","s":"CZ-378-2016","doc":"vyhláška č. 378/2016 Sb.","j":"CZ","loc":"vyhláška č. 378/2016 Sb., § 13 — Pád letadla a jiných objektů","he":"Siting-stage probability of an aircraft fall exceeding the design's assumed resistance","hk":"부지단계 — 설계 상정 저항성을 초과하는 항공기 낙하의 확률 산정","t":["T02","T05","T06"],"ts":"verbatim","v":"primary_source","en":"§ 13 \"Fall of an aircraft and other objects\": the assessment of the siting territory in respect of the fall of an aircraft and other objects must be carried out by DETERMINING THE PROBABILITY of a fall of an aircraft or other object WHOSE CONSEQUENCES WOULD EXCEED THE RESISTANCE, ASSUMED BY THE DESIGN of the nuclear installation, OF STRUCTURES, SYSTEMS AND COMPONENTS WITH AN INFLUENCE ON NUCLEAR SAFETY.","ko":"§ 13 「항공기 및 기타 물체의 낙하」: 항공기 및 기타 물체의 낙하 관점에서의 부지 평가는, **그 결과가 원자력시설 설계가 상정한 핵안전 영향 SSC의 저항성을 초과하게 되는** 항공기 또는 기타 물체 낙하의 **확률을 산정**함으로써 수행되어야 한다.","kp":{"quantity":"probability of a consequence-exceeding fall, not raw crash frequency","reference_point":"the resistance of safety-relevant SSCs ASSUMED BY THE DESIGN","decree_status":"378/2016 Sb., Sbírka částka 151/2016, in force 1 January 2017 — number CONFIRMED"},"u":"https://www.zakonyprolidi.cz/cs/2016-378","nt":"RESOLVES THE LAST to_verify RECORD, and the content is sharper than this database previously guessed. The siting decree does not ask for a bare crash frequency: it asks for the probability of a fall whose consequences would EXCEED the resistance the design assumes. That makes siting and design mutually dependent — 378/2016 § 13 needs the design's assumed resistance as its input, while 329/2017 § 11(4)(b) needs the 1E-7/yr falling-object screen as its input. The two decrees are iterated against each other, which is exactly the feedback process SSG-68 para. 3.4 recommends between site hazard evaluation and installation design."},{"id":"CZ-378-2016-scope","s":"CZ-378-2016","doc":"vyhláška č. 378/2016 Sb.","j":"CZ","loc":"vyhláška č. 378/2016 Sb., § 3 odst. 1 písm. b), § 15, § 20","he":"Air-related site properties and the handoff to the design","hk":"항공 관련 부지특성 및 설계로의 인계","t":["T02","T06","T14"],"ts":"summary","v":"primary_source","en":"§ 3(1)(b) lists the human-induced phenomena to be assessed at the site, opening with (1) the fall of an aircraft and other objects and including (8) negative manifestations of air, road, rail and water transport. § 15(1)(c) requires checking whether the installation's land encroaches on the protection zone of AVIATION STRUCTURES — though the outright siting prohibition in § 15(2) attaches only to road and railway protection zones, not to the aviation one. § 20(b)(8) requires the siting safety report to state the REQUIREMENTS FOR THE DESIGN OF THE NUCLEAR INSTALLATION ARISING FROM THE ASSESSMENT OF THE TERRITORY — the formal handoff from decree 378/2016 to decree 329/2017.","ko":"§ 3(1)(b)는 부지에서 평가할 인위적 현상을 열거하며 (1) 항공기 및 기타 물체의 낙하로 시작하고 (8) 항공·도로·철도·수상 운송의 부정적 발현을 포함한다. § 15(1)(c)는 시설 부지가 **항공 시설물의 보호구역**에 저촉되는지 확인하도록 요구하나, § 15(2)의 입지 금지는 도로·철도 보호구역에만 걸리고 항공 보호구역에는 걸리지 않는다. § 20(b)(8)은 부지 안전보고서에 **지역 평가로부터 도출된 원자력시설 설계에 대한 요건**을 기재하도록 요구한다 — 시행령 378/2016에서 329/2017로의 공식 인계 지점이다.","kp":{"hazard_list_position":"aircraft fall is the FIRST listed human-induced phenomenon","aviation_zone":"checked under § 15(1)(c) but not a siting prohibition under § 15(2)","handoff":"§ 20(b)(8) — design requirements arising from the site assessment"},"u":"https://www.zakonyprolidi.cz/cs/2016-378","nt":""},{"id":"EU-2014-87-framework","s":"EU-2014-87-EURATOM","doc":"Council Directive 2014/87/Euratom","j":"EU","loc":"Council Directive 2014/87/Euratom, Articles 8a and 8b","he":"Nuclear safety objective and the defence-in-depth hazard clause","hk":"원자력안전 목표 및 심층방어 재해 조항","t":["T01","T04","T12","T13"],"ts":"verbatim","v":"primary_source","en":"Article 8a(1): Member States shall ensure the national framework requires nuclear installations to be \"designed, sited, constructed, commissioned, operated and decommissioned with the objective of preventing accidents and, should an accident occur, mitigating its consequences and avoiding: (a) early radioactive releases that would require off-site emergency measures but with insufficient time to implement them; (b) large radioactive releases that would require protective measures that could not be limited in area or time.\" Article 8a(2)(a) applies that objective to installations for which a construction licence is granted for the first time after 14 August 2014, and 8a(2)(b) makes it a reference for reasonably practicable improvements to existing installations. Article 8b(1)(a): where defence in depth applies, it shall be applied to ensure that \"the impact of extreme external natural and UNINTENDED MAN-MADE hazards is minimised\" — followed by (d) accidents within the design basis are controlled and (e) severe conditions are controlled. Recital 20 requires an applicant for a new power or research reactor to demonstrate that the design limits the effects of reactor core damage to within the containment, proving a large or unauthorised release outside containment is extremely unlikely.","ko":"제8a조 제1항: 회원국은 국가체계가 원자력시설을 \"사고를 예방하고, 사고 발생 시 그 결과를 완화하며, 다음을 회피할 목적으로 설계·입지·건설·시운전·운전·해체\"하도록 요구할 것을 보장해야 한다: (a) 부지 외 비상조치를 요하나 이를 시행할 시간이 부족한 조기 방사성물질 방출; (b) 구역이나 시간으로 제한할 수 없는 방호조치를 요하는 대량 방사성물질 방출. 제8a조 제2항 (a)는 2014년 8월 14일 이후 최초로 건설허가가 부여된 시설에 이 목표를 적용하고, (b)는 기존 시설의 합리적으로 실행 가능한 개선의 기준으로 삼도록 한다. 제8b조 제1항 (a): 심층방어가 적용되는 경우 \"극한 외부 자연재해 및 **의도하지 않은 인위적(unintended man-made)** 재해의 영향이 최소화\"되도록 적용되어야 하며, (d) 설계기준 내 사고의 제어, (e) 심각조건의 제어가 뒤따른다. 전문 (20)은 신규 발전용·연구용 원자로 허가 신청자가 설계가 노심손상의 영향을 격납건물 내로 제한함을 입증하고, 격납건물 외부로의 대량·비인가 방출이 극히 발생가능성이 낮음을 증명하도록 요구한다.","kp":{"objective":"prevent accidents; avoid early and large releases","hazard_wording":"extreme external natural and UNINTENDED man-made hazards","new_build_cutoff":"construction licence first granted after 14 August 2014","transposition_deadline":"15 August 2017","peer_review_cycle":"first topical peer review 2017, then at least every six years","prescribes_aircraft_load":false},"u":"https://eur-lex.europa.eu/eli/dir/2014/87/oj","nt":"UPGRADED FROM model_knowledge TO primary_source, and one wording point matters for CW-10. Article 8b(1)(a) says \"unintended man-made hazards\": the directive's defence-in-depth clause reaches the ACCIDENTAL aircraft crash and expressly not the deliberate one. That is a tighter statement than the earlier record's general claim that security is outside scope — the exclusion is visible in the operative article, not only in the recitals. Article 3 also supplies the definitions the whole comparison rests on: \"design basis\" is \"the range of conditions and events taken explicitly into account in the design ... so that the installation can withstand them without exceeding authorised limits by the planned operation of safety systems\", and \"severe conditions\" are \"conditions that are more severe than conditions related to design basis accidents\"."},{"id":"EU-EUR-aircraft-structure","s":"EU-EUR","doc":"EUR Volume 2","j":"EU","loc":"EUR Vol. 2 Ch. 2.4 §1.3.3 and Ch. 2.1 §2.6.2.1.1 / §8.3.3","he":"EUR splits the aircraft crash across two chapters and two regimes","hk":"EUR은 항공기 충돌을 두 개 장·두 개 체계로 분리한다","t":["T03","T04","T13"],"ts":"summary","v":"primary_source","en":"EUR treats the accidental and the intentional aircraft crash as two separate subjects, each appearing twice — once in the safety-requirements chapter and once in the design-basis chapter: ACCIDENTAL — Ch. 2.1 §2.6.2.1.1 \"Accidental aircraft crash\", under §2.6.2.1 \"Identification of external hazards for standard design\"; and Ch. 2.4 §1.3.3.1 \"Accidental Aircraft crash\", under §1.3 \"Man-Made External hazards\", carrying TWO load functions: §1.3.3.1.1 \"Figure 4 - Light Aircraft load function\" and §1.3.3.1.2 \"Figure 5 - Military Aircraft load function\". INTENTIONAL — Ch. 2.1 §8.3.3 \"Intentional aircraft crash\", under §8.3 SECURITY (alongside §8.3.2 \"Design of physical protection system\"); and Ch. 2.4 §1.3.3.2 \"Intentional Aircraft crash\", with §1.3.3.2.1 \"Figure 6 - Example of intentional aircraft impact load function\". Ch. 2.4 §1.4 \"Sabotage\" sits as a further separate man-made hazard, and Ch. 2.4 §5.8.1.4 \"Aircraft impact\" appears again under design loads for buildings.","ko":"EUR은 우발적 충돌과 고의적 충돌을 별개 주제로 다루며, 각각 안전요건 장과 설계기준 장에 한 번씩 총 두 번 등장한다: **우발적** — 제2.1장 §2.6.2.1.1 \"Accidental aircraft crash\"(§2.6.2.1 표준설계 외부재해 식별 하위); 제2.4장 §1.3.3.1 \"Accidental Aircraft crash\"(§1.3 인위적 외부재해 하위)이며 하중함수가 **두 개**다: §1.3.3.1.1 \"그림 4 — 경항공기 하중함수\", §1.3.3.1.2 \"그림 5 — **군용항공기** 하중함수\". **고의적** — 제2.1장 §8.3.3 \"Intentional aircraft crash\"(§8.3 **보안(Security)** 하위, §8.3.2 물리적방호계통 설계와 나란히); 제2.4장 §1.3.3.2 \"Intentional Aircraft crash\", §1.3.3.2.1 \"그림 6 — 고의적 항공기 충돌 하중함수 예시\". 제2.4장 §1.4 \"Sabotage\"는 또 다른 별도 인위적 재해로 존재하고, 제2.4장 §5.8.1.4 \"Aircraft impact\"가 건물 설계하중 항목에 다시 등장한다.","kp":{"accidental_load_functions":["Light Aircraft","Military Aircraft"],"intentional_load_function":"example intentional aircraft impact load function","intentional_placement":"Chapter 2.1 §8.3 SECURITY","accidental_placement":"Chapter 2.1 §2.6 external hazards; Chapter 2.4 §1.3 man-made external hazards","separate_sabotage_section":"Ch. 2.4 §1.4"},"u":"https://europeanutilityrequirements.eu/","nt":"MAJOR FINDING, and it revises what this database previously said. EUR's ACCIDENTAL design case is a LIGHT AIRCRAFT and a MILITARY AIRCRAFT — not a large commercial one. The large-aircraft threat is carried by the INTENTIONAL case, which EUR files under Security. So EUR and 10 CFR 50.150 are not addressing the same event through different regimes: EUR's accidental case is a smaller aircraft than the US case, and EUR's large-aircraft case is a security subject. Earlier records here described EUR as defining \"multiple threat scenarios with multi-level performance objectives\" from secondary sources; the actual structure is sharper and differently organised. The VALUES in Figures 4, 5 and 6 remain licensed and are not held here."},{"id":"EU-EUR-design-conditions","s":"EU-EUR","doc":"EUR Volume 2","j":"EU","loc":"EUR Vol. 2 Ch. 2.1 §2 (Design Conditions) and §5.1.7","he":"EUR plant-state framework and resistance levels","hk":"EUR 발전소 상태 체계 및 저항수준","t":["T04","T06","T12"],"ts":"summary","v":"primary_source","en":"Chapter 2.1 §2 \"Design Conditions\" runs: §2.1 Plant states, §2.2 Postulated initiating events, §2.3 Design Basis Accidents, §2.4 Design Extension Conditions — split into §2.4.1 Complex Sequences and §2.4.2 Severe Accidents — and §2.5 Practical elimination. §2.6 \"Internal and external hazards\" then separates identification for STANDARD DESIGN (§2.6.2.1) from identification for SITE-SPECIFIC evaluation (§2.6.2.2), with §2.6.3 screening for site-specific evaluation and §2.6.4 external hazard design rules for both. §5.1.7 defines \"Environmental condition resistance levels\" 1, 2, S and N, and §9.3 gives two hazard lists — one for standard design, one for site-specific evaluation.","ko":"제2.1장 §2 \"설계조건\"의 구성: §2.1 발전소 상태, §2.2 가정 기인사건, §2.3 설계기준사고, §2.4 설계확장조건(§2.4.1 복합시퀀스, §2.4.2 중대사고로 분리), §2.5 실질적 배제 (practical elimination). 이어 §2.6 \"내부 및 외부 재해\"는 **표준설계용 식별**(§2.6.2.1)과 **부지특정 평가용 식별**(§2.6.2.2)을 분리하고, §2.6.3 부지특정 스크리닝, §2.6.4 양자에 대한 외부재해 설계규칙을 둔다. §5.1.7은 환경조건 저항수준 1·2·S·N을 정의하며, §9.3은 표준설계용과 부지특정 평가용 두 개의 재해 목록을 제공한다.","kp":{"plant_states":["Design Basis Accidents","Design Extension Conditions (Complex Sequences, Severe Accidents)","Practical elimination"],"hazard_identification_split":"standard design vs site-specific evaluation, with separate hazard lists (§9.3.1, §9.3.2)","resistance_levels":["1","2","S","N"]},"u":"https://europeanutilityrequirements.eu/","nt":"The standard-design / site-specific split is the structural feature that lets EUR put the accidental aircraft crash into the STANDARD design (a fixed light/military aircraft load function applying to every EUR plant) while leaving site-specific hazards to §2.6.2.2. Czech decree 329/2017 has no standard-design layer: everything is derived from the site under § 11. That is a real architectural difference, separate from the design-basis / beyond-design-basis question in CW-04."},{"id":"EU-EUR-scope","s":"EU-EUR","doc":"EUR Volume 2","j":"EU","loc":"EUR Volume 2, Revision E (December 2016)","he":"What EUR is and who stands behind it","hk":"EUR의 성격과 주체","t":["T01","T02"],"ts":"summary","v":"primary_source","en":"The European Utility Requirements for LWR Nuclear Power Plants, Volume 2 \"Generic and Nuclear Island Requirements\", Revision E, December 2016. The copyright line names the promoters: CEZ, EDF, EDF Energy, ENERGOATOM, ENGIE/TRACTEBEL, FORTUM, Gen Energija, HORIZON, IBERDROLA, MVM Paks II, NRG, ROSENERGOATOM, TVO, VGB PowerTech. Each chapter carries the disclaimer that \"the EUR promoters assume no liability for any consequences of the use of any part of the EUR document by a third party\". EUR is a utility-side contractual specification, not a legal instrument: it binds a vendor only through the procurement contract that invokes it.","ko":"「경수로 원전에 관한 유럽 사업자 요건」제2권 \"일반 및 원자로계통 요건\", Rev. E, 2016년 12월. 저작권 표시에 참여 사업자가 명기되어 있다: CEZ, EDF, EDF Energy, ENERGOATOM, ENGIE/TRACTEBEL, FORTUM, Gen Energija, HORIZON, IBERDROLA, MVM Paks II, NRG, ROSENERGOATOM, TVO, VGB PowerTech. 각 장에는 \"EUR 참여사는 제3자의 EUR 문서 사용 결과에 대해 어떠한 책임도 지지 않는다\"는 면책조항이 있다. EUR은 법령이 아니라 사업자 측 계약 사양이며, EUR을 인용한 구매계약을 통해서만 공급자를 구속한다.","kp":{"revision":"E, December 2016","promoters":14,"legal_nature":"contractual utility requirement","czech_promoter":"CEZ — the Czech utility is an EUR promoter, so EUR and Czech regulation share an author community"},"u":"https://europeanutilityrequirements.eu/","nt":"Worth noting for the comparison: CEZ is an EUR promoter and SÚJB is a WENRA member, so the Czech design decree and EUR are not independent observations — they draw on overlapping European practice."},{"id":"EU-WENRA-TU1-objective","s":"EU-WENRA-SRL","doc":"WENRA Safety Reference Levels for Existing Reactors (2020) + Issue TU guidance","j":"EU","loc":"WENRA SRL 2020, Issue TU, TU1.1","he":"External hazards as an integral part of the safety demonstration","hk":"안전성 입증의 필수 구성요소로서의 외부재해","t":["T01","T02","T04"],"ts":"verbatim","v":"primary_source","en":"\"TU1.1 External hazards, comprising natural and external human induced hazards, shall be considered an integral part of the safety demonstration of the plant (including spent fuel storage). Threats from external hazards shall be removed or minimised as far as reasonably practicable for all operational plant states. The safety demonstration in relation to external hazards shall include assessments of the design basis and design extension conditions with the aim to identify needs and opportunities for improvement.\" Footnote 88 to this issue: \"Within these reference levels malicious acts are not considered.\"","ko":"\"TU1.1 자연재해 및 외부 인위적 재해로 구성되는 외부재해는 발전소(사용후핵연료 저장 포함) 안전성 입증의 필수 구성요소로 간주되어야 한다. 외부재해로 인한 위협은 모든 운전상태에 대해 합리적으로 실행 가능한 한 제거되거나 최소화되어야 한다. 외부재해에 관한 안전성 입증에는 개선 필요사항과 기회를 식별할 목적으로 설계기준 및 설계확장조건에 대한 평가가 포함되어야 한다.\" 본 이슈의 각주 88: \"본 기준수준에서 악의적 행위는 고려하지 않는다.\"","kp":{"scope":"design basis AND design extension conditions","malicious_acts":"expressly excluded from the reference levels"},"u":"https://wenra.eu/sites/default/files/publications/wenra_safety_reference_level_for_existing_reactors_2020.pdf","nt":""},{"id":"EU-WENRA-TU2-hazard-list","s":"EU-WENRA-SRL","doc":"WENRA Safety Reference Levels for Existing Reactors (2020) + Issue TU guidance","j":"EU","loc":"WENRA SRL 2020, Issue TU, TU2.1-TU2.2","he":"Mandatory external hazard list including accidental aircraft crash","hk":"우발적 항공기 추락을 포함한 필수 외부재해 목록","t":["T02","T06","T11"],"ts":"verbatim","v":"primary_source","en":"\"TU2.1 All external hazards that might affect the site shall be identified, including any related hazards (e.g. earthquake and tsunami, accidental aircraft crash with consequential aircraft fuel fire). Justification shall be provided that the compiled list of external hazards is complete and relevant to the site.\" TU2.2 requires the list to include at least: geological hazards; seismotectonic hazards; meteorological hazards; hydrological hazards; biological phenomena; external fire; ACCIDENTAL AIRCRAFT CRASH; accidents at facilities outside the site area; transportation accidents; electrical disturbances and electromagnetic interferences.","ko":"\"TU2.1 부지에 영향을 줄 수 있는 모든 외부재해를 식별해야 하며, 관련 재해(예: 지진과 쓰나미, **우발적 항공기 추락 및 그에 따른 항공유 화재**)를 포함한다. 작성된 외부재해 목록이 완전하고 부지에 적합함을 정당화해야 한다.\" TU2.2는 목록에 최소한 다음을 포함하도록 요구한다: 지질재해; 지진구조재해; 기상재해; 수문재해; 생물현상; 외부화재; **우발적 항공기 추락**; 부지 외부 시설의 사고; 수송사고; 전기적 교란 및 전자기 간섭.","kp":{"aircraft_entry":"accidental aircraft crash with consequential aircraft fuel fire — a related-hazard pair","list_status":"minimum mandatory list"},"u":"https://wenra.eu/sites/default/files/publications/wenra_safety_reference_level_for_existing_reactors_2020.pdf","nt":"Note that WENRA treats the crash and the ensuing fuel fire as a RELATED HAZARD PAIR to be identified together — the same coupling SSG-68 para. 5.163(d) makes and that NEI 07-13 handles as its separate \"fire effects\" limb."},{"id":"EU-WENRA-TU3-screening","s":"EU-WENRA-SRL","doc":"WENRA Safety Reference Levels for Existing Reactors (2020) + Issue TU guidance","j":"EU","loc":"WENRA SRL 2020, Issue TU, TU3.1-TU3.3","he":"Screening and hazard assessment method","hk":"스크리닝 및 재해평가 방법","t":["T05","T07"],"ts":"summary","v":"primary_source","en":"TU3.1: hazards may be screened out on the basis of being incapable of posing a physical threat, or being extremely unlikely with a high degree of confidence; care shall be taken not to exclude hazards which in combination with others could pose a threat; the screening process shall be based on conservative assumptions and its arguments justified. TU3.2: for hazards not screened out, assessments shall use deterministic and, as far as practicable, probabilistic methods reflecting the current state of science and technology, producing a relationship between hazard severity and exceedance frequency where practicable, and determining the maximum credible hazard severity where practicable. TU3.3: assessments shall use all relevant site and regional data, extend beyond recorded and historical data, give special consideration to hazards whose severity changes over plant lifetime, justify methods and assumptions, and evaluate uncertainties.","ko":"TU3.1: 물리적 위협이 될 수 없거나 높은 신뢰도로 극히 발생가능성이 낮은 재해는 배제할 수 있다. 다만 다른 재해와 조합될 경우 위협이 될 수 있는 재해를 배제하지 않도록 주의해야 한다. 스크리닝은 보수적 가정에 기반해야 하며 그 논거를 정당화해야 한다. TU3.2: 배제되지 않은 재해는 결정론적 방법과, 실행 가능한 한 확률론적 방법을 사용하여 현재의 과학기술 수준을 반영해 평가하고, 실행 가능한 경우 재해강도와 초과빈도의 관계를 도출하며 최대 신뢰가능 재해강도를 정한다. TU3.3: 부지·지역 자료를 모두 활용하고 기록·역사 자료를 넘어 확장하며, 수명기간 중 강도가 변하는 재해를 특별히 고려하고, 방법·가정을 정당화하며 불확실성을 평가한다.","kp":{"screening_basis":"incapable of physical threat OR extremely unlikely with high confidence","combination_caution":"do not exclude hazards that combine into a threat","methods":"deterministic and, as far as practicable, probabilistic"},"u":"https://wenra.eu/sites/default/files/publications/wenra_safety_reference_level_for_existing_reactors_2020.pdf","nt":""},{"id":"EU-WENRA-TU4-design-basis","s":"EU-WENRA-SRL","doc":"WENRA Safety Reference Levels for Existing Reactors (2020) + Issue TU guidance","j":"EU","loc":"WENRA SRL 2020, Issue TU, TU4.2","he":"Design basis exceedance frequency, the 0.1 g seismic floor and the aircraft minimum","hk":"설계기준 초과빈도, 0.1 g 내진 하한, 항공기 최소방호","t":["T04","T05","T12"],"ts":"verbatim","v":"primary_source","en":"\"TU4.2 The exceedance frequencies of design basis events shall be low enough to ensure a high degree of protection with respect to external hazards. An exceedance frequency not higher than 10^-4 per annum shall be used for the design basis events. Where it is not possible to calculate these frequencies with an acceptable degree of certainty, an event shall be chosen and justified to reach an equivalent level of safety. For the specific case of seismic loading, as a minimum, a horizontal peak ground acceleration value of 0.1g (where 'g' is the acceleration due to gravity) shall be applied, even if its exceedance frequency would be below 10^-4 per annum. For accidental airplane crashes and explosion blast waves a design basis event shall be defined to ensure a minimum protection of the plant.\"","ko":"\"TU4.2 설계기준사건의 초과빈도는 외부재해에 대해 높은 수준의 방호를 보장할 만큼 충분히 낮아야 한다. 설계기준사건에는 **연간 10^-4 이하의 초과빈도**를 사용해야 한다. 해당 빈도를 수용 가능한 확실성으로 산정할 수 없는 경우, 동등한 안전수준에 도달하는 사건을 선정하고 정당화해야 한다. 지진하중의 경우 최소한 **수평 최대지반가속도 0.1g**를 적용해야 하며, 그 초과빈도가 연간 10^-4 미만이더라도 그러하다. **우발적 항공기 추락 및 폭발 폭풍파에 대해서는 발전소의 최소 방호를 보장하도록 설계기준사건을 정의해야 한다.**\"","kp":{"design_basis_frequency":"not higher than 1E-4 per annum","seismic_floor":"0.1 g horizontal PGA minimum, regardless of frequency","aircraft_rule":"a design basis event shall be defined to ensure minimum protection — frequency-independent"},"u":"https://wenra.eu/sites/default/files/publications/wenra_safety_reference_level_for_existing_reactors_2020.pdf","nt":"KEY STRUCTURAL FINDING. This single reference level is the source of the three-part structure found in Czech decree 329/2017: the 1E-4/yr design basis level (§ 11(3)), the 0.1 g seismic floor (§ 11(4)(a)) and a defined minimum design basis for the accidental aircraft crash (§ 11(4)(b)). The Czech decree reads as a near-literal transposition of TU4.2, which explains why its aircraft provision is paired with a seismic minimum and why the crash sits inside the design basis rather than beyond it. Note the difference in mechanism: WENRA requires a design basis event to be DEFINED for the accidental aircraft crash to ensure minimum protection, without tying it to a frequency; the Czech decree implements that by fixing the 1E-7/yr falling-object criterion. WENRA does not state the 1E-7 figure."},{"id":"IAEA-SRS-86-framework","s":"IAEA-SRS-86","doc":"Safety Reports Series No. 86","j":"INT","loc":"Safety Reports Series No. 86","he":"Framework and roadmap for human-induced external events","hk":"인위적 외부사건에 대한 체계 및 로드맵","t":["T02","T04","T06"],"ts":"verbatim","v":"primary_source","en":"Objective: \"to provide the framework of methods to be implemented for the design and evaluation of nuclear facilities subjected to extreme human induced external events. This framework addresses the performance of the overall facility, and individual SSCs, from the standpoint of complying with the fundamental safety functions.\" Scope: the report concentrates on developing a methodology and its application to existing and new nuclear power plants, extensible to other facilities with suitable grading based on potential radioactive releases. Two limits are stated explicitly: \"The external events considered are limited to human induced events of ACCIDENTAL ORIGIN and EXCLUDE EVENTS THAT MAY BE THE RESULT OF MALEVOLENT ACTION\", and the guidance \"represents expert opinion but does not constitute recommendations made on the basis of a consensus of Member States\". The report also defines a SUCCESS PATH as \"a set of systems and associated components that can be used to bring the plant to a stable hot or cold shutdown condition and to maintain this condition for a specified period of time\".","ko":"목적: \"극한 인위적 외부사건을 받는 원자력시설의 설계 및 평가에 적용할 방법론 체계를 제공하는 것. 본 체계는 기본 안전기능 충족 관점에서 시설 전체와 개별 SSC의 성능을 다룬다.\" 범위: 방법론 개발과 기존·신규 원전 적용에 중점을 두며, 잠재 방사성물질 방출에 따른 적절한 등급화를 통해 다른 시설로 확장 가능하다. 두 가지 한계가 명시된다 — \"고려되는 외부사건은 **우발적 기원**의 인위적 사건에 한정되며 **악의적 행위에 의한 사건은 제외**한다\", 그리고 본 지침은 \"전문가 의견을 나타내며 회원국 합의에 기반한 권고를 구성하지 않는다\". 또한 **성공경로(success path)**를 \"발전소를 안정적 고온 또는 저온 정지상태로 이행시키고 그 상태를 지정된 기간 동안 유지하는 데 사용할 수 있는 계통 및 관련 기기의 집합\"으로 정의한다.","kp":{"scope_limit":"human induced events of ACCIDENTAL origin only; malevolent action excluded","normative_weight":"expert opinion, not a consensus recommendation of Member States","evaluation_level":"overall facility AND individual SSCs, against the fundamental safety functions","success_path":"systems and components able to reach and hold stable hot or cold shutdown for a specified period"},"u":"https://www-pub.iaea.org/MTCD/Publications/PDF/P1721_web.pdf","nt":"The explicit exclusion of malevolent action matters for CW-10: the whole SRS 86/87/88 set — including the structural methods in SRS-87 that CW-08 compares against NEI 07-13 — is scoped to the ACCIDENTAL crash. Applying those methods to a deliberate impact is outside what the reports claim to cover."},{"id":"IAEA-SRS-87-structures","s":"IAEA-SRS-87","doc":"Safety Reports Series No. 87","j":"INT","loc":"Safety Reports Series No. 87","he":"Assessment of structures under human-induced external events","hk":"인위적 외부사건 하 구조물 평가","t":["T07","T08","T09","T10"],"ts":"summary","v":"primary_source","en":"SRS No. 87 (220 pp.) is the structural-assessment volume of the three-part set. It supports quantitative evaluation of the engineering safety of facilities subjected to accidental or postulated human-induced external events. It derives the soft-missile loading function by the Riera method (§2.2.2), covers simplified and detailed structural models, induced vibration with recommended damping values, and fire and fireball phenomena. For local damage it presents a CATALOGUE of empirical formulas — Chang, modified Chang, CRIEPI, NDRC and modified NDRC, and Degen — with their symbols and validity notes, rather than mandating one. It states that empirical formulas are typically based on lightly reinforced (0.3-1.5% each way) concrete targets without transverse reinforcement, that application to heavily reinforced targets is conservative, and that most formulas were developed with SOLID projectiles: when used for aircraft engine parts or landing gear, reduction factors between 0.60 and 0.65 are usually appropriate to account for projectile deformability. IAEA Safety Reports are informative: the document states its contents \"do not constitute recommendations made on the basis of a consensus of Member States\".","ko":"SRS 제87호(220쪽)는 3부작 중 구조물 평가 편이다. 연성 미사일 하중함수를 Riera 방법으로 도출하고(§2.2.2), 단순화·상세 구조모델, 권장 감쇠값을 포함한 유발진동, 화재 및 화구 현상을 다룬다. 국부손상에 대해서는 Chang, modified Chang, CRIEPI, NDRC 및 modified NDRC, Degen 식을 기호·유효범위와 함께 **카탈로그 형태로 제시**할 뿐 특정 식을 강제하지 않는다. 경험식들은 통상 횡방향 철근이 없는 저배근(각 방향 0.3~1.5%) 콘크리트 표적 데이터에 기반하며, 고배근 표적에 적용하면 보수적이라고 기술한다. 또한 대부분의 식이 **고체(solid) 발사체** 시험으로 개발되었으므로, 항공기 엔진 부품이나 착륙장치에 적용할 때는 발사체 변형성을 고려하여 **0.60~0.65의 감소계수**를 적용하는 것이 통상 적절하다고 명시한다. IAEA 안전보고서는 정보성 문서로, 그 내용이 \"회원국 합의에 기반한 권고를 구성하지 않는다\"고 스스로 밝힌다.","kp":{"role":"quantitative structural engineering safety evaluation","counterpart":"NEI 07-13 structural chapters","loading_method":"Riera method (§2.2.2)","local_damage_formulas_presented":["Chang","modified Chang","CRIEPI","NDRC / modified NDRC","Degen"],"formula_stance":"catalogue with validity caveats, not a mandated selection","deformable_projectile_reduction_factor":"0.60-0.65 for aircraft engine parts / landing gear","test_basis_caveat":"formulas derived for lightly reinforced targets without stirrups, using solid projectiles","normative_weight":"informative Safety Report, not a consensus recommendation"},"u":"https://www.iaea.org/publications/10953/safety-aspects-of-nuclear-power-plants-in-human-induced-external-events-assessment-of-structures","nt":"This is the document the user's request refers to as \"IAEA 87\". Note it is a Safety REPORT (informative, no recommendations language), not a Safety Guide — it carries less normative weight than SSG-68 in the IAEA hierarchy."},{"id":"IAEA-SRS-88-margins","s":"IAEA-SRS-88","doc":"Safety Reports Series No. 88","j":"INT","loc":"Safety Reports Series No. 88","he":"Plant and system margin assessment","hk":"발전소 및 계통 여유도 평가","t":["T04","T09","T12"],"ts":"summary","v":"primary_source","en":"SRS No. 88 describes procedures for calculating the margins of nuclear power plants in relation to human-induced external hazards, focusing on plant and systems performance evaluation rather than on individual structures. It provides A TIERED APPROACH TO MARGIN ASSESSMENT, and states that \"the margin is quantified with best estimate or conservative values, such as the high confidence of low probability of failure (HCLPF) value\" — so HCLPF is one quantification among several, not the mandated measure. Aircraft crash is one of the human-induced hazards carried through the method.","ko":"SRS 제88호는 개별 구조물이 아닌 발전소 및 계통 성능 평가에 중점을 두고, 인위적 외부재해에 대한 원전의 여유도를 산정하는 절차를 기술한다. 해당 재해의 기술적 평가를 위해 IAEA 체계에 도입된 HCLPF(낮은 파손확률에 대한 높은 신뢰도) 개념이 이 여유도 평가 계층에 속한다.","kp":{"concept":"tiered margin assessment; HCLPF is one option among best-estimate or conservative quantifications","level":"plant and system performance"},"u":"https://www.iaea.org/publications/10914/safety-aspects-of-nuclear-power-plants-in-human-induced-external-events-margin-assessment","nt":""},{"id":"IAEA-SSG-68-5.161-hazard-input","s":"IAEA-SSG-68","doc":"SSG-68","j":"INT","loc":"SSG-68, para. 5.161","he":"Form of the site hazard evaluation result","hk":"부지 재해평가 결과의 표현 형식","t":["T03","T05","T07"],"ts":"summary","v":"primary_source","en":"The result of the site hazard evaluation, based on a screening procedure to identify the potential hazards associated with an aircraft crash, should be expressed either as specific parameters for the aircraft (type, mass, velocity, stiffness) or as load-time functions with associated impact areas. SSG-68 refers to NS-G-3.1 for the hazard evaluation itself.","ko":"항공기 추락 관련 잠재 재해를 식별하는 스크리닝 절차에 기반한 부지 재해평가 결과는 항공기별 파라미터(기종, 질량, 속도, 강성) 또는 관련 충돌면적을 수반한 하중-시간 함수 중 하나로 표현되어야 한다. SSG-68은 재해평가 자체에 대해서는 NS-G-3.1을 인용한다.","kp":{"output_form_a":"aircraft parameters: type, mass, velocity, stiffness","output_form_b":"load-time functions with associated impact areas","cross_reference":"NS-G-3.1 (SSG-68 reference [9])"},"u":"https://www-pub.iaea.org/MTCD/publications/PDF/PUB1968_web.pdf","nt":"NOTE ON DOCUMENT LINEAGE: SSG-68 (2021) cites NS-G-3.1 as a live reference, not as a superseded one. Treat any claim that SSG-79 supersedes NS-G-3.1 as unconfirmed."},{"id":"IAEA-SSG-68-5.163-effects","s":"IAEA-SSG-68","doc":"SSG-68","j":"INT","loc":"SSG-68, para. 5.163","he":"The five effects to be considered for a postulated aircraft crash","hk":"가정된 항공기 추락 시 고려해야 할 5가지 영향","t":["T08","T09","T10","T11","T12"],"ts":"summary","v":"primary_source","en":"The postulated aircraft crash is analysed to determine its effects on the installation and the steps needed to keep radiological consequences below acceptable limits. Five effects are to be considered: (a) localized structural damage from impact of extremely stiff parts of the aircraft (engine, landing gear), including penetration, spalling, scabbing and perforation (\"local effects\"); (b) global structural damage, including deformations or displacements that prevent the structure from performing its safety functions (\"global effects\"); (c) functional failure of SSCs due to induced vibrations in structural members and safety related equipment (\"vibration effects\"); (d) effects of crash-initiated fires and explosions on SSCs; (e) where relevant, effects on criticality safety of fuel or extinguishing water entering buildings, e.g. through the ventilation system.","ko":"가정된 항공기 추락은 시설에 미치는 영향과 방사선학적 결과를 허용한계 이하로 유지하기 위한 조치를 정하기 위해 해석한다. 고려 대상 5가지 영향: (a) 항공기의 극히 강성이 큰 부분(엔진, 착륙장치) 충돌에 의한 국부 구조손상 — 침투, 표면박리(spalling), 배면박리(scabbing), 관통 포함(\"국부영향\"); (b) 구조물이 안전기능을 수행하지 못하게 하는 과도 변형·변위를 포함한 전체 구조손상 (\"전체영향\"); (c) 구조부재 및 안전관련 기기의 유발진동에 의한 SSC 기능상실(\"진동영향\"); (d) 충돌로 개시된 화재·폭발이 SSC에 미치는 영향; (e) 해당되는 경우, 연료 또는 소화수가 환기계통 등을 통해 건물로 유입되어 임계안전에 미치는 영향.","kp":{"effects":["local","global","vibration","fire and explosion","fuel/extinguishing water ingress → criticality"]},"u":"https://www-pub.iaea.org/MTCD/publications/PDF/PUB1968_web.pdf","nt":"IAEA's list is broader than NEI 07-13's three-part set (physical / shock / fire): effect (e), criticality safety from fuel or extinguishing water ingress, has no counterpart in the NEI scope statement."},{"id":"IAEA-SSG-68-5.168-load-time","s":"IAEA-SSG-68","doc":"SSG-68","j":"INT","loc":"SSG-68, paras. 5.168-5.169","he":"Load-time function approach","hk":"하중-시간 함수 접근법","t":["T07"],"ts":"summary","v":"primary_source","en":"For impact analysis of stiff or massive structures, an equivalent load-time function from the perpendicular impact of a defined deformable missile on a rigid target should be derived analytically. Smoothing should filter spurious numerical noise, but physical high-frequency effects should not be excluded. Load-time functions can be used for a design basis external event, in which case the engineering design rules should comply with the relevant national or international codes and proven engineering practice.","ko":"강성이 크거나 질량이 큰 구조물의 충돌해석에는, 정의된 변형성 미사일이 강체 표적에 수직 충돌할 때의 등가 하중-시간 함수를 해석적으로 도출해야 한다. 수치적분에서 발생하는 허위 잡음은 평활화로 제거하되 물리적 고주파 성분은 배제하지 않아야 한다. 하중-시간 함수는 설계기준 외부사건에 사용할 수 있으며, 이 경우 공학적 설계규칙은 관련 국내·국제 기준 및 입증된 공학적 관행에 부합해야 한다.","kp":null,"u":"https://www-pub.iaea.org/MTCD/publications/PDF/PUB1968_web.pdf","nt":""},{"id":"IAEA-SSG-68-5.170-missile-target","s":"IAEA-SSG-68","doc":"SSG-68","j":"INT","loc":"SSG-68, paras. 5.170-5.176","he":"Missile-target interaction (coupled) analysis","hk":"미사일-표적 상호작용(연성) 해석","t":["T07","T08","T09"],"ts":"summary","v":"primary_source","en":"For impact on flexible structures the load may be heavily influenced by dynamic missile-target interaction, determined by a coupled analysis modelling the aircraft as a deformable missile with its type, mass, stiffness, velocity and impact angle. The type of aircraft, mass and velocity may be specified by the regulatory body. Stiff components such as engines and landing gear are included, with the impact load defined by the initial velocity of the missiles. The local area is modelled with enough concrete volume elements through the thickness and non-linear concrete behaviour (different in tension and compression, strain-rate and failure criteria), with reinforcing steel as beam elements connected to the concrete; the model must be able to assess concrete failure modes from spalling to perforation. Outside the local area the model may be simplified. Empirical/semi-empirical formulas derived for rigid missiles are an alternative for secondary missiles and debris, but their validity ranges usually do not coincide with aircraft impact, so engineering judgement on applicability is necessary.","ko":"유연 구조물 충돌에서는 미사일-표적 간 동적 상호작용이 하중에 크게 영향을 줄 수 있으며, 항공기를 기종·질량·강성·속도·충돌각을 갖는 변형성 미사일로 모델링한 연성해석으로 결정한다. 기종·질량·속도는 규제기관이 지정할 수 있다. 엔진·착륙장치 등 강성 부품을 포함하며 충돌하중은 미사일 초기속도로 정의된다. 국부영역은 두께방향으로 충분한 수의 콘크리트 체적요소와 비선형 재료거동(인장·압축 차이, 변형률속도, 파괴기준)으로 모델링하고 철근은 콘크리트에 연결된 보요소로 모델링하며, 표면박리부터 관통까지의 콘크리트 파괴모드를 평가할 수 있어야 한다. 국부영역 밖은 단순화할 수 있다. 강체 미사일용으로 도출된 경험식·반경험식은 2차 미사일·파편 평가의 대안이나, 적용 유효범위가 항공기 충돌과 일치하지 않으므로 적용성에 대한 공학적 판단이 필요하다.","kp":{"regulator_role":"type of aircraft, mass and velocity may be specified by the regulatory body","empirical_formula_caveat":"validity ranges of rigid-missile formulas usually do not coincide with aircraft impact"},"u":"https://www-pub.iaea.org/MTCD/publications/PDF/PUB1968_web.pdf","nt":"Para. 5.176 is the IAEA's explicit reservation about exactly the empirical formulas that NEI 07-13 adopts as its primary local-damage method. See crosswalk CW-08."},{"id":"IAEA-SSG-68-5.177-vibration","s":"IAEA-SSG-68","doc":"SSG-68","j":"INT","loc":"SSG-68, paras. 5.177-5.180","he":"Induced vibration effects","hk":"유발진동 영향","t":["T10"],"ts":"summary","v":"primary_source","en":"In-structure response spectra should be calculated for all main structural elements of buildings containing safety related items, with appropriate damping and an analysis time long enough to capture dominating post-impact vibrations. Spurious high-frequency noise should be filtered out before the induced vibration is used in component design. Passive mechanical structures can normally sustain high frequencies without damage, and some States apply a high-frequency cut-off in the in-structure response spectra — but only where structural layouts are well defined, high structural damping at high frequencies and structural discontinuities are accounted for, the calculated displacement is below the defined acceptability threshold, and the vibration is propagated over a distance in the structure.","ko":"안전관련 품목이 있는 건물의 모든 주요 구조부재에 대해 층응답스펙트럼을 산정해야 하며, 적절한 감쇠를 적용하고 충돌 후 지배적 진동이 포함되도록 충분히 긴 해석시간을 둔다. 기기 설계에 유발진동을 반영하기 전에 허위 고주파 잡음을 제거해야 한다. 수동 기계 구조물은 통상 고주파를 손상 없이 견디며 일부 국가는 층응답스펙트럼에 고주파 차단을 적용하나, 구조배치가 명확히 정의되고 고주파에서의 높은 구조감쇠와 구조 불연속을 고려하며 산정 변위가 허용기준 미만이고 진동이 구조물 내 일정 거리로 전파되는 경우에만 사용해야 한다.","kp":null,"u":"https://www-pub.iaea.org/MTCD/publications/PDF/PUB1968_web.pdf","nt":""},{"id":"IAEA-SSG-68-5.181-fire","s":"IAEA-SSG-68","doc":"SSG-68","j":"INT","loc":"SSG-68, para. 5.181","he":"Fire effects and the no-perforation rule for the outer wall","hk":"화재 영향 및 외벽 무관통 원칙","t":["T11","T12"],"ts":"summary","v":"primary_source","en":"\"The outer wall of the structure should be designed to resist an aircraft crash. Neither the aircraft nor parts of it should perforate the outer wall.\" The consequences of released fuel are assessed considering: (a) the fire load, directly related to the fuel carried by the reference aircraft at the target — the fuel loaded for the route from the starting airport to the destination minus consumption from take-off and cruising — plus other flammable materials from inside the aircraft (hand baggage, luggage, payload, plastic sheeting, seats, flammable materials in the aircraft structure) and flammable materials present at the site; (b) external fireballs; (c) pool fires; (d) entry of fuel into buildings important to safety through normal openings or as vapour/aerosol through air intake ducts, with subsequent fires; (e) entry of combustion products into distribution systems, affecting personnel or causing malfunctions such as electrical faults or emergency diesel generator failures.","ko":"\"구조물의 외벽은 항공기 추락에 저항하도록 설계되어야 한다. 항공기 또는 그 부품이 외벽을 관통해서는 안 된다.\" 방출 연료의 영향은 다음을 고려하여 평가한다: (a) 화재하중 — 표적 지점에서 기준 항공기가 적재한 연료량(출발공항에서 목적지까지의 노선에 급유된 양에서 이륙·순항 소모량을 뺀 값)에 직접 관련되며, 기내 가연물 (수하물, 화물, 플라스틱 시트, 좌석, 기체 구조 내 가연재)과 부지 내 가연물 포함; (b) 외부 화구(fireball); (c) 풀화재(pool fire); (d) 연료가 통상 개구부를 통해, 또는 증기·에어로졸 형태로 공기흡입 덕트를 통해 안전상 중요 건물로 유입되어 발생하는 후속 화재; (e) 연소생성물이 분배계통으로 유입되어 인원에 영향을 주거나 전기적 고장, 비상디젤발전기 고장 등 오작동을 유발하는 경우.","kp":{"fuel_definition":"route fuel from origin airport to destination, minus take-off and cruise consumption","fire_phenomena":["external fireball","pool fire","fuel ingress via openings and air intakes","combustion product ingress"]},"u":"https://www-pub.iaea.org/MTCD/publications/PDF/PUB1968_web.pdf","nt":"Contrast with 10 CFR 50.150(a)(2), which specifies \"aviation fuel loading typically used\" for long-distance US flights but withholds the number. SSG-68 instead gives a derivation rule (route fuel minus consumption) that an applicant can actually apply."},{"id":"IAEA-SSG-68-5.185-confinement","s":"IAEA-SSG-68","doc":"SSG-68","j":"INT","loc":"SSG-68, paras. 5.185, 5.190, 5.191","he":"Confinement structures, protective measures and load combination","hk":"격납구조물, 방호조치 및 하중조합","t":["T06","T09","T12"],"ts":"summary","v":"primary_source","en":"Structures performing a confinement function should be designed to withstand, without perforation, the impact of an accidental aircraft crash (5.185). Where local failure including scabbing could impair a safety function, measures are: improving structural resistance (thickness, reinforcement, earth cover for buried distribution systems, missile shields or other obstacles); locating redundant equipment in a separate area with adequate physical separation; or qualifying the affected items for short transient loads covering all critical failure modes of stability, integrity and functionality (5.190). For load combination it is not necessary to combine all design loads with the aircraft crash load — generally only loads present for a significant duration (dead loads, actual live loads, normal operating equipment loads) need be combined (5.191).","ko":"격납기능을 수행하는 구조물은 우발적 항공기 추락 충돌을 관통 없이 견디도록 설계되어야 한다(5.185). 배면박리를 포함한 국부파괴가 안전기능을 저해할 수 있는 경우의 조치는: 구조저항 향상(두께·철근 증대, 매설 분배계통의 복토 증대, 미사일 차폐 또는 기타 장애물 추가), 여유 기기를 충분한 이격거리를 둔 별도 구역에 배치(물리적 분리), 또는 영향 품목을 단시간 과도하중에 대해 검증(안정성·건전성·기능성의 모든 임계 파괴모드 포함)하는 것이다 (5.190). 하중조합에서는 모든 설계하중을 항공기 충돌하중과 조합할 필요가 없으며, 통상 상당 시간 존재하는 하중(고정하중, 실제 활하중, 기기 정상운전하중)만 조합하면 충분하다(5.191).","kp":null,"u":"https://www-pub.iaea.org/MTCD/publications/PDF/PUB1968_web.pdf","nt":""},{"id":"IAEA-SSG-68-5.192-bdb","s":"IAEA-SSG-68","doc":"SSG-68","j":"INT","loc":"SSG-68, para. 5.192","he":"Beyond design basis aircraft crash — acceptance criterion and method","hk":"설계기준초과 항공기 충돌 — 허용기준 및 방법","t":["T04","T07","T12","T13"],"ts":"summary","v":"primary_source","en":"\"If a beyond design basis aircraft crash involving fully fuelled commercial airplanes is considered, acceptance criteria should be chosen such that, at a minimum, items important to safety of the nuclear installation that are necessary to prevent large or early release remain functional.\" A coupled analysis should be performed for beyond design basis aircraft crashes; load-time functions can also be used. In both cases a best estimate approach can be used for the margin assessment.","ko":"\"완전 급유된 상용항공기가 관련된 설계기준초과 항공기 충돌을 고려하는 경우, 허용기준은 최소한 대량 또는 조기 방출을 방지하는 데 필요한 원자력시설의 안전상 중요 품목이 기능을 유지하도록 선정되어야 한다.\" 설계기준초과 항공기 충돌에 대해서는 연성해석을 수행해야 하며 하중-시간 함수도 사용할 수 있다. 두 경우 모두 여유도 평가에 최적추정(best estimate) 접근법을 사용할 수 있다.","kp":{"threat":"fully fuelled commercial airplanes","criterion":"items important to safety necessary to prevent large or early release remain functional","method":"coupled analysis; load-time functions also permitted","analysis_basis":"best estimate approach for margin assessment"},"u":"https://www-pub.iaea.org/MTCD/publications/PDF/PUB1968_web.pdf","nt":"THE DIRECT COUNTERPART TO 10 CFR 50.150. Both address a beyond-design-basis large commercial aircraft and both permit best-estimate/realistic analysis. They diverge on the criterion: SSG-68 uses the IAEA release-based objective (prevent large or early release), while 50.150(a)(1) uses four named plant functions in an OR/AND structure. See crosswalk CW-09."},{"id":"IAEA-SSG-68-fn9-spl","s":"IAEA-SSG-68","doc":"SSG-68","j":"INT","loc":"SSG-68, footnote 9 (to Section 3, para. 3.3)","he":"The 1E-7 per reactor-year screening probability level","hk":"원자로-년당 1E-7 스크리닝 확률수준","t":["T05"],"ts":"summary","v":"primary_source","en":"\"In some States, a value for the probability of 10^-7 per reactor-year is used in the design of new facilities as an acceptable limit on the probability value for interacting events that have serious radiological consequences. This is considered a conservative value for the screening probability level if applied to all events of the same type (e.g. all aircraft crashes, all explosions). Some initial events may have very low limits on their acceptable probability and need to be considered in isolation.\" SSG-68 attributes this to reference [9], NS-G-3.1. Where a screening probability level approach is used, the annual frequency of exceedance to be considered should be agreed before the site hazard evaluation.","ko":"\"일부 국가에서는 심각한 방사선학적 결과를 갖는 상호작용 사건의 확률에 대한 수용 가능한 한계값으로 신규 시설 설계 시 원자로-년당 10^-7 값을 사용한다. 이는 동일 유형의 모든 사건(예: 모든 항공기 추락, 모든 폭발)에 적용될 경우 스크리닝 확률수준으로서 보수적인 값으로 간주된다. 일부 초기사건은 수용 가능한 확률의 한계가 매우 낮아 개별적으로 고려할 필요가 있다.\" SSG-68은 이를 참고문헌 [9](NS-G-3.1)에 귀속시킨다. 스크리닝 확률수준 접근법을 사용하는 경우, 고려할 연간 초과빈도는 부지 재해평가 이전에 합의되어야 한다.","kp":{"spl_value":"1E-7 per reactor-year","status":"used in some States; not an IAEA-mandated value","application_rule":"conservative only if applied to all events of the same type collectively","attributed_to":"NS-G-3.1 (SSG-68 reference [9])","procedural_requirement":"the exceedance frequency must be agreed before the site hazard evaluation"},"u":"https://www-pub.iaea.org/MTCD/publications/PDF/PUB1968_web.pdf","nt":"CORRECTION OF AN EARLIER RECORD IN THIS DATABASE. The 1E-7 statement was initially attributed to SSG-79 on the basis of a search result. The text actually appears as footnote 9 of SSG-68, citing NS-G-3.1. See IAEA-SSG-79-spl, now superseded by this record."},{"id":"IAEA-SSG-68-scope","s":"IAEA-SSG-68","doc":"SSG-68","j":"INT","loc":"SSG-68, paras. 1.7, 1.12, 1.13 and footnotes 2-3","he":"Scope: design against external events including aircraft crash","hk":"적용범위: 항공기 추락을 포함한 외부사건 대비 설계","t":["T01","T02","T04"],"ts":"verbatim","v":"primary_source","en":"Para. 1.12: the Safety Guide applies to ALL TYPES OF NUCLEAR INSTALLATION — power plants, research reactors and adjoining radioisotope production facilities, spent fuel storage, enrichment, fuel fabrication, conversion, reprocessing, predisposal waste management and fuel-cycle R&D facilities. Para. 1.13: it applies to the DESIGN OF NEW installations AND the SAFETY EVALUATION OF EXISTING ones, for external events including human induced events, of which \"(i) Accidental aircraft crashes\" is the first listed, followed by explosions with or without fire and secondary missiles, releases of corrosive or hazardous gases or liquids, off-site radioactive releases, off-site or on-site fire, ship or debris collision with safety related structures such as water intakes or the ultimate heat sink, vehicle collision with SSCs, and electromagnetic interference. Para. 1.7: \"This Safety Guide supersedes IAEA Safety Standards Series No. NS-G-1.5, External Events Excluding Earthquakes in the Design of Nuclear Power Plants.\" Footnote 2 defines a design basis external event as \"an external event, or a combination of external events, that is considered in the design basis of all or any part of a facility\", adding that design basis external events \"are INDEPENDENT OF THE INSTALLATION LAYOUT\". Footnote 3 defines a beyond design basis external event as \"a level of external hazard exceeding those hazard levels considered for design, derived from the hazard evaluation for the site\", identified so the design incorporates features enhancing the installation's capability to withstand such events and so that design margins can be evaluated.","ko":"1.12항: 본 안전지침은 **모든 유형의 원자력시설**에 적용된다 — 원전, 연구로 및 부속 방사성동위원소 생산시설, 사용후핵연료 저장시설, 농축, 핵연료 제조, 변환, 재처리, 핵연료주기시설 방사성폐기물 처분전 관리, 핵연료주기 관련 연구개발시설. 1.13항: **신규 시설의 설계**와 **기존 시설의 안전평가** 모두에 적용되며, 인위적 외부사건 중 \"(i) 우발적 항공기 추락\"이 첫 번째로 열거되고, 이어 화재·2차 미사일을 수반하거나 수반하지 않는 폭발, 부식성·유해 기체·액체의 방출, 부지 외부 방사성물질 방출, 부지 내외 화재, 취수구나 최종열침원 관련 구조물 등 안전관련 구조물에 대한 선박·부유물 충돌, 차량의 SSC 충돌, 전자기 간섭이 뒤따른다. 1.7항: \"본 안전지침은 IAEA 안전기준 시리즈 NS-G-1.5 「원전 설계에서 지진을 제외한 외부사건」을 대체한다.\" 각주 2는 설계기준 외부사건을 \"시설의 전부 또는 일부의 설계기준에서 고려되는 외부사건 또는 외부사건의 조합\"으로 정의하며, 설계기준 외부사건은 **시설 배치와 독립적**이라고 부기한다. 각주 3은 설계기준초과 외부사건을 \"부지 재해평가로부터 도출된, 설계에서 고려한 재해수준을 초과하는 외부재해 수준\"으로 정의하고, 그러한 사건을 식별하는 목적은 시설이 이를 견딜 능력을 향상시키는 설계특성을 반영하고 설계 여유도를 평가하기 위함이라고 한다.","kp":{"applies_to":"all types of nuclear installation; new design AND safety evaluation of existing","aircraft_position":"accidental aircraft crash is the first listed human induced event (1.13(a)(i))","dbee_definition":"external event or combination considered in the design basis; INDEPENDENT of installation layout","bdbee_definition":"hazard level exceeding those considered for design, derived from the site hazard evaluation","supersedes":"NS-G-1.5 (2003)"},"u":"https://www.iaea.org/publications/14666/design-of-nuclear-installations-against-external-events-excluding-earthquakes","nt":"Structural note for the comparison: SSG-68 is the only document in this corpus that covers BOTH the design-basis and the beyond-design-basis level for aircraft crash in one public, freely available text. It is therefore the natural bridge between the Czech/EUR design-basis approach and the US beyond-design-basis approach. Footnote 2 adds a point no other document in this corpus makes: design basis external events are INDEPENDENT OF THE INSTALLATION LAYOUT. That is the conceptual separation EUR implements structurally with its standard-design layer (a fixed aircraft load function for every EUR plant) and that the Czech decrees deliberately do not adopt, deriving everything from the site through § 11."},{"id":"IAEA-SSG-79-spl","s":"IAEA-SSG-79","doc":"SSG-79","j":"INT","loc":"SSG-79, screening probability level (footnote) and the aircraft crash screening steps","he":"Screening probability level and its application to aircraft crash","hk":"스크리닝 확률수준과 항공기 추락에의 적용","t":["T05","T02"],"ts":"summary","v":"primary_source","en":"SSG-79 defines the screening probability level (SPL) as \"the limiting value of the annual probability of occurrence of events with potential radiological consequences\", and states that if the probability of occurrence is less than the specified SPL, no further analysis is necessary for that source. The SPL \"should be chosen such that the radiation risk associated with hazards is acceptably low\"; if the probability exceeds it, a detailed evaluation should be performed. On the value: \"In some States, a probability of 10^-7 per reactor-year is used in the design of new facilities as one acceptable limit on the probability value for interacting events with serious radiological consequences, and this is considered a conservative value for the screening probability level if applied to all events of the same type.\" Applied to aircraft: the probability of crashing is determined per aircraft category (general aviation, medium and large commercial aircraft, military aircraft) and compared with the SPL; \"those aircraft crashes for which the probability of occurrence is less than the screening probability level can be screened out.\"","ko":"SSG-79는 스크리닝 확률수준(SPL)을 \"방사선학적 결과를 초래할 수 있는 사건의 연간 발생확률의 한계값\"으로 정의하고, 발생확률이 지정된 SPL 미만이면 해당 요인에 대해 추가 해석이 불필요하다고 규정한다. SPL은 \"재해와 관련된 방사선 위험이 수용 가능하게 낮도록\" 선정되어야 하며, 확률이 이를 초과하면 상세평가를 수행해야 한다. 값에 관하여: \"일부 국가에서는 심각한 방사선학적 결과를 갖는 상호작용 사건의 확률에 대한 하나의 수용 가능한 한계값으로 신규 시설 설계 시 원자로-년당 10^-7을 사용하며, 이는 동일 유형의 모든 사건에 적용될 경우 스크리닝 확률수준으로서 보수적인 값으로 간주된다.\" 항공기 적용: 추락확률을 항공기 범주별(일반항공, 중형·대형 상용항공기, 군용항공기)로 산정하여 SPL과 비교하며, \"발생확률이 스크리닝 확률수준보다 낮은 항공기 추락은 배제할 수 있다.\"","kp":{"spl_definition":"limiting value of the annual probability of occurrence of events with potential radiological consequences","spl_value":"1E-7 per reactor-year, used in some States","application_rule":"conservative only if applied to all events of the same type collectively","aircraft_categories":["general aviation","medium and large commercial aircraft","military aircraft"],"supersedes":"NS-G-3.1, External Human Induced Events in Site Evaluation for Nuclear Power Plants (2002)"},"u":"https://www-pub.iaea.org/MTCD/Publications/PDF/PUB2036_web.pdf","nt":"DOUBLE CORRECTION — this record was right, then wrongly \"corrected\", and is now restored from the primary text. Sequence: (1) the first build attributed the 1E-7 SPL to SSG-79 from a search result; (2) on finding the same statement as footnote 9 of SSG-68, this database demoted the SSG-79 record to to_verify and called the attribution an error; (3) the SSG-79 text itself shows the statement IS in SSG-79, in almost identical wording, and that SSG-79 supersedes NS-G-3.1. Both documents carry it. SSG-68 cites NS-G-3.1 as its source because SSG-68 was published first; that is chronology, not a contradiction. SSG-79 adds what SSG-68 does not: the per-aircraft-category screening procedure. This is the strongest quantitative link to the Czech § 11(4)(b) 1E-7/yr level."},{"id":"IAEA-SSR-2-1-req17","s":"IAEA-SSR-2-1","doc":"SSR-2/1 (Rev. 1)","j":"INT","loc":"SSR-2/1 (Rev. 1), Requirement 17 and paras. 5.15A, 5.15B, 5.17, 5.19","he":"Internal and external hazards — the top-level design requirement","hk":"내·외부 재해 — 최상위 설계요건","t":["T01","T02","T04","T06"],"ts":"verbatim","v":"primary_source","en":"\"Requirement 17: Internal and external hazards. All foreseeable internal hazards and external hazards, including the potential for human induced events directly or indirectly to affect the safety of the nuclear power plant, shall be identified and their effects shall be evaluated. Hazards shall be considered in designing the layout of the plant and in determining the postulated initiating events and generated loadings for use in the design of relevant items important to safety for the plant.\" 5.15A: \"Items important to safety shall be designed and located, with due consideration of other implications for safety, to withstand the effects of hazards or to be protected, in accordance with their importance to safety, against hazards and against common cause failure mechanisms generated by hazards.\" 5.15B: \"For multiple unit plant sites, the design shall take due account of the potential for specific hazards to give rise to impacts on several or even all units on the site simultaneously.\" 5.17: the design shall include due consideration of natural and human induced external events identified in the SITE EVALUATION PROCESS; causation and likelihood shall be considered in postulating potential hazards. 5.19: features shall be provided to minimize interactions between buildings containing items important to safety, INCLUDING POWER CABLING AND CONTROL CABLING, and any other plant structure as a result of external events.","ko":"\"요건 17: 내부 및 외부 재해. 원전의 안전에 직접 또는 간접적으로 영향을 미칠 수 있는 인위적 사건의 가능성을 포함하여, 예측 가능한 모든 내부 재해와 외부 재해를 식별하고 그 영향을 평가해야 한다. 재해는 발전소 배치 설계 시, 그리고 안전에 중요한 관련 품목의 설계에 사용할 가정 기인사건과 발생 하중을 정할 때 고려되어야 한다.\" 5.15A: \"안전에 중요한 품목은 안전에 대한 다른 함의를 적절히 고려하여, 재해의 영향을 견디거나 그 안전 중요도에 따라 재해 및 재해로 유발되는 공통원인고장 메커니즘으로부터 방호되도록 설계·배치되어야 한다.\" 5.15B: \"다수호기 부지의 경우, 특정 재해가 부지 내 여러 호기 또는 전 호기에 동시에 영향을 미칠 가능성을 설계에서 적절히 고려해야 한다.\" 5.17: 설계는 **부지평가 과정**에서 식별된 자연적·인위적 외부사건을 적절히 고려해야 하며, 잠재 재해를 가정할 때 인과관계와 발생가능성을 고려해야 한다. 5.19: 외부사건의 결과로 안전에 중요한 품목을 수용한 건물(**전력·제어 케이블 포함**)과 다른 발전소 구조물 간의 상호작용을 최소화하는 설비를 갖추어야 한다.","kp":{"requirement_scope":"all foreseeable internal AND external hazards, incl. human induced events","two_design_uses":["plant layout design","postulated initiating events and generated loadings"],"common_cause":"protection against common cause failure mechanisms generated by hazards (5.15A)","multi_unit":"simultaneous impact on several or all units on the site (5.15B)","site_link":"external events identified in the site evaluation process (5.17)","cabling":"power and control cabling explicitly named (5.19)"},"u":"https://www.iaea.org/publications/10646/safety-of-nuclear-power-plants-design","nt":"UPGRADED FROM model_knowledge. Two elements the earlier summary did not carry, both material to this comparison. First, 5.15B requires multi-unit sites to consider a hazard hitting several or all units SIMULTANEOUSLY — no other document in this corpus states that for aircraft crash, and it matters because an aircraft impact is exactly the kind of hazard that can cross unit boundaries on a shared site. Second, 5.19 names POWER AND CONTROL CABLING among the interactions to be minimised, which is the same support-scope point NEI 07-13 makes when it judges survivability on power supplies and cable runs rather than on components alone (US-NEI-07-13-safety-function-assessment). Requirement 17 also fixes the two design uses of a hazard — plant LAYOUT and the derivation of postulated initiating events and LOADINGS — which is the hook SSG-68 paras. 5.161-5.192 elaborate for aircraft crash."},{"id":"US-10CFR50.150-a-1","s":"US-10CFR50.150","doc":"10 CFR 50.150","j":"US","loc":"10 CFR 50.150(a)(1)","he":"Assessment requirement and acceptance criteria","hk":"평가 의무 및 허용기준","t":["T01","T02","T12","T15"],"ts":"verbatim","v":"primary_source","en":"\"(1) Assessment. Each applicant listed in paragraph (a)(3) shall perform a design-specific assessment of the effects on the facility of the impact of a large, commercial aircraft. Using realistic analyses, the applicant shall identify and incorporate into the design those design features and functional capabilities to show that, with reduced use of operator actions: (i) The reactor core remains cooled, or the containment remains intact; and (ii) spent fuel cooling or spent fuel pool integrity is maintained.\"","ko":"\"(1) 평가. (a)(3)에 열거된 각 신청자는 대형 상용항공기 충돌이 시설에 미치는 영향에 대한 설계특정 평가를 수행해야 한다. 현실적 해석을 사용하여, 신청자는 운전원 조치 의존을 줄인 상태에서 (i) 노심냉각이 유지되거나 격납건물 건전성이 유지되고, (ii) 사용후핵연료 냉각 또는 사용후핵연료저장조 건전성이 유지됨을 보이는 설계특성 및 기능적 능력을 도출하여 설계에 반영해야 한다.\"","kp":{"analysis_type":"realistic analyses","criteria_logic":"(core cooling OR containment intact) AND (SFP cooling OR SFP integrity)","operator_action":"with reduced use of operator actions"},"u":"https://www.ecfr.gov/current/title-10/chapter-I/part-50/section-50.150","nt":"Confirmed verbatim; the earlier summary of this paragraph was accurate."},{"id":"US-10CFR50.150-a-2","s":"US-10CFR50.150","doc":"10 CFR 50.150","j":"US","loc":"10 CFR 50.150(a)(2) and its footnote 1","he":"Aircraft impact characteristics","hk":"항공기 충돌 특성","t":["T03","T04","T13","T14"],"ts":"verbatim","v":"primary_source","en":"\"(2) Aircraft impact characteristics. T
