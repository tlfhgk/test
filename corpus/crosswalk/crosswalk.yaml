# ---------------------------------------------------------------------------
# Crosswalk: each entry poses one comparison question, states the position of
# each framework, and links to the clause records that support it.
#
# The BASELINE for every entry is the US methodology (NEI 07-13 as endorsed by
# RG 1.217 under 10 CFR 50.150), because that is the benchmark the user asked
# the other frameworks to be compared against.
#
# relation values (relative to the NEI 07-13 / US baseline):
#   equivalent            - same substantive position
#   partial               - overlaps but narrower or less specific
#   different-architecture- addresses the same subject through a different
#                           regulatory construct; not directly comparable
#   stricter / looser     - same subject, demonstrably different threshold
#   no-equivalent         - the framework has nothing on this point
#   not-public            - the framework addresses it but the content is withheld
# ---------------------------------------------------------------------------
schema_version: 1
baseline: US-NEI-07-13
crosswalk:

  - cw_id: CW-01
    topic_id: T01
    question_en: "What kind of instrument carries the aircraft impact requirement, and is it binding?"
    question_ko: "항공기 충돌 요건은 어떤 형식의 문서가 담고 있으며 구속력이 있는가?"
    summary_ko: >-
      미국은 구속력 있는 연방규정(10 CFR 50.150)이 '평가 의무'만 규정하고, 기술적 방법론은
      비구속 규제지침(RG 1.217)이 승인한 산업계 문서(NEI 07-13)에 있다. 체코는 반대로,
      구속력 있는 시행령(329/2017 Sb.)이 설계기준 자체를 직접 규정하되 상세 해석방법은
      규정하지 않는다. EUR은 법령이 아닌 계약문서이고, IAEA·WENRA는 비구속 권고이다.
    positions:
      - source_id: US-10CFR50.150
        relation: baseline
        note: "Binding rule; states the duty and the acceptance criteria, contains no methodology."
      - source_id: US-RG-1.217
        relation: baseline
        note: "Non-binding guide; supplies the method by endorsing NEI 07-13 Rev. 8."
      - source_id: CZ-329-2017
        relation: different-architecture
        note: "Binding decree that itself fixes the design-basis selection rule; method left to the applicant."
      - source_id: CZ-263-2016
        relation: different-architecture
        note: "The Act itself defines design bases to span internal AND EXTERNAL threats and events (§ 2), and § 46(2)(e) obliges the design to ensure resistance against dangers from site properties and external influences. § 236 delegates the detail to SÚJB decrees."
      - source_id: EU-EUR
        relation: different-architecture
        note: "Contractual utility requirement; binds only via the procurement contract."
      - source_id: IAEA-SSG-68
        relation: partial
        note: "Non-binding recommendations; becomes binding only through national adoption."
      - source_id: EU-WENRA-SRL
        relation: partial
        note: "Harmonisation reference implemented through member regulators."
    clause_ids: [US-10CFR50.150-a-1, US-RG-1.217-position, CZ-263-2016-design-basis-definition, CZ-263-2016-s46-design-duty, CZ-263-2016-enabling, EU-EUR-scope, IAEA-SSG-68-scope, EU-WENRA-TU1-objective]

  - cw_id: CW-02
    topic_id: T02
    question_en: "Which plants are covered — new build only, or the existing fleet as well?"
    question_ko: "적용 대상이 신규 원전에 한정되는가, 기존 원전도 포함하는가?"
    summary_ko: >-
      미국 규정은 신규 원전 신청자에게만 적용되는 장래효 규정이다. 체코 시행령은 원자로
      열출력 50 MW 초과 시설이라는 출력 기준으로 적용범위를 정한다. IAEA SRS 86/87/88은
      기존 원전과 신규 원전 모두를 대상으로 방법론을 기술한다.
    positions:
      - source_id: US-10CFR50.150
        relation: baseline
        note: "New reactor applicants only (DC, SDA, COL, ML, CP, OL); existing fleet excluded."
      - source_id: CZ-329-2017
        relation: different-architecture
        note: "Applicability keyed to reactor thermal power > 50 MW, not to licensing vintage."
      - source_id: IAEA-SRS-86
        relation: partial
        note: "Explicitly addresses application to both existing and new plants."
      - source_id: CZ-378-2016
        relation: different-architecture
        note: "Siting decree in force 1 Jan 2017 applies at the siting stage for every nuclear installation, with the aircraft fall the first-listed human-induced phenomenon (§ 3(1)(b)(1)); § 20(b)(8) hands the resulting design requirements to the design decree."
      - source_id: EU-2014-87-EURATOM
        relation: different-architecture
        note: "Art. 8a(2)(a) applies the safety objective to installations first licensed for construction after 14 August 2014; 8a(2)(b) makes it a reference for improving existing ones."
    clause_ids: [US-10CFR50.150-a-3, CZ-329-2017-aircraft-dbe, CZ-378-2016-scope, EU-2014-87-framework, IAEA-SRS-86-framework]

  - cw_id: CW-03
    topic_id: T03
    question_en: "How is the aircraft threat defined, and are the numbers public?"
    question_ko: "항공기 위협은 어떻게 정의되며, 수치는 공개되는가?"
    summary_ko: >-
      가장 큰 실무적 차이. 미국은 '미국 내 장거리 운항 대형 상용항공기'라는 정성적 정의만
      공개하고, 질량·속도·연료량 등 구체적 수치는 보안정보로 비공개한다. 체코는 위협을
      수치로 지정하지 않고 '빈도 1E-7/년 초과 물체의 영향 강도'라는 확률기준으로 도출하게
      한다. EUR은 복수의 위협 시나리오를 명시하나 문서가 유료·비공개다. 따라서 세 체계의
      위협 파라미터를 직접 수치 비교하는 것은 공개자료만으로는 불가능하다.
    positions:
      - source_id: US-10CFR50.150
        relation: baseline
        note: "Qualitative definition public; impact speed/angle/mass/fuel supplied by NRC as security-related information."
      - source_id: CZ-329-2017
        relation: different-architecture
        note: "No prescribed aircraft; the threat is whatever object exceeds the 1E-7/yr fall frequency at the site."
      - source_id: EU-EUR
        relation: different-architecture
        note: "STRUCTURE now known from the public ToC, VALUES still licensed. The ACCIDENTAL design case is a Light Aircraft load function (Ch. 2.4 §1.3.3.1.1) and a Military Aircraft load function (§1.3.3.1.2) — not a large commercial aircraft. The large-aircraft threat is carried by the INTENTIONAL case (§1.3.3.2), which Ch. 2.1 files under §8.3 Security."
      - source_id: IAEA-SSG-68
        relation: partial
        note: "Recommends how to characterise the hazard; does not prescribe a threat aircraft."
    clause_ids: [US-10CFR50.150-a-2, US-NEI-07-13-riera, CZ-329-2017-aircraft-dbe, EU-EUR-aircraft-structure, IAEA-SSG-68-5.161-hazard-input, IAEA-SSG-68-5.181-fire]
    divergence_note: >-
      CRITICAL for any benchmarking exercise: a numeric comparison of threat parameters
      between the US, Czech and EUR frameworks cannot be performed from public sources.
      Comparison is only meaningful at the level of method and acceptance logic.
      REVISED after reading the EUR chapter tables of contents. The three frameworks are not
      three treatments of one event. EUR's ACCIDENTAL case is a light aircraft and a military
      aircraft; the US case is a large commercial aircraft; the Czech case is any falling
      object above 1E-7/yr, aircraft or not. EUR reaches the large aircraft only through its
      INTENTIONAL case, filed under Security. So "aircraft crash" names a different physical
      event in each framework before any question of design basis or acceptance criteria
      arises — which is a stronger caution than this database previously carried.

  - cw_id: CW-04
    topic_id: T04
    question_en: "Is the large aircraft impact a design-basis event or a beyond-design-basis event?"
    question_ko: "대형 항공기 충돌은 설계기준사건인가, 설계기준초과사건인가?"
    summary_ko: >-
      미국은 명시적으로 설계기준초과(BDB)로 두고, 보수적 설계기준 해석이 아닌 현실적
      (realistic) 해석을 요구한다. 체코는 우발적 항공기 추락을 설계기준 안에 두고, 빈도
      기준을 넘으면 설계기준 외부 기인사건으로 편입한다. EUR과 최근 IAEA 문서는 DBEE와
      BDBEE(DEC) 두 수준을 모두 정의하는 다단계 구조를 취한다. 즉 세 체계는 같은 사건을
      서로 다른 규제 계층에 배치하고 있으며, 이것이 요건 대 요건 매핑이 성립하지 않는
      근본 원인이다.
    positions:
      - source_id: US-10CFR50.150
        relation: baseline
        note: "Explicitly beyond design basis; realistic (best-estimate) analysis, not design-basis conservatism."
      - source_id: CZ-329-2017
        relation: different-architecture
        note: "Accidental crash sits INSIDE the design basis once the frequency criterion is met."
      - source_id: EU-EUR
        relation: different-architecture
        note: "Ch. 2.1 §2 runs Design Basis Accidents → Design Extension Conditions (Complex Sequences, Severe Accidents) → Practical elimination, and §2.6 splits hazard identification into STANDARD DESIGN and SITE-SPECIFIC. The accidental aircraft crash sits in the standard-design layer, so every EUR plant carries the same fixed load function regardless of site."
      - source_id: IAEA-SSG-68
        relation: equivalent
        note: "Covers both levels explicitly: para. 5.185 requires no perforation for an ACCIDENTAL crash (design basis), while para. 5.192 handles a BEYOND design basis crash by fully fuelled commercial airplanes with a best-estimate margin assessment. The closest structural match to the US posture, plus a design-basis layer the US rule lacks."
      - source_id: US-RG-1.217
        relation: baseline
        note: "States the consequence of the BDB determination: NRC requirements for design-basis events do NOT apply to design features or functional capabilities selected solely to meet the aircraft impact rule."
      - source_id: EU-2014-87-EURATOM
        relation: different-architecture
        note: "Art. 3 supplies the shared vocabulary: 'design basis' is the range of conditions and events taken explicitly into account so the installation withstands them within authorised limits by planned operation of safety systems; 'severe conditions' are more severe than design basis accidents. Art. 8b(1) requires both (d) design basis accidents and (e) severe conditions to be controlled."
      - source_id: CZ-263-2016
        relation: different-architecture
        note: "§ 2 defines design bases to span internal AND external threats and events — the statutory reason the Czech accidental crash sits inside the design basis."
      - source_id: EU-WENRA-SRL
        relation: different-architecture
        note: "TU4.2: design basis events at an exceedance frequency not higher than 1E-4/yr; a 0.1 g seismic floor regardless of frequency; and for accidental airplane crashes a design basis event SHALL be defined to ensure minimum protection. TU1.1 covers both design basis and design extension conditions; footnote 88 excludes malicious acts."
      - source_id: IAEA-SRS-88
        relation: partial
        note: "Supplies the margin-assessment layer that the BDB level needs."
    clause_ids: [US-10CFR50.150-a-1, US-10CFR50.150-a-2, US-RG-1.217-bdb-consequence, CZ-329-2017-aircraft-dbe, CZ-329-2017-conservative-approach, EU-EUR-aircraft-structure, IAEA-SSG-68-scope, IAEA-SSG-68-5.192-bdb, IAEA-SSG-68-5.185-confinement, EU-WENRA-TU4-design-basis, EU-WENRA-TU1-objective, IAEA-SRS-88-margins]
    divergence_note: >-
      This is the single largest divergence in the corpus, and both sides are now confirmed
      from primary text. 10 CFR 50.150(a)(1) requires "realistic analyses" and RG 1.217
      Section B states that design-basis requirements for design, construction, testing,
      operation and maintenance do NOT attach to features selected solely for the aircraft
      rule. Decree 329/2017 § 12(1) requires basic external design events — which include the
      accidental aircraft fall under § 11(4)(b) — to be treated with a CONSERVATIVE APPROACH.
      So the same physical event is analysed best-estimate in the US and conservatively in
      Czechia, and only the Czech result carries design-basis obligations.
      A NEW AND OVERRIDING CONSIDERATION: 10 CFR 50.150(d), added in April 2026, sunsets the
      entire US rule on 8 April 2027 unless the NRC extends it. The US side of this
      comparison has an expiry date; the Czech and IAEA sides do not.
      WHY THE CZECH SIDE LOOKS AS IT DOES: WENRA reference level TU4.2 requires a 1E-4/yr
      design basis exceedance frequency, a 0.1 g seismic floor regardless of frequency, and a
      defined design basis event for accidental airplane crashes to ensure minimum protection.
      Decree 329/2017 § 11(3), § 11(4)(a) and § 11(4)(b) reproduce that three-part structure
      almost literally. The Czech placement of the crash inside the design basis is therefore
      not a national idiosyncrasy but a transposition of the European harmonised expectation.

  - cw_id: CW-05
    topic_id: T05
    question_en: "Is there an explicit probabilistic screening criterion for including aircraft crash?"
    question_ko: "항공기 추락 포함 여부를 정하는 명시적 확률 스크리닝 기준이 있는가?"
    summary_ko: >-
      체코와 IAEA는 사실상 동일한 기준을 쓴다. 체코 시행령의 '1천만 년에 1회 초과'는
      IAEA의 스크리닝 확률수준(SPL) 1E-7/원자로-년과 같은 값이다. 반면 미국 10 CFR 50.150은
      확률 스크리닝을 두지 않는다 — 대형 상용항공기 충돌은 빈도와 무관하게 규정에 의해
      직접 지정된 결정론적 시나리오이다.
    positions:
      - source_id: US-10CFR50.150
        relation: baseline
        note: "NO screening criterion. The threat is prescribed by rule, not selected by frequency."
      - source_id: CZ-329-2017
        relation: different-architecture
        note: "TWO levels. § 11(3): basic external design events generally = intensity of the territorial property with occurrence frequency 1E-4/yr (once per 10,000 years) or lower. § 11(4)(b): fall of an aircraft OR OTHER OBJECT = intensity of the effects of an object whose fall frequency onto an area where it could cause a basic external initiating event is > 1E-7/yr. § 11(4)(a) pairs it with a 0.1 g seismic floor for the same SSC set."
      - source_id: IAEA-SSG-79
        relation: different-architecture
        note: "SPL = limiting annual probability of events with potential radiological consequences. 1E-7 per reactor-year used in some States; conservative only if applied to all events of the same type. Aircraft screened per category (general aviation / medium and large commercial / military). Supersedes NS-G-3.1."
      - source_id: IAEA-SSG-68
        relation: different-architecture
        note: "Footnote 9 restates the same 1E-7 statement, citing NS-G-3.1."
      - source_id: EU-WENRA-SRL
        relation: different-architecture
        note: "TU4.2 sets 1E-4/yr for design basis events generally but does NOT state a figure for aircraft: it requires that a design basis event simply BE DEFINED to ensure minimum protection. The 1E-7 number is the Czech and IAEA contribution, not WENRA's."
      - source_id: CZ-378-2016
        relation: different-architecture
        note: "§ 13 asks the siting assessment to determine the PROBABILITY of a fall whose consequences would exceed the resistance ASSUMED BY THE DESIGN — a consequence-conditioned probability, not a raw crash frequency."
    clause_ids: [US-10CFR50.150-a-2, CZ-329-2017-aircraft-dbe, CZ-329-2017-external-events-general, CZ-378-2016-s13-aircraft, IAEA-SSG-79-spl, IAEA-SSG-68-fn9-spl, EU-WENRA-TU4-design-basis, EU-WENRA-TU3-screening]
    divergence_note: >-
      Strongest quantitative link in the crosswalk: CZ 329/2017 and the IAEA level are the
      same 1E-7/yr figure. Three caveats now verified against the primary text of SSG-68:
      (1) the IAEA presents it as what "some States" use, NOT as an IAEA-mandated value;
      (2) it is conservative only when applied to ALL events of one type collectively —
      applying 1E-7 to a single crash scenario is a different and less conservative reading;
      (3) SSG-68 adds a procedural requirement absent from the Czech decree: where an SPL
      approach is used, the annual exceedance frequency must be AGREED BEFORE the site
      hazard evaluation.
      Attribution, now settled against both primary texts: the 1E-7 statement appears in BOTH
      SSG-79 and SSG-68 (footnote 9) in almost identical wording, and SSG-79 supersedes
      NS-G-3.1. An intermediate version of this database wrongly declared the SSG-79
      attribution an error; it was not. SSG-79 alone carries the per-aircraft-category
      screening procedure.
      THE CZECH SCHEME IS A LOOP, NOT A THRESHOLD. Siting decree 378/2016 § 13 asks for the
      probability of a fall whose consequences would EXCEED THE RESISTANCE THE DESIGN ASSUMES,
      while design decree 329/2017 § 11(4)(b) sets that resistance from objects falling more
      often than 1E-7/yr. Each decree takes the other's output as its input, so the pair must
      be iterated — precisely the feedback process between site hazard evaluation and
      installation design that SSG-68 para. 3.4 recommends. Neither the US nor the EUR
      framework couples siting and design this explicitly.
      Second point, from the Czech primary text: the decree operates TWO
      frequency levels, not one — 1E-4/yr for basic external design events generally (§ 11(3))
      and 1E-7/yr for a falling aircraft or other object (§ 11(4)(b)). The earlier version of
      this crosswalk compared the IAEA level against the Czech 1E-7 figure alone and so
      presented the Czech scheme as a single-threshold system. The three-orders-of-magnitude
      gap between § 11(3) and § 11(4)(b) is itself the finding: the Czech regulator treats a
      falling aircraft as far rarer than the events it otherwise designs for, which is what
      lets the crash stay inside the design basis without driving the whole design.

  - cw_id: CW-06
    topic_id: T06
    question_en: "Which structures and components must be assessed?"
    question_ko: "어떤 구조물과 기기를 평가해야 하는가?"
    summary_ko: >-
      NEI 07-13은 대상을 명확히 한정한다: 핵연료를 포함한 구조물(격납건물, 사용후핵연료
      저장조)과 붕괴열 제거 기기를 수용한 구조물, 그리고 그 기능을 지원하는 전원·케이블
      경로까지. 체코·IAEA는 '안전에 중요한 SSC'라는 일반적 범주를 쓰므로 범위가 더 넓지만
      덜 구체적이다.
    positions:
      - source_id: US-NEI-07-13
        relation: baseline
        note: "Containment, SFP, structures housing heat-removal equipment; plus power supplies, cable runs and supporting components."
      - source_id: CZ-329-2017
        relation: equivalent
        note: "§ 13 scopes the aircraft provision to selected SSCs with influence on nuclear safety NECESSARY FOR MANAGING EMERGENCY CONDITIONS AND RADIATION EMERGENCIES — a narrowing structurally close to the US 'key design features and functional capabilities', not a blanket safety-SSC requirement."
      - source_id: IAEA-SSG-68
        relation: partial
        note: "Protection of SSCs important to safety, based on site hazard evaluation and installation layout."
      - source_id: EU-WENRA-SRL
        relation: partial
        note: "TU2.2 fixes a minimum mandatory hazard list that includes accidental aircraft crash; TU1.1 extends the safety demonstration to spent fuel storage."
    clause_ids: [US-NEI-07-13-scope, US-NEI-07-13-sufficiency, CZ-329-2017-external-events-general, IAEA-SSG-68-scope, IAEA-SSG-68-5.185-confinement]

  - cw_id: CW-07
    topic_id: T07
    question_en: "How is the impact load defined and is a specific method mandated?"
    question_ko: "충돌하중은 어떻게 정의되며 특정 방법이 강제되는가?"
    summary_ko: >-
      NEI 07-13은 국부하중과 전체하중의 산정, 재료 특성화, 파괴기준을 하나의 방법론으로
      묶어 제공하며 RG 1.217이 이를 승인한다. IAEA SRS 87이 이에 대응하는 문서이나
      권고가 아닌 정보성 안전보고서이다. 체코 시행령과 EU 지침은 하중 산정 방법을 규정하지
      않는다 — 방법 선택은 신청자와 규제기관 협의에 맡겨진다.
    positions:
      - source_id: US-NEI-07-13
        relation: baseline
        note: "Integrated method: local + global loading, material characterisation, failure criteria; endorsed by RG 1.217."
      - source_id: IAEA-SRS-87
        relation: equivalent
        note: "Also derives the soft-missile loading function by the Riera method (§2.2.2) — but a Safety Report, informative only."
      - source_id: IAEA-SSG-68
        relation: equivalent
        note: "Paras. 5.168-5.176: load-time function for stiff/massive targets, coupled missile-target interaction for flexible targets; the regulatory body may specify aircraft type, mass and velocity."
      - source_id: CZ-329-2017
        relation: no-equivalent
        note: "Decree sets the design basis, not the analysis method."
      - source_id: EU-2014-87-EURATOM
        relation: no-equivalent
        note: "Directive prescribes no load or method."
    clause_ids: [US-NEI-07-13-riera, US-RG-1.217-position, IAEA-SRS-87-structures, IAEA-SSG-68-5.168-load-time, IAEA-SSG-68-5.170-missile-target, CZ-329-2017-aircraft-dbe, EU-2014-87-framework]
    divergence_note: >-
      VERIFIED AGAINST BOTH PRIMARY TEXTS. NEI 07-13 and IAEA converge on method: both use a
      Riera-type force-time history and both provide a coupled missile-target interaction
      route for flexible targets. They diverge on WHO SUPPLIES THE NUMBERS. NEI 07-13 states
      that the rule "does not define a unique model of the aircraft nor its initial impact
      velocity" and that the Riera function is "provided to the vendors" — outside the public
      document. SSG-68 para. 5.170 instead says the aircraft type, mass and velocity "may be
      specified by the regulatory body", and para. 5.161 lets the site hazard evaluation
      express the result either as aircraft parameters or as load-time functions.

  - cw_id: CW-08
    topic_id: T08
    question_en: "How is local damage — penetration, scabbing, perforation — evaluated?"
    question_ko: "국부손상(침투·배면박리·관통)은 어떻게 평가하는가?"
    summary_ko: >-
      **원문 대조로 확정된 항목.** 두 문서는 같은 경험식 계열을 쓰지만 규범적 성격이 다르다.
      NEI 07-13은 §2.1.2에서 사용할 식을 **특정한다**: 침투는 Modified NDRC, 배면박리 방지
      두께는 reduced Chang, 관통 방지 두께는 reduced Degen, 관통속도는 CEA-EDF(Kar).
      IAEA SRS 87은 Chang, modified Chang, CRIEPI, NDRC/modified NDRC, Degen 식을
      **카탈로그로 나열**할 뿐 선택을 강제하지 않는다. 결정적 차이는 IAEA가 명시한 단서다:
      이 식들은 고체 발사체 시험 기반이므로 항공기 엔진·착륙장치에 적용할 때 0.60~0.65의
      감소계수를 적용하는 것이 통상 적절하며, 저배근·횡철근 없는 표적 데이터에 기반한다.
      한편 SSG-68 5.176은 강체 미사일용 경험식의 유효범위가 항공기 충돌과 일치하지 않으므로
      적용성에 공학적 판단이 필요하다고 유보를 단다.
    positions:
      - source_id: US-NEI-07-13
        relation: baseline
        note: "§2.1.2 SELECTS: Modified NDRC (penetration), reduced Chang (scabbing thickness), reduced Degen (perforation thickness), CEA-EDF per Kar (perforation velocity). Notes Degen/CEA-EDF/Chang/CRIEPI give comparable VP."
      - source_id: IAEA-SRS-87
        relation: partial
        note: "PRESENTS the same formula family (Chang, modified Chang, CRIEPI, NDRC/modified NDRC, Degen) as a catalogue without mandating one; adds a 0.60-0.65 reduction factor for deformable aircraft engine parts and landing gear, and a lightly-reinforced-target validity caveat."
      - source_id: IAEA-SSG-68
        relation: different-architecture
        note: "Para. 5.176 treats empirical rigid-missile formulas as an ALTERNATIVE for secondary missiles and debris only, warning their validity ranges usually do not coincide with aircraft impact; the primary route is a coupled non-linear model able to assess failure modes from spalling to perforation (5.174)."
      - source_id: US-RG-1.217
        relation: baseline
        note: "Regulatory Position 2: 'NEI 07-13 references other documents, but this RG does not endorse any of the referenced documents.' The empirical correlations are drawn from those referenced documents."
      - source_id: CZ-329-2017
        relation: no-equivalent
      - source_id: EU-EUR
        relation: not-public
        note: "Ch. 2.4 §5.8.1.4 Aircraft impact and §5.8.1.5 Missiles sit under design loads for buildings, and §5.9 covers load combinations — but the methods and values are licensed."
    clause_ids: [US-NEI-07-13-local-formulas, US-NEI-07-13-failure-modes, US-RG-1.217-position, IAEA-SRS-87-structures, IAEA-SSG-68-5.170-missile-target, IAEA-SSG-68-5.163-effects]
    divergence_note: >-
      RESOLVED — this was the open technical question in the first build of this database; it
      is now answered from both primary texts. The substantive finding is a hierarchy
      difference, not a formula disagreement: NEI 07-13 makes named empirical formulas the
      working method for local damage, whereas SSG-68 demotes them to an alternative for
      secondary missiles and debris and makes coupled non-linear analysis the primary route.
      An applicant using NEI 07-13 formulas in an IAEA-aligned jurisdiction should expect to
      justify (a) applicability of solid-projectile correlations to a crushable engine —
      SRS-87 suggests a 0.60-0.65 reduction factor — and (b) the reinforcement ratio of the
      real target versus the lightly reinforced test specimens the formulas came from.
      DECISIVE ADDITION from RG 1.217 Section C, position 2: the NRC endorses NEI 07-13 but
      expressly does NOT endorse the documents NEI 07-13 references — which is where the
      Modified NDRC, Chang, Degen and CEA-EDF correlations come from. So even on the US side
      the regulator has accepted the METHOD AS ASSEMBLED, not the underlying correlations. The
      earlier reading of this database, that no qualification to the endorsement could be
      found, was wrong.

  - cw_id: CW-09
    topic_id: T12
    question_en: "What is the pass/fail criterion?"
    question_ko: "합격/불합격 판정기준은 무엇인가?"
    summary_ko: >-
      **원문 대조로 확정된 항목.** 미국 규정 기준은 (노심냉각 OR 격납건전성) AND
      (사용후핵연료 냉각 OR 저장조 건전성)이며, NEI 07-13 §2.5가 이를 구조 판정으로 번역한다:
      격납은 (i) 강재 격납/강재라이너 콘크리트 격납의 관통이 없고 (ii) 노심손상 시 유효
      완화전략 시행 전에 최대압력능력이 초과되지 않으면 수용된다. 저장조는 요구 최소수위
      아래에서 라이너 누설이 없으면 국부적 압괴·균열이 있어도 수용된다. IAEA SSG-68 5.192는
      설계기준초과 충돌에 대해 "대량 또는 조기 방출 방지에 필요한 안전상 중요 품목의 기능
      유지"를 최소 허용기준으로 제시한다.
      즉 두 체계 모두 설계기준초과·최적추정 해석이라는 점에서 일치하나, 판정 대상이 다르다 —
      미국은 4개 발전소 기능을 명명하고, IAEA는 방출 기반 목표를 쓴다. 한편 SSG-68 5.185는
      **우발적** 충돌에 대해서는 격납구조물의 무관통을 요구하여 훨씬 엄격하다.
    positions:
      - source_id: US-10CFR50.150
        relation: baseline
        note: "(core cooling OR containment integrity) AND (SFP cooling OR SFP integrity), with reduced use of operator actions."
      - source_id: US-NEI-07-13
        relation: baseline
        note: "§2.5: containment intact = no perforation AND ultimate pressure capability not exceeded before effective mitigation; SFP integrity = no liner leakage below required minimum water level, localized crushing/cracking acceptable."
      - source_id: IAEA-SSG-68
        relation: equivalent
        note: "Para. 5.192 (BDB): at a minimum, items important to safety necessary to prevent large or early release remain functional; best estimate approach permitted. Para. 5.185 (accidental/DB): confinement structures withstand impact WITHOUT perforation."
      - source_id: EU-EUR
        relation: different-architecture
        note: "Ch. 2.1 §3 sets quantitative safety objectives including §3.5 probabilistic safety targets, and §5.1.7 defines environmental condition resistance levels 1/2/S/N against which SSCs are qualified. Acceptance is graded through those levels rather than by a single pass/fail statement."
      - source_id: IAEA-SRS-88
        relation: partial
        note: "A TIERED approach to margin assessment; the margin is quantified with best estimate or conservative values, HCLPF being one such value rather than the mandated measure."
      - source_id: CZ-329-2017
        relation: partial
        note: "§ 12(1) requires a conservative approach to basic external design events; no aircraft-specific pass/fail statement equivalent to NEI 07-13 §2.5."
    clause_ids: [US-10CFR50.150-a-1, US-NEI-07-13-sufficiency, IAEA-SSG-68-5.192-bdb, IAEA-SSG-68-5.185-confinement, EU-EUR-aircraft-structure, IAEA-SRS-88-margins, CZ-329-2017-external-events-general]
    divergence_note: >-
      The sharpest practical difference sits inside the containment test. NEI 07-13 §2.5.1
      presumes a core damage event and asks only that the ultimate pressure capability hold
      long enough for mitigation; SSG-68 para. 5.185 requires confinement structures to
      withstand an accidental crash without perforation outright. The two are not in conflict
      because they sit at different hazard levels (BDB vs design basis) — which is exactly
      the CW-04 finding, now visible in the acceptance criteria themselves.

  - cw_id: CW-10
    topic_id: T13
    question_en: "Are malicious (intentional) impacts treated together with accidental ones?"
    question_ko: "고의적 충돌과 우발적 충돌을 함께 다루는가?"
    summary_ko: >-
      **두 곳을 원문으로 확인하여 결론이 바뀐 항목.** 미국은 하나의 규정으로 다루되 상세
      방법론을 비공개본에 두고 SGI(안전조치정보)로 통제한다 — 근거는 10 CFR 50.150(d)가
      아니라 RG 1.217 Section A이다. 체코는 설계 시행령 **안에서** 다룬다: § 10(1)(d)가
      "수송항공기에 의한 고의적 공격"의 결과분석에서 도출된 물리적방호계획 자료를
      설계기준에 포함하도록 요구하며, 우발적 낙하(§ 11(4)(b))와 별도 경로로 처리한다.
      EUR도 고의적 충돌을 별도 항목으로 둔다. EU 원자력안전지침만 보안·악의적 행위를
      적용범위에서 명시적으로 제외한다.
    positions:
      - source_id: US-10CFR50.150
        relation: baseline
        note: "One rule covers the large commercial aircraft impact; (a)(2) footnote 1 says the detailed parameters are set forth in guidance and changes require Commission approval."
      - source_id: EU-EUR
        relation: different-architecture
        note: "The intentional crash has its own sections in BOTH chapters: Ch. 2.1 §8.3.3 under SECURITY (beside §8.3.2 design of the physical protection system) and Ch. 2.4 §1.3.3.2 in the DESIGN BASIS chapter with its own example load function (§1.3.3.2.1). Ch. 2.4 §1.4 Sabotage is a further separate man-made hazard."
      - source_id: EU-2014-87-EURATOM
        relation: no-equivalent
        note: "Art. 8b(1)(a) reaches 'extreme external natural and UNINTENDED man-made hazards' — the operative defence-in-depth clause covers the accidental crash and expressly not the deliberate one."
      - source_id: CZ-263-2016
        relation: different-architecture
        note: "§ 2(4)(b) defines the design basis threat in terms of a NATURAL PERSON capable of intentional unlawful handling — not a vehicle or aircraft. The intentional aircraft attack therefore reaches the design through the physical protection plan, not through the DBT definition."
      - source_id: EU-WENRA-SRL
        relation: no-equivalent
        note: "Issue TU footnote 88: 'Within these reference levels malicious acts are not considered.'"
      - source_id: CZ-329-2017
        relation: equivalent
        note: "§ 10(1)(d) requires the design bases to include data from the physical protection plan derived from the consequence analysis of an INTENTIONAL ATTACK BY A TRANSPORT AIRCRAFT. The malicious case is an explicit design input, handled separately from the accidental fall in § 11(4)(b)."
      - source_id: US-RG-1.217
        relation: baseline
        note: "Section A: the non-public versions of RG 1.217 and NEI 07-13 carry the detailed methodology under Safeguards Information controls, available only to SGI-qualified personnel including plant designers."
    clause_ids: [US-10CFR50.150-a-2, US-RG-1.217-sgi, EU-EUR-aircraft-structure, EU-2014-87-framework, CZ-329-2017-intentional-attack, CZ-263-2016-dbt]
    divergence_note: >-
      Four distinct architectures, all now confirmed from primary or official-ToC sources.
      US: one rule for one large-commercial-aircraft event, with the detail held under
      Safeguards Information. EUR: the intentional crash is a named subject in the Security
      section AND carries its own design-basis load function. Czech: the intentional attack
      enters the design bases as physical-protection-plan data (§ 10(1)(d)), while the
      statutory design basis threat itself is defined as a PERSON (§ 2(4)(b)). EU directive
      and WENRA: expressly out of scope — "unintended man-made hazards" (Art. 8b(1)(a)) and
      Issue TU footnote 88 respectively.
      Only EUR gives the deliberate case an explicit design load function in a design
      chapter; only Czechia routes it through a plan the design must then absorb.

  - cw_id: CW-11
    topic_id: T15
    question_en: "How much credit may be taken for operator action?"
    question_ko: "운전원 조치를 어느 정도까지 인정할 수 있는가?"
    summary_ko: >-
      미국 규정은 'reduced use of operator actions'라는 제약을 **판정기준 문장 안에** 넣은
      유일한 문서다. 다만 EUR은 다른 방식으로 같은 문제를 다룬다 — 제2.1장 §6.7이 운전원·
      발전소 인력, 비상설설비, 최종열침원, 전원, 압축공기, 주제어실에 대한 **자율운전
      목표(autonomy objectives)**를 설정하고 §6.8이 비상설설비를 규율한다. 즉 미국은
      허용기준 문구로, EUR은 자율운전 시간으로 운전원 의존을 제한한다. 체코 시행령과
      IAEA SSG-68에는 항공기 충돌에 대한 대응 조항이 없다.
    positions:
      - source_id: US-10CFR50.150
        relation: baseline
        note: "'with reduced use of operator actions' is written into the acceptance criterion itself."
      - source_id: CZ-329-2017
        relation: no-equivalent
      - source_id: IAEA-SSG-68
        relation: no-equivalent
      - source_id: US-NEI-07-13
        relation: baseline
        note: "In practice the methodology leans on operator-implemented 10 CFR 50.54(hh)(2) mitigation strategies; reconciled with 'reduced use of operator actions' by timing — mitigation need only be implementable before the ultimate pressure capability is challenged."
      - source_id: EU-EUR
        relation: different-architecture
        note: "Ch. 2.1 §6.7 sets AUTONOMY OBJECTIVES — in respect of operators and plant personnel (§6.7.1), non-permanent equipment (§6.7.1.1), ultimate heat sink, power supplies, compressed air and the MCR — and §6.8 governs Non-Permanent Equipment including its role in plant robustness. EUR constrains operator dependence through autonomy periods rather than through a phrase in an acceptance criterion. Values are licensed."
    clause_ids: [US-10CFR50.150-a-1, US-NEI-07-13-sufficiency, US-NEI-07-13-fire-spurious, EU-EUR-design-conditions]

  - cw_id: CW-12
    topic_id: T14
    question_en: "How are the assessment results documented, reviewed and disclosed?"
    question_ko: "평가결과는 어떻게 문서화·심사·공개되는가?"
    summary_ko: >-
      미국은 (b)에 따라 설계특성·기능적 능력과 그것이 (a)(1)을 어떻게 충족하는지를 PSAR/FSAR에
      기재하고, (c)에 따라 안전성분석보고서 기재요건을 통해 변경을 통제하며, NRC의 AIA 검사
      프로그램으로 실제 구현 여부를 확인한다. 상세 방법론은 SGI 통제 하의 비공개본에 있어
      공개자료로는 방법론 수준의 비교만 가능하다.
      **정정:** 이전 판은 비공개 근거를 10 CFR 50.150(d)로 기재했으나, (d)는 일몰 조항이며
      비공개 근거는 RG 1.217 Section A의 SGI 통제이다.
    positions:
      - source_id: US-10CFR50.150
        relation: baseline
        note: "(b) requires the PSAR/FSAR to describe the design features and functional capabilities AND how they meet (a)(1); (c) routes change control through the SAR content requirements (50.34(a)(13), 50.34(b)(12), 52.47(a)(28)/52.63, 52.79(a)(47), 52.157(f)(32)/52.171)."
      - source_id: US-NEI-07-13
        relation: baseline
        note: "NRC AIA inspection programme verifies as-built implementation."
      - source_id: CZ-329-2017
        relation: partial
        note: "Documented within the standard Czech safety documentation and SÚJB review; specifics not captured in this database."
    clause_ids: [US-10CFR50.150-b, US-10CFR50.150-c, US-RG-1.217-sgi, US-RG-1.217-implementation, US-NEI-07-13-aia-inspection]
