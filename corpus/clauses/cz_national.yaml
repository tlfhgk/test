clauses:

  - clause_id: CZ-329-2017-intentional-attack
    source_id: CZ-329-2017
    locator: "vyhláška č. 329/2017 Sb., § 10 odst. 1 písm. d)"
    heading_en: "Intentional aircraft attack as a design input via the physical protection plan"
    heading_ko: "물리적방호계획을 통한 고의적 항공기 공격의 설계입력화"
    topics: [T03, T04, T13, T06]
    text_status: summary
    verification: primary_source
    confidence: high
    quoted_source_text_cs: >-
      "údajů plánu zajištění fyzické ochrany vycházejících z analýzy následků v případě
      úmyslného útoku dopravním letadlem proti jadernému zařízení"
    summary_en: >-
      § 10(1) lists what the design bases (projektová východiska) must establish. Item (d)
      requires the design bases to include "data of the physical protection plan derived from
      the analysis of consequences in the case of an INTENTIONAL ATTACK BY A TRANSPORT
      AIRCRAFT against the nuclear installation". The malicious aircraft impact is therefore
      not outside the design decree: it enters the design bases as an input carried over from
      the physical protection plan, alongside the accidental crash handled separately in
      § 11(4)(b).
    summary_ko: >-
      § 10(1)은 설계기준(projektová východiska)이 정해야 할 사항을 열거한다. 그중 (d)는
      설계기준이 "원자력시설에 대한 **수송항공기에 의한 고의적 공격** 시의 결과분석에서
      도출된 물리적방호계획의 자료"를 포함하도록 요구한다. 따라서 고의적 항공기 충돌은
      설계 시행령 밖에 있는 것이 아니라, 물리적방호계획으로부터 넘어온 입력으로서 설계기준
      안으로 들어온다. 우발적 추락은 § 11(4)(b)에서 별도로 다룬다.
    key_parameters:
      threat_type: "úmyslný útok dopravním letadlem — intentional attack by a transport aircraft"
      route_into_design: "physical protection plan → consequence analysis → design bases"
      separate_from: "the accidental fall provision in § 11(4)(b)"
    source_url: "https://www.zakonyprolidi.cz/cs/2017-329"
    notes: >-
      MAJOR CORRECTION. The previous database contained an editorial record
      (CZ-malicious-separation) asserting that the Czech framework handles the deliberate
      aircraft impact through security provisions rather than the public design decree. That
      record has been deleted. The decree itself puts the intentional attack into the design
      bases at § 10(1)(d). What remains true is that the threat characterisation lives in the
      physical protection plan, which is not public — but the design obligation is public and
      explicit. This makes the Czech treatment structurally CLOSER to EUR (which also names an
      intentional crash case) than the previous version of this database claimed.

  - clause_id: CZ-329-2017-external-events-general
    source_id: CZ-329-2017
    locator: "vyhláška č. 329/2017 Sb., § 11 odst. 1-3"
    heading_en: "Basic external design events and the 1E-4/yr intensity level"
    heading_ko: "기본 외부 설계사건 및 1E-4/년 강도 수준"
    topics: [T04, T05, T06]
    text_status: summary
    verification: primary_source
    confidence: high
    quoted_source_text_cs: >-
      "Intenzita základní vnější projektové události musí být rovna intenzitě hodnocené
      vlastnosti území s četností výskytu jednou za 10 000 let nebo nižší, s výjimkou případů
      vlastností území, pro které musí být na základě použité metody posouzení území
      k umístění jaderného zařízení použity jiné četnosti výskytu"
    summary_en: >-
      § 11(1): the basic design bases must establish the basic external design events for the
      territory where the installation is to be sited; these events are the limiting value of
      loading of SSCs by territorial properties and their combinations at which the safety
      objectives of the design are met with high credibility.
      § 11(2): all events induced by territorial properties included in the siting assessment
      must be taken into account.
      § 11(3): the intensity of a basic external design event must equal the intensity of the
      evaluated territorial property with an occurrence frequency of ONCE PER 10,000 YEARS
      (1E-4/yr) or lower, except for territorial properties for which the siting assessment
      method requires other occurrence frequencies and corresponding acceptance criteria.
    summary_ko: >-
      § 11(1): 기본 설계기준은 시설이 입지할 지역에 대한 기본 외부 설계사건을 정해야 한다.
      이 사건들은 지역특성 및 그 조합에 의한 SSC 부하의 한계값으로서, 그 수준에서 설계의
      안전목표가 높은 신뢰도로 충족되는 값이다.
      § 11(2): 부지선정 평가에 포함된 지역특성으로 유발되는 모든 사건을 고려해야 한다.
      § 11(3): 기본 외부 설계사건의 강도는 발생빈도가 **1만 년에 1회(1E-4/년)** 이하인
      평가 대상 지역특성의 강도와 같아야 한다. 다만 부지선정 평가방법에 따라 다른 발생빈도와
      그에 상응하는 허용기준을 적용해야 하는 지역특성은 예외로 한다.
    key_parameters:
      general_external_event_frequency: "1E-4 per year (once per 10,000 years) or lower"
      definition: "limiting load at which design safety objectives are met with high credibility"
    source_url: "https://www.zakonyprolidi.cz/cs/2017-329"
    notes: >-
      LOCATOR CORRECTION. The previous version placed this at "§ 6 and § 12" on the strength
      of search snippets. The primary text puts it at § 11(1)-(3). The 1E-4/yr figure itself
      was recorded correctly.

  - clause_id: CZ-329-2017-aircraft-dbe
    source_id: CZ-329-2017
    locator: "vyhláška č. 329/2017 Sb., § 11 odst. 4 písm. b)"
    heading_en: "Accidental fall of an aircraft or other object — the 1E-7/yr basis"
    heading_ko: "항공기 또는 기타 물체의 우발적 낙하 — 1E-7/년 기준"
    topics: [T02, T03, T04, T05, T06, T13]
    text_status: verbatim
    verification: primary_source
    confidence: high
    quoted_source_text_cs: >-
      "Základní vnější projektové události pro návrh a pro hodnocení odolnosti vybraných
      zařízení a systémů, konstrukcí a komponent s vlivem na jadernou bezpečnost nezbytných
      pro zvládání havarijních podmínek a radiační havárie jaderných zařízení s jaderným
      reaktorem o tepelném výkonu vyšším než 50 MW musí ... b) pro stanovení odolnosti proti
      náhodnému pádu letadla nebo jiného objektu vycházet z intenzity účinků pádu takového
      objektu, jehož četnost pádu na plochu, na níž může způsobit základní vnější iniciační
      událost, je vyšší než jednou za 10 000 000 let."
    summary_en: >-
      § 11(4) applies to basic external design events used for the design and for the
      evaluation of resistance of selected equipment and systems, structures and components
      with an influence on nuclear safety that are NECESSARY FOR MANAGING EMERGENCY CONDITIONS
      AND RADIATION EMERGENCIES, at nuclear installations with a reactor of thermal power
      exceeding 50 MW. For those SSCs:
      (a) seismic resistance must be based on a postulated peak horizontal ground acceleration
      of the structure carrying the SSC of at least 1/10 of gravitational acceleration (0.1 g);
      (b) resistance against the accidental fall of an aircraft OR ANOTHER OBJECT must be based
      on the intensity of the effects of the fall of such an object whose frequency of falling
      onto an area where it could cause a basic external initiating event is higher than once
      in 10,000,000 years (> 1E-7/yr).
    summary_ko: >-
      § 11(4)는 열출력 50 MW를 초과하는 원자로를 가진 원자력시설에서, 핵안전에 영향을 미치며
      **사고조건 및 방사선비상 관리에 필요한** 선정 설비·계통·구조물·기기의 설계 및 저항성
      평가에 사용되는 기본 외부 설계사건에 적용된다. 해당 SSC에 대해:
      (a) 내진저항성은 해당 SSC를 지지하는 구조물 지반의 가정 최대수평가속도를 중력가속도의
      **1/10(0.1 g) 이상**으로 하여 정한다;
      (b) 항공기 **또는 기타 물체**의 우발적 낙하에 대한 저항성은, 기본 외부 기인사건을
      유발할 수 있는 구역에 낙하할 빈도가 1천만 년에 1회를 초과하는(> 1E-7/년) 물체의
      낙하 영향 강도를 기준으로 정한다.
    key_parameters:
      applicability_threshold: "reactor thermal power > 50 MW"
      ssc_scope: "selected SSCs necessary for managing emergency conditions and radiation emergencies"
      seismic_floor: "0.1 g minimum postulated PGA (§ 11(4)(a))"
      aircraft_frequency: "> 1E-7 per year (§ 11(4)(b))"
      object_scope: "aircraft OR another object"
    source_url: "https://www.zakonyprolidi.cz/cs/2017-329"
    notes: >-
      LOCATOR CORRECTION. The previous version placed this at "§ 13 odst. 2 písm. b)" from a
      search result. The primary text puts it at § 11(4)(b). The quoted Czech wording and the
      1E-7/yr figure recovered earlier were otherwise accurate, as was the reading that the
      SSC scope is narrowed to emergency-management SSCs rather than all safety SSCs.
      New from the primary text: § 11(4)(a) sets a 0.1 g seismic floor for the same SSC set,
      which shows the two hazards being treated as a matched pair of minimum design bases.

  - clause_id: CZ-329-2017-conservative-approach
    source_id: CZ-329-2017
    locator: "vyhláška č. 329/2017 Sb., § 12 odst. 1"
    heading_en: "Conservative approach for basic external design events"
    heading_ko: "기본 외부 설계사건에 대한 보수적 접근"
    topics: [T04, T12]
    text_status: summary
    verification: primary_source
    confidence: high
    summary_en: >-
      § 12(1): the design bases must ensure fulfilment of the principles of safe use of nuclear
      energy for basic external design events and their highly probable combinations, with a
      CONSERVATIVE APPROACH to the assumed initial state of the installation and to possible
      accompanying failures that do not prevent effective actuation of the safety systems.
    summary_ko: >-
      § 12(1): 설계기준은 기본 외부 설계사건 및 그 발생가능성이 높은 조합에 대해, 원자력시설의
      초기상태 가정과 안전계통의 유효한 작동을 방해하지 않는 동반고장 가능성에 관하여
      **보수적 접근법**으로 원자력 안전이용 원칙의 충족을 보장해야 한다.
    key_parameters:
      approach: "conservative (konzervativní přístup)"
    source_url: "https://www.zakonyprolidi.cz/cs/2017-329"
    notes: >-
      This is the provision that makes the CW-04 divergence concrete. Because the Czech
      accidental aircraft crash is a basic external design event, it is analysed under this
      conservative approach — whereas 10 CFR 50.150(a)(1) requires "realistic analyses" and
      RG 1.217 confirms design-basis requirements do not attach to features selected solely
      for the aircraft rule.
