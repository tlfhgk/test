clauses:

  - clause_id: CZ-263-2016-enabling
    source_id: CZ-263-2016
    locator: "zákon č. 263/2016 Sb., § 24(7), § 44(4)(a)(b), § 45(4), § 46"
    heading_en: "Statutory basis for the design decree"
    heading_ko: "설계 시행령의 법적 근거"
    topics: [T01]
    text_status: summary
    verification: web_verified
    confidence: medium
    summary_en: >-
      Decree No. 329/2017 Sb. on requirements for the design of a nuclear installation was
      issued by SÚJB under the empowering provisions of the Atomic Act (Act No. 263/2016
      Sb.), namely § 24(7), § 44(4)(a) and (b), § 45(4) and § 46. The Atomic Act is the
      binding primary legislation; the decree carries the technical design requirements.
    summary_ko: >-
      원자력시설 설계 요건에 관한 시행령 제329/2017호는 원자력법(제263/2016호)의 위임규정,
      즉 제24조 제7항, 제44조 제4항 (a)·(b), 제45조 제4항, 제46조에 근거하여 SÚJB가
      발령하였다. 원자력법이 구속력 있는 상위 법률이며, 기술적 설계요건은 시행령이 담는다.
    source_url: "https://www.zakonyprolidi.cz/cs/2017-329"

  - clause_id: CZ-329-2017-aircraft-dbe
    source_id: CZ-329-2017
    locator: "vyhláška č. 329/2017 Sb., § 13 odst. 2 písm. b)"
    heading_en: "Accidental aircraft crash as a design-basis external initiating event"
    heading_ko: "설계기준 외부 기인사건으로서의 우발적 항공기 추락"
    topics: [T02, T03, T04, T05, T06, T13]
    text_status: summary
    verification: web_verified
    confidence: high
    quoted_source_text_cs: >-
      "pro stanovení odolnosti proti náhodnému pádu letadla nebo jiného objektu se vychází
      z intenzity účinků pádu takového objektu, jehož četnost pádu na plochu, na níž může
      způsobit základní vnější iniciační událost, je vyšší než jednou za 10 000 000 let"
    summary_en: >-
      § 13(2)(b): to establish resistance against an accidental crash of an aircraft OR ANOTHER
      OBJECT, the basis is the intensity of the effects of the fall of such an object whose
      frequency of falling onto an area where it could cause a basic external initiating event
      is higher than once in 10,000,000 years (frequency > 1E-7 per year).
      § 13 applies this to selected equipment, systems, structures and components with an
      influence on nuclear safety that are NECESSARY FOR MANAGING EMERGENCY CONDITIONS AND
      RADIATION EMERGENCIES, at nuclear installations with a reactor of thermal power
      exceeding 50 MW.
    summary_ko: >-
      § 13(2)(b): 항공기 **또는 기타 물체**의 우발적 낙하에 대한 저항성을 정하는 기준은,
      기본 외부 기인사건을 유발할 수 있는 구역에 낙하할 빈도가 1천만 년에 1회를 초과하는
      (빈도 > 1E-7/년) 물체의 낙하 영향 강도이다.
      § 13은 이를 열출력 50 MW를 초과하는 원자로를 가진 원자력시설에서, 핵안전에 영향을
      미치며 **사고조건 및 방사선비상 관리에 필요한** 선정 설비·계통·구조물·기기에 적용한다.
    key_parameters:
      applicability_threshold: "reactor thermal power > 50 MW"
      ssc_scope: "selected SSCs with influence on nuclear safety NECESSARY for managing emergency conditions and radiation emergencies — not all safety SSCs"
      crash_type: "accidental (náhodný pád letadla nebo jiného objektu) — aircraft OR other object"
      screening_frequency: "> 1E-7 per year → included in the design basis"
      basis_quantity: "intensity of the effects of the falling object"
    source_url: "https://www.zakonyprolidi.cz/cs/2017-329"
    notes: >-
      KEY COMPARISON POINT. Czech law puts the accidental aircraft crash INSIDE the design
      basis, selected by an explicit numerical frequency criterion. The US rule instead
      places the large-commercial-aircraft impact OUTSIDE the design basis and applies
      realistic rather than design-basis analysis — see CW-04 and CW-05.
      Two refinements recovered with the § locator, both of which narrow the earlier reading
      of this record: (1) the provision covers an aircraft OR ANOTHER OBJECT, so it is a
      generic falling-object rule rather than an aircraft-specific one; (2) the SSC scope is
      not all safety-related SSCs but those necessary for MANAGING EMERGENCY CONDITIONS AND
      RADIATION EMERGENCIES — a narrowing that is structurally close to the US "key design
      features and functional capabilities", and closer to it than a blanket design-basis
      requirement would be.

  - clause_id: CZ-329-2017-external-events-general
    source_id: CZ-329-2017
    locator: "vyhláška č. 329/2017 Sb., § 6 and § 12"
    heading_en: "External initiating events in the design basis and the general 1E-4/yr level"
    heading_ko: "설계기준 내 외부 기인사건 및 일반 1E-4/년 수준"
    topics: [T04, T05, T06]
    text_status: summary
    verification: web_verified
    confidence: medium
    summary_en: >-
      § 6 requires the basic design bases (projektová východiska) to establish the basic
      external design events for the territory where the nuclear installation is to be sited.
      § 12 then fixes their intensity: the intensity of a basic external design event must
      equal the intensity of the evaluated territorial property with an occurrence frequency
      of ONCE PER 10,000 YEARS (1E-4 per year) or lower, except for territorial properties
      for which other occurrence frequencies must be used under the siting assessment
      methodology. Design bases must ensure compliance with the principles of safe use of
      nuclear energy for basic external design events and their highly probable combinations,
      using a conservative approach.
    summary_ko: >-
      § 6은 기본 설계기준(projektová východiska)이 원자력시설이 입지할 지역에 대한 기본
      외부 설계사건을 설정하도록 요구한다. § 12는 그 강도를 정한다: 기본 외부 설계사건의
      강도는 발생빈도가 **1만 년에 1회(1E-4/년)** 이하인 평가 대상 지역특성의 강도와
      같아야 하며, 부지선정 평가방법론에 따라 다른 발생빈도를 적용해야 하는 지역특성은
      예외로 한다. 설계기준은 기본 외부 설계사건 및 그 발생가능성이 높은 조합에 대해
      보수적 접근법으로 원자력 안전이용 원칙의 준수를 보장해야 한다.
    key_parameters:
      general_external_event_frequency: "1E-4 per year (once per 10,000 years) or lower"
      approach: "conservative"
      relationship_to_aircraft: "aircraft/falling objects use the separate 1E-7/yr level in § 13(2)(b) — three orders of magnitude lower"
    source_url: "https://www.zakonyprolidi.cz/cs/2017-329"
    notes: >-
      IMPORTANT STRUCTURAL FINDING. The Czech decree operates TWO frequency levels, not one:
      1E-4/yr for basic external design events generally (§ 12), and 1E-7/yr for the fall of
      an aircraft or other object (§ 13(2)(b)). The earlier version of this database recorded
      only the 1E-7 figure and so misrepresented the decree as having a single screening
      level. See crosswalk CW-05.

  - clause_id: CZ-378-2016-siting
    source_id: CZ-378-2016
    locator: "vyhláška č. 378/2016 Sb. (siting)"
    heading_en: "Site-stage evaluation of air traffic hazard"
    heading_ko: "부지단계 항공교통 위험 평가"
    topics: [T02, T05]
    text_status: summary
    verification: to_verify
    confidence: low
    summary_en: >-
      Czech siting rules require the evaluation of external human-induced hazards at the
      site, including air traffic (airports, air corridors, flight frequencies), which
      produces the crash-frequency input used to decide whether aircraft crash enters the
      design basis under decree 329/2017.
    summary_ko: >-
      체코 부지 관련 규정은 공항, 항공로, 운항빈도 등 항공교통을 포함한 부지의 인위적
      외부 위험을 평가하도록 요구하며, 그 결과로 산출된 추락빈도가 시행령 329/2017에 따라
      항공기 추락을 설계기준에 포함할지 결정하는 입력이 된다.
    source_url: "https://www.zakonyprolidi.cz/cs/2016-378"
    notes: "GAP — decree number and content both to be confirmed."

  - clause_id: CZ-malicious-separation
    source_id: CZ-263-2016
    locator: "Atomic Act — physical protection provisions"
    heading_en: "Malicious aircraft impact handled outside the design decree"
    heading_ko: "고의적 항공기 충돌은 설계 시행령 밖에서 취급"
    topics: [T13, T14]
    text_status: editorial
    verification: model_knowledge
    confidence: low
    summary_en: >-
      In the Czech framework, as in most European frameworks, the deliberate (malicious)
      aircraft impact is handled through nuclear security and physical protection provisions
      rather than through the publicly available design decree, and the associated threat
      characterisation is treated as sensitive information. The design decree addresses the
      accidental crash.
    summary_ko: >-
      체코 체계에서는 대부분의 유럽 체계와 마찬가지로 고의적(악의적) 항공기 충돌은 공개된
      설계 시행령이 아니라 핵안보 및 물리적방호 규정을 통해 다루어지며, 관련 위협 정의는
      민감정보로 취급된다. 설계 시행령은 우발적 추락을 대상으로 한다.
    notes: >-
      EDITORIAL record — this is the database author's structural reading, not a citation.
      It exists so that retrieval on "malicious / intentional crash / 고의충돌" returns an
      explicit statement of where the Czech answer does and does not live.
