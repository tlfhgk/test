clauses:

  - clause_id: US-NEI-07-13-scope
    locator: "NEI 07-13, scope"
    heading_en: "Purpose and scope of the methodology"
    heading_ko: "방법론의 목적 및 범위"
    topics: [T01, T02, T06]
    text_status: summary
    verification: web_verified
    confidence: high
    summary_en: >-
      NEI 07-13 is a methodology to assist NSSS vendors and combined licence applicants in
      assessing the physical, shock and fire effects of the impact of a large commercial
      aircraft on the reactor structures that contain nuclear fuel (containment building and
      spent fuel pool) and on other structures containing equipment needed to remove heat
      generated by the fuel.
    summary_ko: >-
      NEI 07-13은 원자로공급사(NSSS vendor)와 통합운영허가(COL) 신청자가 대형 상용항공기
      충돌의 물리적·충격(shock)·화재 영향을, 핵연료를 포함하는 원자로 구조물(격납건물 및
      사용후핵연료저장조)과 연료 붕괴열 제거에 필요한 기기를 수용한 기타 구조물에 대해
      평가하도록 지원하는 방법론이다.
    key_parameters:
      effect_categories: ["physical (structural) effects", "shock effects", "fire effects"]
      primary_targets: ["containment building", "spent fuel pool", "structures housing heat-removal equipment"]
    source_url: "https://www.nrc.gov/docs/ML1114/ML111440006.pdf"

  - clause_id: US-NEI-07-13-elements
    locator: "NEI 07-13, methodology elements"
    heading_en: "Elements of the methodology"
    heading_ko: "방법론 구성요소"
    topics: [T07, T08, T09, T12]
    text_status: summary
    verification: web_verified
    confidence: high
    summary_en: >-
      The methodology comprises the development of local and global loadings, material
      characterisation, failure criteria, and guidelines for interpreting the predicted
      damage in terms of plant safety functions.
    summary_ko: >-
      본 방법론은 국부하중 및 전체하중의 산정, 재료 특성화, 파괴기준 설정, 그리고 예측된
      손상을 발전소 안전기능 관점에서 해석하기 위한 지침으로 구성된다.
    key_parameters:
      elements: ["local and global loading development", "material characterisation", "failure criteria", "damage-to-safety-function interpretation"]
    source_url: "https://www.nrc.gov/docs/ML1114/ML111440006.pdf"

  - clause_id: US-NEI-07-13-failure-modes
    locator: "NEI 07-13, structural evaluation"
    heading_en: "Two structural failure modes to be evaluated"
    heading_ko: "평가대상 두 가지 구조 파괴모드"
    topics: [T08, T09]
    text_status: summary
    verification: web_verified
    confidence: high
    summary_en: >-
      For containment structures and spent fuel pools two distinct types of structural
      failure mode are evaluated: local failure (scabbing and perforation) and global
      structural response (up to plastic collapse). NEI 07-13 provides formulae for
      evaluating missile penetration, backside scabbing and complete perforation of
      reinforced concrete walls impacted by hard missiles generated in aircraft crash
      scenarios.
    summary_ko: >-
      격납구조물과 사용후핵연료저장조에 대해 두 가지 구조 파괴모드를 평가한다: 국부파괴
      (배면 박리(scabbing) 및 관통(perforation))와 전체 구조응답(소성붕괴까지). NEI 07-13은
      항공기 충돌 시나리오에서 발생하는 경성 미사일(hard missile)이 철근콘크리트 벽체에
      충돌할 때의 침투, 배면 박리, 완전관통을 평가하는 산식을 제공한다.
    key_parameters:
      local_modes: ["penetration", "backside scabbing", "perforation"]
      global_mode: "nonlinear global response up to plastic collapse"
      target_material: "reinforced concrete (hard-missile impact)"
    source_url: "https://www.nrc.gov/docs/ML1114/ML111440006.pdf"
    notes: >-
      This is the direct technical counterpart to IAEA Safety Reports Series No. 87
      (Assessment of Structures) — see the crosswalk entries for T08 and T09.

  - clause_id: US-NEI-07-13-safety-function-assessment
    locator: "NEI 07-13, plant response assessment"
    heading_en: "From structural damage to safety-function outcome"
    heading_ko: "구조손상에서 안전기능 판정으로"
    topics: [T06, T12, T15]
    text_status: summary
    verification: web_verified
    confidence: medium
    summary_en: >-
      After the structural evaluation, the assessment determines whether the plant retains
      the ability to keep the fuel in the reactor vessel and in the spent fuel pool cooled.
      Survivability of the critical functions is judged not only on the key components but
      also on their power supplies, cable runs and other supporting components.
    summary_ko: >-
      구조 평가 이후, 원자로용기 내 연료와 사용후핵연료저장조 연료의 냉각 유지 능력이
      보전되는지를 판정한다. 핵심기능의 생존성은 주요 기기뿐 아니라 그 전원공급, 케이블
      경로 및 기타 지원 기기까지 포함하여 평가한다.
    key_parameters:
      critical_functions: ["core cooling", "containment", "spent fuel cooling", "spent fuel pool integrity"]
      support_scope: ["power supplies", "cable runs", "other supporting components"]
    source_url: "https://www.nrc.gov/reactors/new-reactors/how-we-regulate/oversight/aia-inspections"

  - clause_id: US-NEI-07-13-shock-fire
    locator: "NEI 07-13, shock and fire effects"
    heading_en: "Shock-induced vibration and fire effects"
    heading_ko: "충격유발 진동 및 화재 영향"
    topics: [T10, T11]
    text_status: summary
    verification: model_knowledge
    confidence: medium
    summary_en: >-
      Beyond structural damage, the methodology addresses impact-induced vibratory motion
      transmitted through the structure to equipment, and the effects of the aviation fuel
      released by the impact, including external fire and fuel that penetrates openings into
      the structure. These are the "shock" and "fire" limbs of the three-part effect set
      named in the document's scope.
    summary_ko: >-
      구조손상 외에, 본 방법론은 충돌로 유발되어 구조물을 통해 기기로 전달되는 진동 운동과,
      충돌로 방출된 항공유의 영향(외부 화재 및 개구부를 통해 구조물 내부로 침투한 연료
      포함)을 다룬다. 이는 문서 범위에 명시된 3대 영향 중 "shock" 및 "fire"에 해당한다.
    source_url: "https://www.nrc.gov/docs/ML1114/ML111440006.pdf"
    notes: >-
      The scope statement naming physical/shock/fire effects is web-verified; the detailed
      treatment of each is summarised from general knowledge of the method and should be
      re-derived from the document itself before technical use.

  - clause_id: US-NEI-07-13-aia-inspection
    locator: "NRC AIA inspection programme (companion to NEI 07-13)"
    heading_en: "Regulatory verification of the assessment"
    heading_ko: "평가에 대한 규제 확인"
    topics: [T14]
    text_status: summary
    verification: web_verified
    confidence: medium
    summary_en: >-
      The NRC operates an Aircraft Impact Assessment (AIA) inspection programme for new
      reactors, verifying that the assessed key design features and functional capabilities
      are actually implemented in the constructed plant.
    summary_ko: >-
      NRC는 신규 원전에 대해 항공기충돌평가(AIA) 검사 프로그램을 운영하여, 평가된 핵심
      설계특성과 기능적 능력이 실제 건설된 발전소에 구현되었는지를 확인한다.
    source_url: "https://www.nrc.gov/reactors/new-reactors/how-we-regulate/oversight/aia-inspections"
