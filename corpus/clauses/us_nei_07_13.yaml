clauses:

  - clause_id: US-NEI-07-13-scope
    locator: "NEI 07-13 Rev. 8P, scope"
    heading_en: "Purpose and scope of the methodology"
    heading_ko: "방법론의 목적 및 범위"
    topics: [T01, T02, T06]
    text_status: summary
    verification: primary_source
    confidence: high
    summary_en: >-
      NEI 07-13 Rev. 8P (April 2011, prepared for NEI by ERIN Engineering & Research with
      EPRI) is a methodology assisting NSSS vendors and combined licence applicants in
      assessing the physical, shock and fire effects of a large commercial aircraft impact on
      reactor structures containing nuclear fuel (containment and spent fuel pool) and other
      structures containing equipment needed to remove fuel heat. Its main parts are:
      §2 Containment Structures and Spent Fuel Pools, §3 Heat Removal Capability.
    summary_ko: >-
      NEI 07-13 Rev.8P(2011년 4월, ERIN Engineering & Research가 EPRI와 함께 NEI를 위해 작성)는
      원자로공급사 및 통합운영허가 신청자가 대형 상용항공기 충돌의 물리적·충격·화재 영향을,
      핵연료를 포함한 원자로 구조물(격납건물, 사용후핵연료저장조)과 연료 붕괴열 제거에 필요한
      기기를 수용한 기타 구조물에 대해 평가하도록 지원하는 방법론이다. 주요 구성은
      제2장 격납구조물 및 사용후핵연료저장조, 제3장 열제거 능력이다.
    key_parameters:
      revision: "8P, April 2011"
      preparer: "ERIN Engineering & Research, Inc. (with EPRI)"
      structure: ["§2 Containment Structures and Spent Fuel Pools", "§3 Heat Removal Capability"]
    source_url: "https://www.nrc.gov/docs/ML1114/ML111440006.pdf"

  - clause_id: US-NEI-07-13-riera
    locator: "NEI 07-13 Rev. 8P, §2.2 Global Loading (2.2.2-2.2.5)"
    heading_en: "Global loading: the prescribed Riera force-time history"
    heading_ko: "전체하중: 규정된 Riera 하중-시간 이력"
    topics: [T03, T07]
    text_status: summary
    verification: primary_source
    confidence: high
    summary_en: >-
      Global loading is developed as an impact force time history using the Riera loading
      function, which "provides a simple method to approximate" the impact force. Because the
      Riera method degrades when applied to structures undergoing significant deformation,
      §2.2.5 provides a missile-target interaction method of analysis: it uses a hypothetical
      aircraft whose impact on a non-compliant (rigid) target matches the force-time history
      of the prescribed Riera function. NEI notes that "the aircraft rule requires assessment
      of a 'large commercial aircraft' and does not define a unique model of the aircraft nor
      its initial impact velocity", and that the Riera function is "provided to the vendors" —
      i.e. the numerical load definition is supplied outside the public document.
    summary_ko: >-
      전체하중은 Riera 하중함수를 이용한 충돌력 시간이력으로 산정하며, Riera 방법은 충돌력을
      근사하는 간편한 방법을 제공한다. 다만 큰 변형이 발생하는 구조물에 적용할 때 정확도가
      저하되므로, §2.2.5는 미사일-표적 상호작용 해석법을 제시한다. 이는 비순응(강체) 표적에
      대한 충돌이 규정된 Riera 함수의 하중-시간 이력과 일치하는 가상 항공기를 사용하는 방법이다.
      NEI는 "항공기 규정은 '대형 상용항공기'의 평가를 요구할 뿐 항공기의 고유 모델이나 초기
      충돌속도를 정의하지 않는다"고 밝히며, Riera 함수는 "공급사에게 제공된다"고 기술한다 —
      즉 수치적 하중 정의는 공개문서 밖에서 공급된다.
    key_parameters:
      load_function: "Riera force-time history (prescribed, supplied to vendors)"
      alternative: "§2.2.5 missile-target interaction using a hypothetical aircraft matched to the Riera function"
      public_availability: "the Riera function values are not in the public document"
    source_url: "https://www.nrc.gov/docs/ML1114/ML111440006.pdf"
    notes: >-
      Resolves the threat-parameter question from the US side: even the endorsed methodology
      does not publish the load. This confirms CW-03 — a numeric benchmark against EUR or
      Czech values is impossible from public sources.

  - clause_id: US-NEI-07-13-local-formulas
    locator: "NEI 07-13 Rev. 8P, §2.1.2 Local Loading Formulas (2.1.2.1-2.1.2.3)"
    heading_en: "Local damage: the specific empirical formulas adopted"
    heading_ko: "국부손상: 채택된 구체적 경험식"
    topics: [T08]
    text_status: summary
    verification: primary_source
    confidence: high
    summary_en: >-
      NEI 07-13 adopts named empirical correlations for local damage of reinforced concrete
      by hard missiles (principally the engine):
      - penetration into the target / engine casing: the Modified NDRC (National Defense
        Research Committee) formula;
      - wall thickness required to prevent scabbing (ts): the reduced Chang formula [ref 4];
      - wall thickness required to prevent perforation (tp): the reduced Degen formula [ref 4];
      - perforation velocity (VP), used for residual velocity of the missile after
        perforation: the CEA-EDF formula with a wall thickness reduction factor
        alpha_EDF = 0.75, following Kar [ref 5].
      NEI notes that a comparison of the Degen, CEA-EDF, Chang and CRIEPI formulas for the
      wall thickness required to prevent perforation shows each gives a comparable estimate
      of the perforation velocity VP. The formulas are applied to a "compact, high density,
      but crushable" engine, and the methodology also treats residual crushability after
      perforation of a primary wall.
    summary_ko: >-
      NEI 07-13은 경성 미사일(주로 엔진)에 의한 철근콘크리트 국부손상에 대해 다음의
      명시적 경험식을 채택한다:
      - 표적/엔진 케이싱 침투: **Modified NDRC** 식
      - 배면박리 방지 소요 벽두께(ts): **reduced Chang** 식 [참고문헌 4]
      - 관통 방지 소요 벽두께(tp): **reduced Degen** 식 [참고문헌 4]
      - 관통속도(VP, 관통 후 잔류속도 산정에 사용): Kar[참고문헌 5]에 따른 **CEA-EDF** 식,
        벽두께 감소계수 alpha_EDF = 0.75 적용
      NEI는 관통 방지 벽두께에 대한 Degen, CEA-EDF, Chang, CRIEPI 식의 비교 결과 각 식이
      관통속도 VP에 대해 유사한 추정치를 준다고 기술한다. 이 식들은 "치밀하고 밀도가 높으나
      압괴 가능한" 엔진에 적용되며, 1차 벽체 관통 이후의 잔류 압괴성도 다룬다.
    key_parameters:
      penetration: "Modified NDRC"
      scabbing_thickness: "reduced Chang"
      perforation_thickness: "reduced Degen"
      perforation_velocity: "CEA-EDF with wall thickness reduction factor alpha_EDF = 0.75 (per Kar)"
      compared_formulas: ["Degen", "CEA-EDF", "Chang", "CRIEPI"]
    source_url: "https://www.nrc.gov/docs/ML1114/ML111440006.pdf"
    notes: >-
      This resolves the open technical question previously recorded in crosswalk CW-08.

  - clause_id: US-NEI-07-13-failure-modes
    locator: "NEI 07-13 Rev. 8P, §2 (local vs global) and §2.3"
    heading_en: "Two structural failure modes; material characterisation and failure criteria"
    heading_ko: "두 가지 구조 파괴모드 및 재료 특성화·파괴기준"
    topics: [T08, T09]
    text_status: summary
    verification: primary_source
    confidence: high
    summary_en: >-
      For containment structures and spent fuel pools two failure modes are evaluated: local
      failure (scabbing and perforation) and global structural response. NEI defines the local
      terms explicitly — penetration into the target; spalling and scabbing (ejection of
      material from the back face of the target); and perforation (the missile fully penetrates
      and passes through the target), with "perforation velocity" being the initial missile
      velocity at which perforation just occurs. §2.3 covers material properties, ductile
      failure strain limits, concrete structural failure criteria, material models and
      structural integrity failure criteria.
    summary_ko: >-
      격납구조물과 사용후핵연료저장조에 대해 두 가지 파괴모드를 평가한다: 국부파괴(배면박리
      및 관통)와 전체 구조응답. NEI는 국부 용어를 명시적으로 정의한다 — 표적으로의 침투;
      표면박리(spalling) 및 배면박리(scabbing, 표적 배면에서의 재료 이탈); 관통(미사일이
      표적을 완전히 통과). "관통속도"는 관통이 막 발생하는 미사일 초기속도를 뜻한다.
      §2.3은 재료물성, 연성파괴 변형률한계, 콘크리트 구조파괴기준, 재료모델, 구조건전성
      파괴기준을 다룬다.
    source_url: "https://www.nrc.gov/docs/ML1114/ML111440006.pdf"

  - clause_id: US-NEI-07-13-sufficiency
    locator: "NEI 07-13 Rev. 8P, §2.5 Sufficiency Criteria (2.5.1, 2.5.2)"
    heading_en: "Sufficiency criteria: containment intact and spent fuel pool integrity"
    heading_ko: "충족기준: 격납건전성 및 사용후핵연료저장조 건전성"
    topics: [T12, T15]
    text_status: summary
    verification: primary_source
    confidence: high
    summary_en: >-
      §2.5.1 Containment Intact — the containment is acceptable if it is maintained intact
      from both the local and global impact analyses: structural analyses must show that
      perforation of a steel containment, or of a concrete containment with steel liner, does
      not occur on impact, AND that the containment ultimate pressure capability given a core
      damage event would not be exceeded before effective mitigation strategies can be
      implemented. "Effective mitigation strategies" are those that, for an indefinite period,
      provide sufficient cooling to the damaged core or containment to keep temperature and
      pressure below the ultimate pressure capability as defined in DCD/FSAR Chapter 19.
      For BWRs, actuation of the wetwell vent line is acceptable as a designed, scrubbed
      release. If the containment structure is damaged, a revised ultimate pressure capability
      for the damaged condition must be determined.
      §2.5.2 Spent Fuel Pool Integrity — localized crushing and cracking of the pool concrete
      wall is acceptable provided the analyses conclude the impact does not result in leakage
      through the spent fuel pool liner below the required minimum water level (the minimum
      operating level required by technical specifications). An impact at an elevation below
      the pool that could cause subsequent collapse of the pool supporting structure must
      also be evaluated as appropriate.
    summary_ko: >-
      §2.5.1 격납건전성 — 국부 및 전체 충돌해석 모두에서 격납이 건전하게 유지되면 수용된다.
      구조해석으로 (i) 충돌 시 강재 격납 또는 강재 라이너를 갖는 콘크리트 격납의 관통이
      발생하지 않고, (ii) 노심손상 사건 발생 시 유효한 완화전략을 시행할 수 있기 전에 격납
      최대압력능력이 초과되지 않음을 보여야 한다. "유효한 완화전략"이란 무기한으로 손상된
      노심 또는 격납에 충분한 냉각을 제공하여 DCD/FSAR 19장에 정의된 최대압력능력 이하로
      온도·압력 도전을 제한하는 전략이다. BWR의 경우 wetwell 벤트라인 작동은 설계된
      스크러빙 방출이므로 수용 가능하다. 격납구조물이 손상된 경우에는 손상상태를 고려한
      최대압력능력을 재산정해야 한다.
      §2.5.2 사용후핵연료저장조 건전성 — 저장조 콘크리트 벽의 국부적 압괴·균열은, 해석 결과
      충돌이 요구 최소수위(기술지침서가 요구하는 최소운전수위) 아래에서 저장조 라이너를 통한
      누설을 야기하지 않는다면 수용 가능하다. 저장조보다 낮은 표고에서의 충돌로 저장조 지지
      구조물이 후속 붕괴할 가능성도 필요 시 평가해야 한다.
    key_parameters:
      containment_test_1: "no perforation of steel containment or steel-lined concrete containment"
      containment_test_2: "ultimate pressure capability not exceeded before effective mitigation strategies implemented"
      bwr_allowance: "wetwell vent line actuation acceptable (designed, scrubbed release)"
      sfp_test: "no liner leakage below required minimum water level; localized crushing/cracking acceptable"
    source_url: "https://www.nrc.gov/docs/ML1114/ML111440006.pdf"
    notes: >-
      Note how much more permissive this is than a design-basis criterion: localized crushing
      and cracking of the SFP wall is explicitly acceptable, and core damage is presumed in
      the containment test. This is the practical face of "beyond design basis with realistic
      analysis" in 10 CFR 50.150.

  - clause_id: US-NEI-07-13-fire-spurious
    locator: "NEI 07-13 Rev. 8P, §1 Objectives — uncertainties; §3 Heat Removal Capability"
    heading_en: "Fire damage footprint and spurious actuations"
    heading_ko: "화재손상 영역 및 오작동"
    topics: [T11, T15]
    text_status: summary
    verification: primary_source
    confidence: high
    summary_en: >-
      Fire-induced spurious actuations cannot be modelled accurately, so the guidance holds
      applicants accountable for assuming the loss of ALL equipment and cables within the fire
      damage footprint, including cables inside the footprint whose loss disables equipment
      outside it. Evaluating hot-short-induced spurious actuations for every fire area is
      judged too complex and unpredictable for this beyond-design-basis assessment; the
      10 CFR 50.54(hh)(2) mitigation strategies developed by each COL applicant are relied on
      to inherently address that uncertainty, together with the multiple redundant trains with
      complete fire separation in new reactor designs.
    summary_ko: >-
      화재유발 오작동은 정확한 모델링이 불가능하므로, 본 지침은 신청자가 화재손상 영역 내의
      **모든** 기기와 케이블의 상실을 가정하도록 하며, 영역 내 케이블 상실로 영역 밖 기기가
      상실되는 경우도 포함한다. 모든 화재구역에 대해 hot short로 인한 오작동을 평가하는 것은
      이 설계기준초과 평가에서는 지나치게 복잡·예측불가능하다고 판단하여, 각 COL 신청자가
      개발하는 10 CFR 50.54(hh)(2) 완화전략과 신규 노형의 완전 화재분리된 다중 여유 트레인이
      해당 불확실성을 본질적으로 해소하는 것으로 본다.
    key_parameters:
      fire_rule: "assume loss of all equipment and cables within the fire damage footprint"
      linked_requirement: "10 CFR 50.54(hh)(2) mitigation strategies"
    source_url: "https://www.nrc.gov/docs/ML1114/ML111440006.pdf"
    notes: >-
      Important for CW-11: 50.150(a)(1) says "reduced use of operator actions", yet the
      methodology leans on 50.54(hh)(2) mitigation strategies, which are operator-implemented.
      The two are reconciled by timing — mitigation need only be implementable before the
      ultimate pressure capability is challenged.

  - clause_id: US-NEI-07-13-aia-inspection
    locator: "NRC AIA inspection programme (companion to NEI 07-13)"
    heading_en: "Regulatory verification of the assessment"
    heading_ko: "평가에 대한 규제 확인"
    topics: [T14]
    text_status: summary
    verification: web_verified
    confidence: medium
    summary_en: >-
      The NRC operates an Aircraft Impact Assessment (AIA) inspection programme for new
      reactors, verifying that the assessed key design features and functional capabilities
      are actually implemented in the constructed plant.
    summary_ko: >-
      NRC는 신규 원전에 대해 항공기충돌평가(AIA) 검사 프로그램을 운영하여, 평가된 핵심
      설계특성과 기능적 능력이 실제 건설된 발전소에 구현되었는지를 확인한다.
    source_url: "https://www.nrc.gov/reactors/new-reactors/how-we-regulate/oversight/aia-inspections"
