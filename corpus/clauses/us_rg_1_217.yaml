  - clause_id: US-RG-1.217-purpose
    locator: "RG 1.217, Section A (Introduction)"
    heading_en: "Purpose and regulatory hook"
    heading_ko: "목적 및 규제 근거"
    topics: [T01, T02]
    text_status: summary
    verification: web_verified
    confidence: high
    summary_en: >-
      Regulatory Guide 1.217, "Guidance for the Assessment of Beyond-Design-Basis Aircraft
      Impacts" (Revision 0, August 2011), describes a method that the NRC staff considers
      acceptable for use in satisfying the requirements of 10 CFR 50.150 concerning the
      consideration of aircraft impacts for new nuclear power reactors.
    summary_ko: >-
      규제지침 1.217 「설계기준 초과 항공기 충돌 평가 지침」(Rev.0, 2011.8)은 신규 원전에
      대한 항공기 충돌 고려에 관한 10 CFR 50.150 요건을 만족하는 데 NRC 실무진이 수용
      가능하다고 보는 방법을 기술한다.
    source_url: "https://www.federalregister.gov/documents/2011/08/12/2011-20513/guidance-for-the-assessment-of-beyond-design-basis-aircraft-impacts"
    notes: "Regulatory guides are not requirements; an applicant may propose an alternative method."

  - clause_id: US-RG-1.217-endorsement
    locator: "RG 1.217, Section C (Staff Regulatory Guidance)"
    heading_en: "Endorsement of NEI 07-13 Revision 8"
    heading_ko: "NEI 07-13 Rev.8 승인(endorsement)"
    topics: [T01, T07, T08, T09, T10, T11, T12]
    text_status: summary
    verification: web_verified
    confidence: high
    summary_en: >-
      The guide endorses the methodologies described in NEI 07-13, "Methodology for
      Performing Aircraft Impact Assessments for New Plant Designs," Revision 8, issued
      April 2011, as an acceptable means of performing the assessment required by
      10 CFR 50.150(a).
    summary_ko: >-
      본 지침은 NEI 07-13 「신규 원전 설계에 대한 항공기 충돌 평가 수행 방법론」
      Rev.8(2011년 4월)에 기술된 방법론을 10 CFR 50.150(a)가 요구하는 평가의
      수용 가능한 수행 수단으로 승인한다.
    key_parameters:
      endorsed_document: "NEI 07-13 Revision 8 (April 2011)"
      endorsement_type: "endorsement, possibly with staff clarifications/exceptions"
    source_url: "https://www.federalregister.gov/documents/2011/08/12/2011-20513/guidance-for-the-assessment-of-beyond-design-basis-aircraft-impacts"
    notes: >-
      This endorsement is the single most important structural fact of the US framework:
      the binding rule (50.150) contains no methodology at all, and the entire technical
      method lives in an industry document pulled in by a non-binding guide.

  - clause_id: US-RG-1.217-exceptions
    locator: "RG 1.217, Section C — staff clarifications"
    heading_en: "Staff clarifications and exceptions to the endorsement"
    heading_ko: "승인에 대한 실무진 명확화 및 예외사항"
    topics: [T07, T08, T09, T11]
    text_status: summary
    verification: to_verify
    confidence: low
    summary_en: >-
      NRC regulatory guides that endorse an industry document normally attach clarifications,
      exceptions or additional staff positions. The specific clarifications RG 1.217 attaches
      to NEI 07-13 Revision 8 could NOT be retrieved during the build of this database and
      are recorded here as an explicit gap.
      NEGATIVE FINDING (not proof of absence): repeated searches return only the bare
      endorsement sentence — "endorses the methodologies described in ... NEI 07-13 ...
      Revision 8, issued April 2011" — with no accompanying "with the following exceptions"
      or "except that" clause surfacing in any indexed source. This is consistent with an
      unqualified endorsement, but the full Section C text has not been read, so an
      unqualified endorsement is NOT established.
    summary_ko: >-
      산업계 문서를 승인하는 NRC 규제지침은 통상 명확화 사항·예외·추가 실무진 입장을
      부기한다. RG 1.217이 NEI 07-13 Rev.8에 대해 부기한 구체적 명확화 사항은 본 DB
      구축 시점에 확보하지 못했으며, 명시적 미확인 항목으로 기록한다.
      **부정적 소견(부재의 증명은 아님):** 반복 검색 결과 승인 문장 자체 — "NEI 07-13
      Rev.8(2011년 4월)에 기술된 방법론을 승인한다" — 외에 "다음 예외를 두고" 류의 단서
      조항이 어떤 색인 자료에서도 나타나지 않는다. 이는 무조건부 승인과 일관되지만,
      Section C 전문을 읽지 못했으므로 무조건부 승인이라고 **확정할 수는 없다**.
    source_url: "https://www.govinfo.gov/app/details/GOVPUB-Y3_N88-PURL-gpo37127"
    notes: >-
      GAP. Resolve by obtaining RG 1.217 (ADAMS ML092900004, nrc.gov/docs/ML0929/ML092900004.pdf)
      and re-running scripts/ingest_raw.py; then replace this record with the verbatim
      Section C positions. This is the single highest-value remaining gap in the corpus:
      it determines whether the US regulator accepts NEI 07-13 as written — including the
      Modified NDRC / reduced Chang / reduced Degen / CEA-EDF selection in CW-08 — or with
      qualifications.
