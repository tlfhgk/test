clauses:

  - clause_id: EU-2014-87-framework
    source_id: EU-2014-87-EURATOM
    locator: "Council Directive 2014/87/Euratom, Articles 8a and 8b"
    heading_en: "Nuclear safety objective and the defence-in-depth hazard clause"
    heading_ko: "원자력안전 목표 및 심층방어 재해 조항"
    topics: [T01, T04, T12, T13]
    text_status: verbatim
    verification: primary_source
    confidence: high
    summary_en: >-
      Article 8a(1): Member States shall ensure the national framework requires nuclear
      installations to be "designed, sited, constructed, commissioned, operated and
      decommissioned with the objective of preventing accidents and, should an accident occur,
      mitigating its consequences and avoiding: (a) early radioactive releases that would
      require off-site emergency measures but with insufficient time to implement them;
      (b) large radioactive releases that would require protective measures that could not be
      limited in area or time." Article 8a(2)(a) applies that objective to installations for
      which a construction licence is granted for the first time after 14 August 2014, and
      8a(2)(b) makes it a reference for reasonably practicable improvements to existing
      installations.
      Article 8b(1)(a): where defence in depth applies, it shall be applied to ensure that
      "the impact of extreme external natural and UNINTENDED MAN-MADE hazards is minimised" —
      followed by (d) accidents within the design basis are controlled and (e) severe
      conditions are controlled.
      Recital 20 requires an applicant for a new power or research reactor to demonstrate that
      the design limits the effects of reactor core damage to within the containment, proving
      a large or unauthorised release outside containment is extremely unlikely.
    summary_ko: >-
      제8a조 제1항: 회원국은 국가체계가 원자력시설을 "사고를 예방하고, 사고 발생 시 그 결과를
      완화하며, 다음을 회피할 목적으로 설계·입지·건설·시운전·운전·해체"하도록 요구할 것을
      보장해야 한다: (a) 부지 외 비상조치를 요하나 이를 시행할 시간이 부족한 조기 방사성물질
      방출; (b) 구역이나 시간으로 제한할 수 없는 방호조치를 요하는 대량 방사성물질 방출.
      제8a조 제2항 (a)는 2014년 8월 14일 이후 최초로 건설허가가 부여된 시설에 이 목표를
      적용하고, (b)는 기존 시설의 합리적으로 실행 가능한 개선의 기준으로 삼도록 한다.
      제8b조 제1항 (a): 심층방어가 적용되는 경우 "극한 외부 자연재해 및 **의도하지 않은
      인위적(unintended man-made)** 재해의 영향이 최소화"되도록 적용되어야 하며,
      (d) 설계기준 내 사고의 제어, (e) 심각조건의 제어가 뒤따른다.
      전문 (20)은 신규 발전용·연구용 원자로 허가 신청자가 설계가 노심손상의 영향을 격납건물
      내로 제한함을 입증하고, 격납건물 외부로의 대량·비인가 방출이 극히 발생가능성이 낮음을
      증명하도록 요구한다.
    key_parameters:
      objective: "prevent accidents; avoid early and large releases"
      hazard_wording: "extreme external natural and UNINTENDED man-made hazards"
      new_build_cutoff: "construction licence first granted after 14 August 2014"
      transposition_deadline: "15 August 2017"
      peer_review_cycle: "first topical peer review 2017, then at least every six years"
      prescribes_aircraft_load: false
    source_url: "https://eur-lex.europa.eu/eli/dir/2014/87/oj"
    notes: >-
      UPGRADED FROM model_knowledge TO primary_source, and one wording point matters for
      CW-10. Article 8b(1)(a) says "unintended man-made hazards": the directive's
      defence-in-depth clause reaches the ACCIDENTAL aircraft crash and expressly not the
      deliberate one. That is a tighter statement than the earlier record's general claim
      that security is outside scope — the exclusion is visible in the operative article, not
      only in the recitals.
      Article 3 also supplies the definitions the whole comparison rests on: "design basis"
      is "the range of conditions and events taken explicitly into account in the design ...
      so that the installation can withstand them without exceeding authorised limits by the
      planned operation of safety systems", and "severe conditions" are "conditions that are
      more severe than conditions related to design basis accidents".
