schema_version: 1
source_id: IAEA-SSG-68
also_covers: [IAEA-SSR-2-1, IAEA-SSG-79, IAEA-SRS-86, IAEA-SRS-87, IAEA-SRS-88]
license_warning: >-
  IAEA publications are copyrighted but freely downloadable. Records below are summaries.
  Place downloaded PDFs in corpus/raw/ (gitignored) and run scripts/ingest_raw.py to index
  the verbatim paragraphs locally.
clauses:

  - clause_id: IAEA-SSR-2-1-req17
    source_id: IAEA-SSR-2-1
    locator: "SSR-2/1 (Rev. 1), Requirement 17 and paras. 5.15A, 5.15B, 5.17, 5.19"
    heading_en: "Internal and external hazards — the top-level design requirement"
    heading_ko: "내·외부 재해 — 최상위 설계요건"
    topics: [T01, T02, T04, T06]
    text_status: verbatim
    verification: primary_source
    confidence: high
    summary_en: >-
      "Requirement 17: Internal and external hazards. All foreseeable internal hazards and
      external hazards, including the potential for human induced events directly or
      indirectly to affect the safety of the nuclear power plant, shall be identified and
      their effects shall be evaluated. Hazards shall be considered in designing the layout
      of the plant and in determining the postulated initiating events and generated loadings
      for use in the design of relevant items important to safety for the plant."
      5.15A: "Items important to safety shall be designed and located, with due consideration
      of other implications for safety, to withstand the effects of hazards or to be
      protected, in accordance with their importance to safety, against hazards and against
      common cause failure mechanisms generated by hazards."
      5.15B: "For multiple unit plant sites, the design shall take due account of the
      potential for specific hazards to give rise to impacts on several or even all units on
      the site simultaneously."
      5.17: the design shall include due consideration of natural and human induced external
      events identified in the SITE EVALUATION PROCESS; causation and likelihood shall be
      considered in postulating potential hazards.
      5.19: features shall be provided to minimize interactions between buildings containing
      items important to safety, INCLUDING POWER CABLING AND CONTROL CABLING, and any other
      plant structure as a result of external events.
    summary_ko: >-
      "요건 17: 내부 및 외부 재해. 원전의 안전에 직접 또는 간접적으로 영향을 미칠 수 있는
      인위적 사건의 가능성을 포함하여, 예측 가능한 모든 내부 재해와 외부 재해를 식별하고
      그 영향을 평가해야 한다. 재해는 발전소 배치 설계 시, 그리고 안전에 중요한 관련
      품목의 설계에 사용할 가정 기인사건과 발생 하중을 정할 때 고려되어야 한다."
      5.15A: "안전에 중요한 품목은 안전에 대한 다른 함의를 적절히 고려하여, 재해의 영향을
      견디거나 그 안전 중요도에 따라 재해 및 재해로 유발되는 공통원인고장 메커니즘으로부터
      방호되도록 설계·배치되어야 한다."
      5.15B: "다수호기 부지의 경우, 특정 재해가 부지 내 여러 호기 또는 전 호기에 동시에
      영향을 미칠 가능성을 설계에서 적절히 고려해야 한다."
      5.17: 설계는 **부지평가 과정**에서 식별된 자연적·인위적 외부사건을 적절히 고려해야
      하며, 잠재 재해를 가정할 때 인과관계와 발생가능성을 고려해야 한다.
      5.19: 외부사건의 결과로 안전에 중요한 품목을 수용한 건물(**전력·제어 케이블 포함**)과
      다른 발전소 구조물 간의 상호작용을 최소화하는 설비를 갖추어야 한다.
    key_parameters:
      requirement_scope: "all foreseeable internal AND external hazards, incl. human induced events"
      two_design_uses: ["plant layout design", "postulated initiating events and generated loadings"]
      common_cause: "protection against common cause failure mechanisms generated by hazards (5.15A)"
      multi_unit: "simultaneous impact on several or all units on the site (5.15B)"
      site_link: "external events identified in the site evaluation process (5.17)"
      cabling: "power and control cabling explicitly named (5.19)"
    source_url: "https://www.iaea.org/publications/10646/safety-of-nuclear-power-plants-design"
    notes: >-
      UPGRADED FROM model_knowledge. Two elements the earlier summary did not carry, both
      material to this comparison. First, 5.15B requires multi-unit sites to consider a
      hazard hitting several or all units SIMULTANEOUSLY — no other document in this corpus
      states that for aircraft crash, and it matters because an aircraft impact is exactly
      the kind of hazard that can cross unit boundaries on a shared site. Second, 5.19 names
      POWER AND CONTROL CABLING among the interactions to be minimised, which is the same
      support-scope point NEI 07-13 makes when it judges survivability on power supplies and
      cable runs rather than on components alone (US-NEI-07-13-safety-function-assessment).
      Requirement 17 also fixes the two design uses of a hazard — plant LAYOUT and the
      derivation of postulated initiating events and LOADINGS — which is the hook SSG-68
      paras. 5.161-5.192 elaborate for aircraft crash.

  - clause_id: IAEA-SSG-68-scope
    source_id: IAEA-SSG-68
    locator: "SSG-68, paras. 1.7, 1.12, 1.13 and footnotes 2-3"
    heading_en: "Scope: design against external events including aircraft crash"
    heading_ko: "적용범위: 항공기 추락을 포함한 외부사건 대비 설계"
    topics: [T01, T02, T04]
    text_status: verbatim
    verification: primary_source
    confidence: high
    summary_en: >-
      Para. 1.12: the Safety Guide applies to ALL TYPES OF NUCLEAR INSTALLATION — power
      plants, research reactors and adjoining radioisotope production facilities, spent fuel
      storage, enrichment, fuel fabrication, conversion, reprocessing, predisposal waste
      management and fuel-cycle R&D facilities.
      Para. 1.13: it applies to the DESIGN OF NEW installations AND the SAFETY EVALUATION OF
      EXISTING ones, for external events including human induced events, of which
      "(i) Accidental aircraft crashes" is the first listed, followed by explosions with or
      without fire and secondary missiles, releases of corrosive or hazardous gases or
      liquids, off-site radioactive releases, off-site or on-site fire, ship or debris
      collision with safety related structures such as water intakes or the ultimate heat
      sink, vehicle collision with SSCs, and electromagnetic interference.
      Para. 1.7: "This Safety Guide supersedes IAEA Safety Standards Series No. NS-G-1.5,
      External Events Excluding Earthquakes in the Design of Nuclear Power Plants."
      Footnote 2 defines a design basis external event as "an external event, or a
      combination of external events, that is considered in the design basis of all or any
      part of a facility", adding that design basis external events "are INDEPENDENT OF THE
      INSTALLATION LAYOUT". Footnote 3 defines a beyond design basis external event as "a
      level of external hazard exceeding those hazard levels considered for design, derived
      from the hazard evaluation for the site", identified so the design incorporates
      features enhancing the installation's capability to withstand such events and so that
      design margins can be evaluated.
    summary_ko: >-
      1.12항: 본 안전지침은 **모든 유형의 원자력시설**에 적용된다 — 원전, 연구로 및 부속
      방사성동위원소 생산시설, 사용후핵연료 저장시설, 농축, 핵연료 제조, 변환, 재처리,
      핵연료주기시설 방사성폐기물 처분전 관리, 핵연료주기 관련 연구개발시설.
      1.13항: **신규 시설의 설계**와 **기존 시설의 안전평가** 모두에 적용되며, 인위적
      외부사건 중 "(i) 우발적 항공기 추락"이 첫 번째로 열거되고, 이어 화재·2차 미사일을
      수반하거나 수반하지 않는 폭발, 부식성·유해 기체·액체의 방출, 부지 외부 방사성물질
      방출, 부지 내외 화재, 취수구나 최종열침원 관련 구조물 등 안전관련 구조물에 대한
      선박·부유물 충돌, 차량의 SSC 충돌, 전자기 간섭이 뒤따른다.
      1.7항: "본 안전지침은 IAEA 안전기준 시리즈 NS-G-1.5 「원전 설계에서 지진을 제외한
      외부사건」을 대체한다."
      각주 2는 설계기준 외부사건을 "시설의 전부 또는 일부의 설계기준에서 고려되는 외부사건
      또는 외부사건의 조합"으로 정의하며, 설계기준 외부사건은 **시설 배치와 독립적**이라고
      부기한다. 각주 3은 설계기준초과 외부사건을 "부지 재해평가로부터 도출된, 설계에서 고려한
      재해수준을 초과하는 외부재해 수준"으로 정의하고, 그러한 사건을 식별하는 목적은 시설이
      이를 견딜 능력을 향상시키는 설계특성을 반영하고 설계 여유도를 평가하기 위함이라고 한다.
    key_parameters:
      applies_to: "all types of nuclear installation; new design AND safety evaluation of existing"
      aircraft_position: "accidental aircraft crash is the first listed human induced event (1.13(a)(i))"
      dbee_definition: "external event or combination considered in the design basis; INDEPENDENT of installation layout"
      bdbee_definition: "hazard level exceeding those considered for design, derived from the site hazard evaluation"
      supersedes: "NS-G-1.5 (2003)"
    source_url: "https://www.iaea.org/publications/14666/design-of-nuclear-installations-against-external-events-excluding-earthquakes"
    notes: >-
      Structural note for the comparison: SSG-68 is the only document in this corpus that
      covers BOTH the design-basis and the beyond-design-basis level for aircraft crash in
      one public, freely available text. It is therefore the natural bridge between the
      Czech/EUR design-basis approach and the US beyond-design-basis approach.
      Footnote 2 adds a point no other document in this corpus makes: design basis external
      events are INDEPENDENT OF THE INSTALLATION LAYOUT. That is the conceptual separation
      EUR implements structurally with its standard-design layer (a fixed aircraft load
      function for every EUR plant) and that the Czech decrees deliberately do not adopt,
      deriving everything from the site through § 11.

  - clause_id: IAEA-SSG-79-spl
    source_id: IAEA-SSG-79
    locator: "SSG-79, screening probability level (footnote) and the aircraft crash screening steps"
    heading_en: "Screening probability level and its application to aircraft crash"
    heading_ko: "스크리닝 확률수준과 항공기 추락에의 적용"
    topics: [T05, T02]
    text_status: summary
    verification: primary_source
    confidence: high
    summary_en: >-
      SSG-79 defines the screening probability level (SPL) as "the limiting value of the annual
      probability of occurrence of events with potential radiological consequences", and states
      that if the probability of occurrence is less than the specified SPL, no further analysis
      is necessary for that source. The SPL "should be chosen such that the radiation risk
      associated with hazards is acceptably low"; if the probability exceeds it, a detailed
      evaluation should be performed.
      On the value: "In some States, a probability of 10^-7 per reactor-year is used in the
      design of new facilities as one acceptable limit on the probability value for interacting
      events with serious radiological consequences, and this is considered a conservative
      value for the screening probability level if applied to all events of the same type."
      Applied to aircraft: the probability of crashing is determined per aircraft category
      (general aviation, medium and large commercial aircraft, military aircraft) and compared
      with the SPL; "those aircraft crashes for which the probability of occurrence is less
      than the screening probability level can be screened out."
    summary_ko: >-
      SSG-79는 스크리닝 확률수준(SPL)을 "방사선학적 결과를 초래할 수 있는 사건의 연간
      발생확률의 한계값"으로 정의하고, 발생확률이 지정된 SPL 미만이면 해당 요인에 대해
      추가 해석이 불필요하다고 규정한다. SPL은 "재해와 관련된 방사선 위험이 수용 가능하게
      낮도록" 선정되어야 하며, 확률이 이를 초과하면 상세평가를 수행해야 한다.
      값에 관하여: "일부 국가에서는 심각한 방사선학적 결과를 갖는 상호작용 사건의 확률에
      대한 하나의 수용 가능한 한계값으로 신규 시설 설계 시 원자로-년당 10^-7을 사용하며,
      이는 동일 유형의 모든 사건에 적용될 경우 스크리닝 확률수준으로서 보수적인 값으로
      간주된다."
      항공기 적용: 추락확률을 항공기 범주별(일반항공, 중형·대형 상용항공기, 군용항공기)로
      산정하여 SPL과 비교하며, "발생확률이 스크리닝 확률수준보다 낮은 항공기 추락은 배제할
      수 있다."
    key_parameters:
      spl_definition: "limiting value of the annual probability of occurrence of events with potential radiological consequences"
      spl_value: "1E-7 per reactor-year, used in some States"
      application_rule: "conservative only if applied to all events of the same type collectively"
      aircraft_categories: ["general aviation", "medium and large commercial aircraft", "military aircraft"]
      supersedes: "NS-G-3.1, External Human Induced Events in Site Evaluation for Nuclear Power Plants (2002)"
    source_url: "https://www-pub.iaea.org/MTCD/Publications/PDF/PUB2036_web.pdf"
    notes: >-
      DOUBLE CORRECTION — this record was right, then wrongly "corrected", and is now restored
      from the primary text. Sequence: (1) the first build attributed the 1E-7 SPL to SSG-79
      from a search result; (2) on finding the same statement as footnote 9 of SSG-68, this
      database demoted the SSG-79 record to to_verify and called the attribution an error;
      (3) the SSG-79 text itself shows the statement IS in SSG-79, in almost identical wording,
      and that SSG-79 supersedes NS-G-3.1. Both documents carry it. SSG-68 cites NS-G-3.1 as
      its source because SSG-68 was published first; that is chronology, not a contradiction.
      SSG-79 adds what SSG-68 does not: the per-aircraft-category screening procedure.
      This is the strongest quantitative link to the Czech § 11(4)(b) 1E-7/yr level.

  - clause_id: IAEA-SRS-86-framework
    source_id: IAEA-SRS-86
    locator: "Safety Reports Series No. 86"
    heading_en: "Framework and roadmap for human-induced external events"
    heading_ko: "인위적 외부사건에 대한 체계 및 로드맵"
    topics: [T02, T04, T06]
    text_status: verbatim
    verification: primary_source
    confidence: high
    summary_en: >-
      Objective: "to provide the framework of methods to be implemented for the design and
      evaluation of nuclear facilities subjected to extreme human induced external events.
      This framework addresses the performance of the overall facility, and individual SSCs,
      from the standpoint of complying with the fundamental safety functions."
      Scope: the report concentrates on developing a methodology and its application to
      existing and new nuclear power plants, extensible to other facilities with suitable
      grading based on potential radioactive releases. Two limits are stated explicitly:
      "The external events considered are limited to human induced events of ACCIDENTAL
      ORIGIN and EXCLUDE EVENTS THAT MAY BE THE RESULT OF MALEVOLENT ACTION", and the
      guidance "represents expert opinion but does not constitute recommendations made on
      the basis of a consensus of Member States". The report also defines a SUCCESS PATH as
      "a set of systems and associated components that can be used to bring the plant to a
      stable hot or cold shutdown condition and to maintain this condition for a specified
      period of time".
    summary_ko: >-
      목적: "극한 인위적 외부사건을 받는 원자력시설의 설계 및 평가에 적용할 방법론 체계를
      제공하는 것. 본 체계는 기본 안전기능 충족 관점에서 시설 전체와 개별 SSC의 성능을
      다룬다."
      범위: 방법론 개발과 기존·신규 원전 적용에 중점을 두며, 잠재 방사성물질 방출에 따른
      적절한 등급화를 통해 다른 시설로 확장 가능하다. 두 가지 한계가 명시된다 —
      "고려되는 외부사건은 **우발적 기원**의 인위적 사건에 한정되며 **악의적 행위에 의한
      사건은 제외**한다", 그리고 본 지침은 "전문가 의견을 나타내며 회원국 합의에 기반한
      권고를 구성하지 않는다". 또한 **성공경로(success path)**를 "발전소를 안정적 고온 또는
      저온 정지상태로 이행시키고 그 상태를 지정된 기간 동안 유지하는 데 사용할 수 있는
      계통 및 관련 기기의 집합"으로 정의한다.
    key_parameters:
      scope_limit: "human induced events of ACCIDENTAL origin only; malevolent action excluded"
      normative_weight: "expert opinion, not a consensus recommendation of Member States"
      evaluation_level: "overall facility AND individual SSCs, against the fundamental safety functions"
      success_path: "systems and components able to reach and hold stable hot or cold shutdown for a specified period"
    source_url: "https://www-pub.iaea.org/MTCD/Publications/PDF/P1721_web.pdf"
    notes: >-
      The explicit exclusion of malevolent action matters for CW-10: the whole SRS 86/87/88
      set — including the structural methods in SRS-87 that CW-08 compares against
      NEI 07-13 — is scoped to the ACCIDENTAL crash. Applying those methods to a deliberate
      impact is outside what the reports claim to cover.

  - clause_id: IAEA-SRS-87-structures
    source_id: IAEA-SRS-87
    locator: "Safety Reports Series No. 87"
    heading_en: "Assessment of structures under human-induced external events"
    heading_ko: "인위적 외부사건 하 구조물 평가"
    topics: [T07, T08, T09, T10]
    text_status: summary
    verification: primary_source
    confidence: high
    summary_en: >-
      SRS No. 87 (220 pp.) is the structural-assessment volume of the three-part set. It
      supports quantitative evaluation of the engineering safety of facilities subjected to
      accidental or postulated human-induced external events. It derives the soft-missile
      loading function by the Riera method (§2.2.2), covers simplified and detailed
      structural models, induced vibration with recommended damping values, and fire and
      fireball phenomena. For local damage it presents a CATALOGUE of empirical formulas —
      Chang, modified Chang, CRIEPI, NDRC and modified NDRC, and Degen — with their symbols
      and validity notes, rather than mandating one. It states that empirical formulas are
      typically based on lightly reinforced (0.3-1.5% each way) concrete targets without
      transverse reinforcement, that application to heavily reinforced targets is
      conservative, and that most formulas were developed with SOLID projectiles: when used
      for aircraft engine parts or landing gear, reduction factors between 0.60 and 0.65 are
      usually appropriate to account for projectile deformability. IAEA Safety Reports are
      informative: the document states its contents "do not constitute recommendations made
      on the basis of a consensus of Member States".
    summary_ko: >-
      SRS 제87호(220쪽)는 3부작 중 구조물 평가 편이다. 연성 미사일 하중함수를 Riera 방법으로
      도출하고(§2.2.2), 단순화·상세 구조모델, 권장 감쇠값을 포함한 유발진동, 화재 및 화구
      현상을 다룬다. 국부손상에 대해서는 Chang, modified Chang, CRIEPI, NDRC 및 modified
      NDRC, Degen 식을 기호·유효범위와 함께 **카탈로그 형태로 제시**할 뿐 특정 식을 강제하지
      않는다. 경험식들은 통상 횡방향 철근이 없는 저배근(각 방향 0.3~1.5%) 콘크리트 표적
      데이터에 기반하며, 고배근 표적에 적용하면 보수적이라고 기술한다. 또한 대부분의 식이
      **고체(solid) 발사체** 시험으로 개발되었으므로, 항공기 엔진 부품이나 착륙장치에 적용할
      때는 발사체 변형성을 고려하여 **0.60~0.65의 감소계수**를 적용하는 것이 통상 적절하다고
      명시한다. IAEA 안전보고서는 정보성 문서로, 그 내용이 "회원국 합의에 기반한 권고를
      구성하지 않는다"고 스스로 밝힌다.
    key_parameters:
      role: "quantitative structural engineering safety evaluation"
      counterpart: "NEI 07-13 structural chapters"
      loading_method: "Riera method (§2.2.2)"
      local_damage_formulas_presented: ["Chang", "modified Chang", "CRIEPI", "NDRC / modified NDRC", "Degen"]
